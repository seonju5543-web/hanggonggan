<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  HWP·DOCX 신청서를 PDF 로 바꿀 때 글꼴 바꿔치기 표 (2026-10-14 · collector/form-pdf.mjs 와 한 세트).
  왜: 러너에는 한글 문서가 쓰는 글꼴(함초롬바탕·함초롬돋움·맑은 고딕·굴림·돋움·바탕·HY견고딕…)이 없다. 이름을 모르는 글꼴은 fontconfig 가
      '한글이 되는 아무 글꼴'로 때우는데, Playwright 의존성으로 깔린 **WenQuanYi Zen Hei(중국어 글꼴)·Unifont** 가 골라졌다(2026-10-12 실측:
      만든 PDF 14개 전부). 글자 폭·줄 높이가 달라 표 칸에서 글자가 넘치고 겹쳤다(춘곡장학회 신청서). 이 표는 그 이름들을 같은 계열의
      한글 글꼴(나눔고딕·나눔명조 — fonts-nanum · Noto Sans/Serif CJK KR — fonts-noto-cjk)로 못 박는다.
  설치: 사용자 fontconfig 폴더(~/.config/fontconfig/conf.d/)에 복사 — collector/install-form-fonts.sh.
  ⚠️ 글자 하나 안 바꾼다 — 바뀌는 것은 글꼴뿐이다. 글꼴이 달라 줄 바꿈 자리가 달라질 수는 있다(원본 글꼴을 깔면 그것도 사라진다 — 함초롬체는
     한컴이 무료 배포하지만 고정 주소가 없어 로봇이 받지 않는다 · 개발자가 저장소에 넣어 주면 그때 이 표보다 앞선다).
-->
<fontconfig>
  <!-- 고딕(산세리프) 계열 → 나눔고딕 -->
  <alias binding="same"><family>함초롬돋움</family><prefer><family>NanumGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>HCR Dotum</family><prefer><family>NanumGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>맑은 고딕</family><prefer><family>NanumGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>Malgun Gothic</family><prefer><family>NanumGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>굴림</family><prefer><family>NanumGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>Gulim</family><prefer><family>NanumGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>굴림체</family><prefer><family>NanumGothicCoding</family><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>돋움</family><prefer><family>NanumGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>Dotum</family><prefer><family>NanumGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>돋움체</family><prefer><family>NanumGothicCoding</family><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>한양신명조</family><prefer><family>NanumMyeongjo</family><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>HY견고딕</family><prefer><family>NanumGothicExtraBold</family><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>HY중고딕</family><prefer><family>NanumGothicBold</family><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>HY헤드라인M</family><prefer><family>NanumGothicExtraBold</family><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>휴먼둥근헤드라인</family><prefer><family>NanumSquareRound</family><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>나눔고딕</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>나눔명조</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <!-- 명조(세리프) 계열 → 나눔명조 -->
  <alias binding="same"><family>함초롬바탕</family><prefer><family>NanumMyeongjo</family><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>HCR Batang</family><prefer><family>NanumMyeongjo</family><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>바탕</family><prefer><family>NanumMyeongjo</family><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>Batang</family><prefer><family>NanumMyeongjo</family><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>바탕체</family><prefer><family>NanumMyeongjo</family><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>궁서</family><prefer><family>NanumMyeongjo</family><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>HY신명조</family><prefer><family>NanumMyeongjo</family><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>HY견명조</family><prefer><family>NanumMyeongjoExtraBold</family><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>신명조</family><prefer><family>NanumMyeongjo</family><family>Noto Serif CJK KR</family></prefer></alias>
  <!-- 한글이 든 문서의 기본값: 이름 모를 글꼴도 중국어 글꼴보다 한글 글꼴을 먼저 -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="append" binding="weak"><string>NanumGothic</string></edit>
  </match>
  <alias><family>sans-serif</family><prefer><family>NanumGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias><family>serif</family><prefer><family>NanumMyeongjo</family><family>Noto Serif CJK KR</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>NanumGothicCoding</family></prefer></alias>
</fontconfig>
