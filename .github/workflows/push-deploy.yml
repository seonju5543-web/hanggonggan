name: 푸시 서버 배포 (Cloudflare 운영에 올리고 올라갔는지 확인)

# 2026-10-12 · 알림 재발 수리 — "앱을 켜야만 알림이 온다"가 되풀이된 데서 **확인한 사실 하나**(원인 후보 · 폰 도달은 안 쟀다):
#   푸시 발송 서버(server/push/)는 Cloudflare 대시보드의 GitHub 연결 빌드(Workers Builds)로 올라가게 돼 있었는데,
#   2026-10-12 실측으로 기본 브랜치 커밋 328cf445 의 빌드가 성공하고도 운영은 옛 판이었다(push-limit-check 실행 3: 운영 400×60 · main 미리보기 429×10).
#   즉 적어도 그날은 저장소에서 고친 서버 코드가 운영에 닿지 않았고, 그 전 수리들이 언제 운영에 닿았는지도 알 길이 없었다.
#   어느 대시보드 설정이 틀렸는지는 세션이 대시보드를 못 봐 확인하지 못했다 — 그래서 대시보드 설정에 기대지 않는 길을 하나 둔다.
#
# 하는 일
#   ① 기본 브랜치에 server/push/·server/shared/ 가 바뀐 커밋이 올라오면(또는 버튼) wrangler 로 **운영에 직접** 올린다.
#      판 도장(tools/push-build-stamp.mjs — 묶음 파일 내용의 해시)을 서버 변수 BUILD 로 같이 올린다.
#   ② 올린 뒤 /health 의 build 가 그 도장인지 **읽어서** 확인한다(올렸다고 믿지 않는다 — 10-12 의 교훈).
#      다르면 실패 + 경보 이슈 · 같으면 옛 경보를 닫는다. 매일 확인(push-health.yml)도 같은 도장을 대조한다.
#
# 🔴 열쇠(저장소 시크릿) — 없으면 올리지 못하고 **경보 이슈로 말한다**(조용히 초록이 되지 않는다):
#   CLOUDFLARE_API_TOKEN   Cloudflare → My Profile → API Tokens → Create Token → 「Edit Cloudflare Workers」 틀
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 대시보드 → Workers & Pages 오른쪽(또는 주소창의 dash.cloudflare.com/<여기>/…)
#   VAPID 열쇠·ADMIN_KEY·KV 는 건드리지 않는다 — wrangler deploy 는 시크릿을 지우지 않고 KV 는 wrangler.toml 의 번호로 잇는다.
# 🔴 두 길로 올리지 않는다 — 이 워크플로를 켠 뒤에는 Cloudflare 의 GitHub 연결 빌드를 끊는다(server/push/README.md 2단계).
#    두 길이 같은 워커를 번갈아 올리면 어느 판이 도는지 다시 알 수 없게 된다(연결 빌드로 올린 판은 도장이 없어 매일 확인이 경보한다).
# 🔴 기본 브랜치에서만 — branches: 를 빼면 server/push/ 를 고친 어떤 브랜치든 운영을 덮어쓴다(CLAUDE.md push-to-run 규칙과 같은 사고).

on:
  push:
    branches: [claude/nice-heisenberg-WESq5]
    paths:
      - 'server/push/**'
      - 'server/shared/**'
      - 'tools/push-build-stamp.mjs'
      - '.github/workflows/push-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: push-deploy          # 같은 워커를 두 실행이 동시에 올리지 않는다 · 도는 실행은 끊지 않는다(대기 줄은 GitHub 이 최신 하나만 남긴다 — 각 실행이 기본 브랜치 끝을 올리므로 무해)
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEALTH_URL: https://handaejang-push.seonju5543.workers.dev/health
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nice-heisenberg-WESq5     # 버튼으로 눌러도 기본 브랜치의 판을 올린다(다른 브랜치의 덜 된 판이 운영에 가지 않게)
          sparse-checkout: |
            .github/actions
            tools
            server/push
            server/shared

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 판 도장
        id: stamp
        run: |
          STAMP=$(node tools/push-build-stamp.mjs)
          echo "도장: $STAMP"; node tools/push-build-stamp.mjs --files | sed 's/^/  /'
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"

      - name: 열쇠 확인
        id: keys
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::배포 열쇠가 없습니다 — 저장소 Settings → Secrets and variables → Actions 에 CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID 를 넣으세요 (server/push/README.md 2단계)."
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      # 🔴 라벨은 push-deploy — 매일 확인(push-health.yml)이 push-health 라벨의 열린 이슈를 '정상이면' 전부 닫고, 같은 라벨이 열려 있으면 제 경보를 안 만든다.
      #    같은 라벨을 쓰면 운영이 멀쩡한 날의 매일 확인이 배포 실패 경보를 닫아 버린다(리뷰). 제목은 셋이 같아 alert-issue 가 하나로 모은다.
      - name: 🚨 열쇠가 없어 올리지 못했다
        if: steps.keys.outputs.missing == 'true'
        uses: ./.github/actions/alert-issue
        with:
          token: ${{ github.token }}
          title: "🚨 푸시 서버 배포 실패"
          label: push-deploy
          label-description: 푸시 발송 서버 배포 경보
          assignee: ${{ github.repository_owner }}
          body: |
            푸시 발송 서버를 운영에 올리지 못했습니다 — **배포 열쇠가 저장소에 없습니다.**

            저장소 Settings → Secrets and variables → Actions → New repository secret 에
            `CLOUDFLARE_API_TOKEN`(「Edit Cloudflare Workers」 틀로 만든 토큰)과 `CLOUDFLARE_ACCOUNT_ID` 를 넣고,
            Actions → 「푸시 서버 배포」 → Run workflow 를 누르세요. 절차는 `server/push/README.md` 2단계.

            그동안 운영은 옛 판이 돕니다 — 저장소에서 고친 알림 수리가 학생 폰에 닿지 않습니다.

            실행 기록: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ---
            _Generated by [Claude Code](https://claude.ai/code)_

      - name: 열쇠가 없으면 여기서 실패로 끝낸다
        if: steps.keys.outputs.missing == 'true'
        run: exit 1

      - name: wrangler 설치
        working-directory: server/push
        run: npm install --no-audit --no-fund --loglevel=error

      - name: 운영에 올린다 (wrangler deploy)
        id: deploy
        working-directory: server/push
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAMP: ${{ steps.stamp.outputs.stamp }}
        run: |
          # --var BUILD:<도장> — wrangler.toml 의 [vars] 에 더해진다 · 시크릿(VAPID·ADMIN_KEY)은 그대로 남는다
          npx wrangler deploy --var "BUILD:$STAMP"

      - name: 올라갔는지 /health 로 읽어서 확인한다
        id: verify
        env:
          STAMP: ${{ steps.stamp.outputs.stamp }}
        run: |
          # 전 세계 배포가 몇 초 걸린다 — 10초씩 최대 9번(90초) 본다 · 읽은 값으로만 판정한다
          for i in $(seq 1 9); do
            BODY=$(curl -sS --max-time 20 "$HEALTH_URL" || true)
            GOT=$(printf '%s' "$BODY" | jq -r '.build // empty' 2>/dev/null || true)
            echo "[$i] build=${GOT:-없음}"
            if [ "$GOT" = "$STAMP" ]; then
              echo "✅ 운영 /health 의 build 가 저장소 도장과 같습니다 ($STAMP)" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 10
          done
          echo "::error::올린 뒤에도 운영 /health 의 build(${GOT:-없음})가 저장소 도장($STAMP)과 다릅니다 — 올리는 길이 운영이 아니거나 다른 길(대시보드·GitHub 연결 빌드)이 덮어썼을 수 있습니다."
          echo "❌ 운영 build=${GOT:-없음} · 저장소 도장=$STAMP" >> "$GITHUB_STEP_SUMMARY"
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "got=${GOT:-없음}" >> "$GITHUB_OUTPUT"
          exit 1

      - name: 🚨 올렸는데 운영이 그 판이 아니다
        if: failure() && steps.verify.outcome == 'failure'
        uses: ./.github/actions/alert-issue
        with:
          token: ${{ github.token }}
          title: "🚨 푸시 서버 배포 실패"
          label: push-deploy
          label-description: 푸시 발송 서버 배포 경보
          assignee: ${{ github.repository_owner }}
          body: |
            `wrangler deploy` 는 끝났는데 운영 `/health` 의 `build`(${{ steps.verify.outputs.got }})가 저장소 도장(${{ steps.stamp.outputs.stamp }})과 다릅니다.

            확인할 것 — Cloudflare 대시보드 → Workers → `handaejang-push`:
            · **Settings → Build** 에 GitHub 연결(Workers Builds)이 아직 붙어 있으면 끊으세요(두 길이 번갈아 올리면 어느 판이 도는지 알 수 없습니다 — `server/push/README.md` 2단계).
            · **Deployments** 맨 위 판이 방금 올린 것인지(시각) 보세요.

            실행 기록: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ---
            _Generated by [Claude Code](https://claude.ai/code)_

      - name: 🚨 wrangler 가 올리지 못했다
        if: failure() && steps.deploy.outcome == 'failure'
        uses: ./.github/actions/alert-issue
        with:
          token: ${{ github.token }}
          title: "🚨 푸시 서버 배포 실패"
          label: push-deploy
          label-description: 푸시 발송 서버 배포 경보
          assignee: ${{ github.repository_owner }}
          body: |
            `wrangler deploy` 가 실패했습니다 — 실행 기록의 「운영에 올린다」 단계 로그를 보세요
            (열쇠 권한(「Edit Cloudflare Workers」 틀인지) · 계정 번호 · wrangler.toml 의 바인딩(KV 번호 · 요청 횟수 제한)이 흔한 원인입니다 — 원인은 로그로 확인한 것만 적습니다).

            실행 기록: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ---
            _Generated by [Claude Code](https://claude.ai/code)_

      - name: 올라갔으면 옛 배포 경보를 닫는다
        if: steps.verify.outputs.ok == 'true'
        uses: ./.github/actions/alert-issue
        with:
          token: ${{ github.token }}
          mode: resolve
          title: "🚨 푸시 서버 배포 실패"
          body: |
            ✅ 운영에 올라갔고 `/health` 의 `build` 가 저장소 도장(${{ steps.stamp.outputs.stamp }})과 같습니다.

            ---
            _Generated by [Claude Code](https://claude.ai/code)_

      # 실행 알림 — 체크아웃·도장·wrangler 설치(npm)처럼 위 경보 셋이 안 다루는 자리에서 넘어진 날도 조용하지 않게 (robot-down · 관문 alerts ⑥).
      #   리뷰: 처음엔 '열쇠 확인 전'만 봐서 npm 설치 실패가 빨간불인데 이슈 없는 길이었다 → 경보 셋이 다루지 않은 실패 전부.
      - name: 🚨 로봇이 넘어졌다
        if: cancelled() || (failure() && steps.deploy.outcome != 'failure' && steps.verify.outcome != 'failure' && steps.keys.outputs.missing != 'true')
        uses: ./.github/actions/robot-down
        with:
          robot: 푸시 서버 배포
          token: ${{ github.token }}
