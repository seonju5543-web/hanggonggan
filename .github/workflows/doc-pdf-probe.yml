name: 공고문 PDF 변환 진단

# '이 첨부는 왜 PDF 로 안 바뀌나 · 바꾸면 무엇이 빠지나'를 진짜 변환기(LibreOffice + H2Orestart)로 보는 도구 (2026-11-20).
# 개발 컴퓨터에는 한글 변환기가 없어 원인을 여기서만 볼 수 있다 — 첫 실행의 「글자 빠짐」 4개를 %만 보고는 왜인지 알 수 없었다.
# 🔴 저장하지 않는다(contents: read · git add 없음) — 결과는 로그(파일마다 두 길의 남은 글자 % · 빠진 원본 줄)와 아티팩트(원본 · 평소 사본 · 글상자를 푼 사본 · 중간 꼴)뿐이다.
# 실행: Actions 에서 손으로 — ids 에 공고 id(쉼표) · 비우면 실패 장부의 「글자 빠짐」과 글자가 덜 남은 채 나가 있는 사본 전부.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: '공고 id (쉼표 구분 · 비우면 글자가 빠진 것 전부)'
        default: ''
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 설치 3분 + 파일 몇 개(파일 하나 최대 130초 + 다시 가는 길 140초 — doc-pdf FILE_MAX_SEC · RELAX_MAX_SEC · 평소 10초 안)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 변환기·글꼴 설치 (deep-fetch 의 「공고문 → PDF」 단계와 같은 것)
        timeout-minutes: 6
        run: |
          sudo apt-get update -qq -o DPkg::Lock::Timeout=120
          sudo apt-get install -y -qq -o DPkg::Lock::Timeout=120 libreoffice-writer libreoffice-core libreoffice-java-common fonts-nanum fonts-noto-cjk poppler-utils
          pip install olefile --quiet
          bash collector/install-h2orestart.sh
          bash collector/install-form-fonts.sh
      - name: 진단 (저장 안 함)
        timeout-minutes: 8
        env:
          PROBE_IDS: ${{ inputs.ids }}   # 🔴 입력은 env 로만 넘긴다(run 줄에 바로 끼우면 명령으로 읽힌다)
          DOC_PDF_PROBE_DIR: ${{ runner.temp }}/doc-pdf-probe
        run: node collector/doc-pdf.mjs "--probe=$PROBE_IDS"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: doc-pdf-probe
          path: ${{ runner.temp }}/doc-pdf-probe
          retention-days: 3
          if-no-files-found: ignore
