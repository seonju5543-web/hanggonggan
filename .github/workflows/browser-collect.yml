name: 브라우저형 수집 로봇

on:
  schedule:
    # UTC 자정 부근 혼잡 슬롯은 예약이 생략될 수 있어(2026-07-06 누락) 홀수 분 2회로 분산
    - cron: '7 23 * * *'   # 매일 08:07 KST
    - cron: '7 3 * * *'    # 매일 12:07 KST (아침 실행이 생략됐을 때 백업)
  workflow_dispatch:
  push:
    branches: ['claude/nice-heisenberg-WESq5']
    paths:
      - 'collector/run-browser-collect.txt'   # 이 파일을 수정해 push하면 자동 실행

permissions:
  contents: write
  issues: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  browse:
    runs-on: ubuntu-latest
    # 시간 상한 (2026-08-01) — 없으면 GitHub 기본값인 **6시간**까지 매달린다.
    # 실제로 7/31 브라우저 수집이 360분을 돌다 취소됐고, 수집 로봇 2종이 같은
    # 대기줄(concurrency: collector)을 쓰기 때문에 그동안 다음 수집이 줄을 섰다.
    # 학교를 더 붙일수록 '한 곳이 안 열려 멈추는' 확률도 같이 오른다.
    # 시간 상한: 스크립트가 스스로 22분 예산에 맞춰 끝내므로(HARVEST_BUDGET_MS) 30분이면 충분하다.
    # ⚠️ 40분이던 시절 학교가 17곳으로 늘자 4회 연속 이 상한에 걸려 **취소**됐고,
    #    취소는 아래 저장 단계까지 통째로 죽여서 그날 수집분이 전부 버려졌다(2026-08-02~03).
    #    상한을 올리는 것은 해법이 아니다 — 예산(HARVEST_BUDGET_MS)을 조절할 것.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 협업 병합기 등록 (충돌 자동 해소 — COLLAB.md)
        run: bash tools/setup-collab.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm init -y >/dev/null && npm i playwright@1 --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - id: run
        run: node collector/browser-collect.mjs
      - name: 정식 등록 자동화 (선조치후보고 — collector/auto-register-config.json으로 on/off)
        run: node collector/auto-register.mjs collector/browser-report.md
      - name: 신규 등록분 양식 원본 자동 확보 + 스키마화 (같은 실행 안에서 끝낸다)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          targets=$(node -e "let q;try{q=require('./collector/pending-forms.json')}catch(e){q={items:[]}};console.log(q.items.filter(i=>!i.fetched).map(i=>i.target).join(','))")
          if [ -n "$targets" ]; then
            FORM_TARGETS="$targets" node collector/deepfetch.mjs
            pip install olefile --quiet
            python3 collector/hwp-prvtext.py
            # 실제로 원본이 내려온 항목만 fetched로 표시한다 (전부 true로 찍어 원본 없는 항목이
            # 영원히 대기하던 버그 수정 — 2026-07-30)
            node collector/mark-fetched.mjs
          fi
          # 원본은 deepfetch가 매 실행마다 갈아엎으므로 스키마화는 반드시 같은 실행에서
          npm i @anthropic-ai/sdk --no-audit --no-fund --silent
          node collector/schematize-forms.mjs collector/browser-report.md

      # 원문 보충 (2026-08-03 도입) — 자격 요건이 사라지던 두 원인을 막는 단계.
      # 자세한 경위는 collect-scholarships.yml의 같은 단계 주석 참조. 증분이라 시간 부담 없음.
      - name: 공고 원문 보충 수집 (빠진 것·잘린 것만)
        run: node collector/deepfetch.mjs --fill

      - name: 공고 원문 발췌 갱신 (정직 원칙 — 추론 대신 원문 그대로)
        run: node collector/extract-excerpts.mjs --write

      # 데이터 관문 (2026-07-30 도입): 로봇이 바꾼 데이터가 규칙을 어기면 저장하지 않고 되돌린다.
      # 잘못된 공고가 앱에 하루라도 노출되는 일을 막는 장치 — 사람이 감사를 기억해서 돌릴 필요가 없다.
      # 위치 규칙 (2026-08-01): 관문은 **저장 직전**에 둔다. 예전엔 양식 스키마화보다 앞에 있어서
      # 스키마화가 만든 잘못된 연결이 그 실행에서는 안 잡히고 다음 날 실행에서 터졌다(이슈 #79).
      - name: 데이터 관문 (수집기 규칙 테스트 + 데이터 감사)
        id: audit
        continue-on-error: true
        run: |
          node verify/test-collector.mjs
          node verify/audit-data.js
      - name: 감사 실패 시 자동 등록분 되돌리기
        if: steps.audit.outcome == 'failure'
        run: |
          # 파일 전체가 아니라 '이번 실행이 새로 자동 등록한 공고'만 골라서 뺀다
          # (같은 실행의 원문 발췌 갱신 같은 정상 작업까지 버리지 않도록)
          node collector/revert-auto.mjs || git checkout -- data/registered.json
      # 저장 위치 원칙 (2026-07-31 두 개발자 판 통합 — 여기를 바꾸기 전에 반드시 읽을 것):
      #   로봇은 **자기가 읽은 브랜치(= 실행된 브랜치, 기본 브랜치)에만** 저장한다.
      #   '이미 본 공고' 기록(collector/seen.json)과 공고 목록을 읽은 곳과 쓰는 곳이 다르면,
      #   기록이 영영 안 늘어 **매일 같은 공고를 새 공고로 다시 담게 된다**(이슈 #75와 같은 유형).
      #   앱 배포(main)는 deploy-sync.yml이 이 실행 직후 자동으로 옮겨 주므로, 여기서 main을
      #   건드릴 필요가 없다. 사람 작업 브랜치(claude/work-*)는 이 워크플로가 아예 실행되지
      #   않으므로(트리거가 기본 브랜치 한정) 오염될 일이 없다.
      - name: 결과 저장 (기본 브랜치에 저장 → deploy-sync가 main으로 자동 배포)
        run: |
          git config user.name "handaejang-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/forms.json 반드시 포함 — 스키마화가 만든 양식 원본이 여기 들어 있다.
          # 빠뜨리면 registered.json의 formId만 저장되고 양식은 버려져 '없는 양식을 가리키는
          # 연결'이 생긴다 (2026-08-01 감사 실패의 원인 — 이슈 #79).
          git add collector/seen.json collector/browser-report.md data/notices.json data/registered.json data/forms.json
          # 학교 순서 회전 커서 — 예산에 걸려 건너뛴 학교가 다음 실행의 맨 앞이 된다.
          # 이게 저장 안 되면 매 실행 같은 학교(설정 파일 뒤쪽)만 계속 잘린다.
          [ -f collector/browser-cursor.json ] && git add collector/browser-cursor.json
          [ -f collector/health.json ] && git add collector/health.json
          [ -f collector/pending-forms.json ] && git add collector/pending-forms.json
          [ -d collector/extracted ] && git add collector/extracted
          true  # 위 선택 파일이 없어도 저장 단계는 계속된다 (2026-07-19 8회 연속 실패 원인 수정)
          if ! git diff --cached --quiet; then
            git commit -m "browser-collector: harvest update"
            pushed=0
            # 다른 로봇이 먼저 push했을 수 있음 — 받아서 얹은 뒤 재시도 (수집분 유실 방지)
            for i in 1 2 3; do
              if git push; then pushed=1; break; fi
              # --autostash: 저장 목록에 안 든 파일이 남아 있어도 재시도가 죽지 않게 (2026-08-02).
              # 이게 없으면 "cannot pull with rebase: You have unstaged changes"로 실행 전체가 날아간다.
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            done
            # 3번 다 실패하면 조용히 넘어가지 않는다 — 빨간불로 죽고 아래 실패 알림이 이슈에 붙는다
            if [ "$pushed" != "1" ]; then
              echo "::error::수집 데이터 push 실패 — 3회 재시도 모두 실패. 이번 수집분이 저장되지 않았습니다."
              exit 1
            fi
          fi

      - name: 리포트 이슈
        if: github.event_name == 'workflow_dispatch' || (steps.run.outputs.new_count != '' && steps.run.outputs.new_count != '0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 이슈 본문 한도(65,536자) — 일반 수집 로봇이 2026-08-02에 실제로 넘겨 실패했다.
          # 여기도 학교가 늘면 같은 자리라 미리 막는다.
          BODY=collector/browser-report.md
          LIMIT=60000
          if [ "$(wc -c < "$BODY")" -gt "$LIMIT" ]; then
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            head -c "$LIMIT" "$BODY" > /tmp/report-cut.md
            {
              printf '\n\n---\n\n'
              printf '> ⚠️ **리포트가 길어 여기서 잘렸습니다.** 이슈 본문 한도(65,536자)를 넘었습니다.\n'
              printf '> 전문은 저장소의 `collector/browser-report.md`에서 보거나 [이 실행 로그](%s)를 여세요.\n' "$RUN_URL"
            } >> /tmp/report-cut.md
            BODY=/tmp/report-cut.md
            echo "리포트가 한도를 넘어 잘랐습니다 — 전문은 collector/browser-report.md"
          fi
          gh issue create \
            --title "🖥 브라우저형 수집 리포트 $(TZ=Asia/Seoul date +%Y-%m-%d) (신규 ${{ steps.run.outputs.new_count }}건)" \
            --body-file "$BODY" \
            --repo "${{ github.repository }}" \
            --assignee "${{ github.repository_owner }}" \
            --assignee "Se-Hyeon-Jo"

      # 실패 시 즉시 알림 (조용한 중단 방지 — 2026-07-19 도입)
      - name: 🚨 데이터 감사 실패 알림
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh issue list --repo "${{ github.repository }}" \
            --search '"수집 리포트" in:title' --state open \
            --limit 1 --json number --jq '.[0].number' || true)
          if [ -n "$last" ] && [ "$last" != "null" ]; then
            gh issue comment "$last" --repo "${{ github.repository }}" \
              --body "🚨 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST **데이터 감사 실패 — 이번 자동 등록분은 되돌렸습니다.** 실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} · 수집된 공고 자체는 실시간 피드에 그대로 남아 있어요. Claude 세션에 '감사 실패 확인해줘'라고 지시하세요."
          fi

      - name: 🚨 실패 알림 (최근 리포트 이슈에 코멘트)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh issue list --repo "${{ github.repository }}" \
            --search '"수집 리포트" in:title' --state open \
            --limit 1 --json number --jq '.[0].number' || true)
          if [ -n "$last" ] && [ "$last" != "null" ]; then
            gh issue comment "$last" --repo "${{ github.repository }}" \
              --body "🚨 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST **브라우저형 수집 로봇 실행 실패** — 실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} · 반복되면 Claude 세션에 '로봇 실패 확인해줘'라고 지시하세요."
          fi
