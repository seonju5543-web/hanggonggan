name: 장학공고 수집 로봇

on:
  schedule:
    # GitHub는 혼잡 시간대(특히 UTC 정각·자정) 예약을 지연·생략할 수 있다 —
    # 2026-07-06 아침 수집 누락의 원인. 홀수 분으로 하루 2회(아침+낮 백업) 예약.
    # 중복 실행은 seen.json이 걸러서 무해 (0건이면 이슈 코멘트만 남음).
    - cron: '41 22 * * *'   # 매일 07:41 KST
    - cron: '41 2 * * *'    # 매일 11:41 KST (아침 실행이 생략됐을 때 백업)
    # 2026-09-30 — 44개교 복원 첫 실행 실측: 예산 8분에 75개 게시판 중 21곳. 하루 2회면 한 게시판을 이틀에 한 번 보게 되어
    # 세 번째 실행을 더한다(홀수 분 · 브라우저 수집 12:07 과 겹치지 않게 · 같은 대기줄이라 겹쳐도 취소되지는 않는다).
    # ⚠️ 예산을 키우는 대신 횟수를 늘린 것이다 — 한 실행이 길어지면 단계 상한에 걸려 그날치가 버려지지만, 실행이 하나 더 있는 것은 비용만 든다.
    - cron: '41 6 * * *'    # 매일 15:41 KST
  workflow_dispatch:
  push:
    branches: ['claude/nice-heisenberg-WESq5']
    paths:
      - 'collector/run-collect.txt'   # 이 파일을 수정해 push하면 즉시 수집 (push-to-run)

permissions:
  contents: write
  issues: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 중간 인증서를 안 보내는 학교(계명대) 때문에 Node만 연결이 막힌다 —
    # 검증을 끄는 것이 아니라 서버가 빠뜨린 사슬 한 칸을 우리가 들고 있는 것.
    # 자세한 사정: collector/certs/README.md
    env:
      NODE_EXTRA_CA_CERTS: collector/certs/bundle.pem
    # 시간 상한 (2026-08-01) — 없으면 GitHub 기본값인 **6시간**까지 매달린다.
    # 실제로 7/31 브라우저 수집이 360분을 돌다 취소됐고, 수집 로봇 2종이 같은
    # 대기줄(concurrency: collector)을 쓰기 때문에 그동안 다음 수집이 줄을 섰다.
    # 학교를 더 붙일수록 '한 곳이 안 열려 멈추는' 확률도 같이 오른다.
    # 상한 = 단계 상한의 합 + 준비·저장 여유 (browser-collect.yml 과 같은 셈법 · 관문 test-collector 「일반 수집 예산」).
    # 2026-09-29 수집망 2 → 44개교 복원: 「게시판 수집」 단계에 자체 상한 10분(예산 8분 + 마무리 2분)이 생겨
    # 단계 합 4+10+6+5+1+4+3+3+4 = 40 → 상한 44. ⚠️ 상한을 키우는 것으로 때우지 말 것 — 단계가 오래 걸리면
    # 그 단계의 예산(HARVEST_BUDGET_MS)을 줄이고, 상한은 그 합을 담는 그릇으로만 쓴다(8/2~3 사고의 교훈).
    timeout-minutes: 59   # 2026-10-04 관문 다시 재기 3분(gate-guard — 새 단계의 몫) → 단계 합 54 + 여유 5 (2026-10-03 대외활동 첨부·포스터 9분 → 51+5 · 2026-09-30 판정 로봇 2분 → 42+3)
    steps:
      - uses: actions/checkout@v4
        with:
          # 🔴 대기줄(collector)에서 기다린 뒤에는 **지금 브랜치 끝**에서 시작한다 (2026-09-30).
          #    기본값(GITHUB_SHA)은 큐에 들어간 시점에 굳어서, 앞 로봇이 저장한 커밋 위로 rebase 하다
          #    규칙 없는 장부에서 충돌 → 3회 실패 → 그 실행의 수집분이 통째로 버려졌다(브라우저 19곳 17분치).
          ref: ${{ github.ref_name }}

      - name: 협업 병합기 등록 (충돌 자동 해소 — COLLAB.md)
        run: bash tools/setup-collab.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 재단·지자체 장학 게시판 찾기 (2026-09-26 · 노션 F-13) — 교외 공고 확대. 수집 **앞**에 두어
      # 이번에 찾은 게시판을 같은 실행이 바로 읽는다. 보강 단계 규칙: 자기 상한 + continue-on-error.
      - name: 재단·지자체 장학 게시판 찾기 (보강 — 실패해도 수집은 나간다)
        timeout-minutes: 4
        continue-on-error: true
        env:
          FIND_BOARDS_MAX: '8'
          FIND_BOARDS_MS: '150000'
        run: node collector/find-boards.mjs

      - id: run
        name: 게시판 수집
        # 자체 예산(8분 · collect.mjs HARVEST_BUDGET_MS) + 단계 상한 + continue-on-error 세 겹 (2026-09-29 · 44개교 복원).
        # 상한 10 = 예산 8 + 마지막 게시판이 시한까지 도는 최악(1분 30초 − 최소 여유 30초 = 1분) + 저장·발행 여유.
        # 이 상한에 닿는다는 것 자체가 '어딘가 안 멈췄다'는 신호다. (2026-09-30 실측: 첫 실행 수집 단계 6분 4초)
        # continue-on-error 라 흘러넘쳐도 아래 저장·감사·리포트 단계는 돈다. ⚠️ 다만 상한에 **잘리면** 로봇이 아무것도
        # 못 쓴다(장부·커서는 수집이 끝난 뒤 쓴다) — 그래서 바로 아래 「수집 단계 실패 알림」이 조용히 넘어가지 않게 한다.
        timeout-minutes: 10
        continue-on-error: true
        env:
          HARVEST_BUDGET_MS: '480000'
        run: node collector/collect.mjs

      # continue-on-error 는 크래시·시간초과를 **조용하게** 만든다 — 작업이 성공으로 끝나 아래 failure()/cancelled() 알림이
      # 안 울리고, new_count 가 비어 리포트 이슈도 0건 코멘트도 안 나간다(리뷰 2026-09-29). 그래서 여기서 따로 알린다.
      - name: 🚨 수집 단계 실패 알림 (최근 리포트 이슈에 코멘트)
        if: steps.run.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh issue list --repo "${{ github.repository }}" \
            --search '"장학공고 수집 리포트" in:title' --state open \
            --limit 1 --json number --jq '.[0].number' || true)
          if [ -n "$last" ] && [ "$last" != "null" ]; then
            gh issue comment "$last" --repo "${{ github.repository }}" \
              --body "🚨 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST **게시판 수집 단계가 ${{ steps.run.outcome }} 로 끝났습니다** (상한 10분에 잘렸거나 로봇이 죽었습니다 — 이번 실행의 수집분·회전 커서는 저장되지 않았을 수 있습니다). 실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} · Claude 세션에 '수집 단계 실패 확인해줘'라고 지시하세요."
          fi

      - name: 정식 등록 자동화 (선조치후보고 — collector/auto-register-config.json으로 on/off)
        run: node collector/auto-register.mjs

      # 이 단계는 '있으면 좋은' 보강 작업이다 — 수집 자체가 아니다.
      # 그래서 2026-08-04부터 **자기 시간 상한**과 continue-on-error를 달았다.
      # 그날 사고: 이 단계가 심층 수집 본편(공고 614건 본문 재수집, 19분)을 돌리는 바람에
      # 작업 전체 상한 25분을 넘겨 **취소**됐고, 취소는 뒤 단계를 전부 건너뛰므로
      # 수집분 저장·리포트 이슈가 통째로 버려졌다(8/3 밤·8/4 아침 연속 — 리포트 미도착의 원인).
      # 이제 여기서 무슨 일이 생기든 수집분은 저장되고 리포트는 나간다.
      # 예산 배분(합이 작업 상한 25분 안에 들어와야 한다): 수집 ≤8 + 이 단계 6 + 보충 5 + 나머지 ≈2 = 21
      - name: 신규 등록분 양식 원본 자동 확보 + 스키마화 (같은 실행 안에서 끝낸다)
        timeout-minutes: 6
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 원본 받기 예산을 단계 상한 안으로 (2026-09-23) — deepfetch 기본값은 6분이라 이 단계 상한 6분에서는
          # 받는 도중 단계가 끊겨 같은 단계의 변환·mark-fetched 가 통째로 안 돌았다. 양식 대기줄을
          # 소급해 채우면서(auto-register) 이 단계가 실제로 받을 것이 생겼다. 못 받은 것은 다음 실행이 받는다.
          FORMS_BUDGET_MS: '240000'
        run: |
          targets=$(node collector/pending-targets.mjs)
          if [ -n "$targets" ]; then
            # --forms-only : 첨부 원본만 받는다. 본문은 바로 아래 증분 수집(--fill)의 일이다.
            FORM_TARGETS="$targets" node collector/deepfetch.mjs --forms-only
            pip install olefile --quiet
            python3 collector/hwp-prvtext.py
            python3 collector/hwp-bodytext.py || true   # 본문 전체 (미리보기는 1023자에서 잘린다)
            # 실제로 원본이 내려온 항목만 fetched로 표시한다 (전부 true로 찍어 원본 없는 항목이
            # 영원히 대기하던 버그 수정 — 2026-07-30)
            node collector/mark-fetched.mjs
          fi
          # 원본은 deepfetch가 매 실행마다 갈아엎으므로 스키마화는 반드시 같은 실행에서
          npm i @anthropic-ai/sdk --no-audit --no-fund --silent
          node collector/schematize-forms.mjs

      # 원문 보충 (2026-08-03 도입) — 자격 요건이 사라지던 두 원인을 막는 단계.
      #   ① 등록 공고의 원문은 수집 목록이 60일마다 갈리면서 통째로 사라졌다.
      #   ② 예전엔 본문을 5,000자에서 잘라 자격 절이 컷 뒤로 밀렸다.
      # --fill 은 **빠진 것·잘린 것만** 받는 증분 모드라 평소엔 몇 건 안 받는다(시간 부담 없음).
      # 반드시 발췌 갱신 '앞'에 둘 것 — 원문이 있어야 자격을 뽑는다.
      # 여기도 보강 작업이라 시간 상한을 건다 (2026-08-04). 상한 120건 × 8초면 최악의 날
      # 16분까지 갈 수 있는데, 그것 때문에 그날 수집분을 버리는 건 밑지는 장사다.
      # 못 받은 원문은 다음 실행이 마저 받는다.
      - name: 공고 원문 보충 수집 (빠진 것·잘린 것만)
        timeout-minutes: 5
        continue-on-error: true
        run: node collector/deepfetch.mjs --fill

      # 학교 이름이 바뀌면 health.json에 옛 키가 고아로 남아 "이 학교는 그날 이후 멈췄다"로
      # 보인다. 2026-08-02 캠퍼스 정리 뒤 실제로 4곳이 그 상태였고, 2026-08-09 세션이
      # 그걸 '멈춘 학교'로 잘못 진단했다. 매 실행 청소해 없는 고장을 만들지 않는다.
      # 보강 단계이므로 실패해도 그날 수집·저장·리포트는 그대로 나간다.
      - name: 건강 기록 고아 키 청소
        continue-on-error: true
        timeout-minutes: 1
        run: node collector/prune-health.mjs
      # 자격을 못 읽은 공고의 **공고문 첨부**만 받아 둔다 (2026-08-20)
      # 보강 단계다 — 무슨 일이 있어도 그날 수집 저장·리포트는 나가야 하므로
      # 자체 예산(2.5분) + timeout-minutes + continue-on-error 세 겹으로 막는다.
      - name: 자격용 공고문 첨부 확보 (보강 — 실패해도 수집은 나간다)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          node collector/deepfetch.mjs --elig-attach
          pip install olefile --quiet || true
          python3 collector/hwp-bodytext.py || true

      - name: 공고 원문 발췌 갱신 (정직 원칙 — 추론 대신 원문 그대로)
        run: node collector/extract-excerpts.mjs --write

      # 🔴 **있는데 아무도 안 돌리던 로봇** (2026-09-13 · 노션 F-9 에서 찾았다).
      #   collector/extract-amounts.mjs 는 2026-08-27 에 만들어졌는데 **어느 워크플로에도
      #   걸려 있지 않았다.** 그래서 원문에 금액이 또렷이 적혀 있는데도(`장학금액 : 최대
      #   1,000,000 원`) registered.json 은 '금액 원문 확인'인 채였다 — 실측으로 마감 전
      #   20건 중 금액을 아는 것이 2건뿐이었고, 손으로 한 번 돌리니 14건이 채워졌다.
      #   이 저장소가 이미 배운 것과 같다: **안내문에 적는 것은 리포트고, 강제하는 것은
      #   워크플로뿐이다.** 판정 규칙은 parse-amount.js 한 곳이고 이 로봇은 먹이고 저장만 한다.
      # ⚠️ 발췌 **뒤**에 둔다 — 발췌기가 본문·첨부를 정리한 뒤라야 읽을 거리가 가장 많다.
      # ⚠️ 실패해도 그날 수집분 저장과 리포트는 나가야 한다(보강 단계 규칙 · 2026-08-04).
      - name: 금액·이중수혜 읽어 채우기 (원문 → registered.json)
        timeout-minutes: 3
        continue-on-error: true
        run: node collector/extract-amounts.mjs --write

      # 원문이 도착한 뒤에만 할 수 있는 판정 셋 (2026-09-30 · 개발자 지시 "장학금 판정 자동화") — 보강 규칙(상한 + continue-on-error).
      #   범위 승격: 학교 한정으로 묶인 전국 사업을 원문 증거로 푼다(F-5) · 교내·교외 원문 판정: 제목만 보던 구분을 본문 증거로 고치고 학교 제도를 배운다 ·
      #   포털 표 후보: 학교별 접수 시스템을 모아 사람이 SCHOOL_PORTALS 에 넣게 한다. 셋 다 데이터 관문 **앞**에 둔다(관문이 결과를 본다).
      - name: 범위 승격 · 교내/교외 원문 판정 · 포털 표 후보 (원문 증거)
        timeout-minutes: 2
        continue-on-error: true
        run: |
          node collector/scope-promote.mjs || echo "scope-promote 실패 — 다음 줄은 계속"
          node collector/kind-classify.mjs || echo "kind-classify 실패 — 다음 줄은 계속"
          node collector/portal-candidates.mjs || echo "portal-candidates 실패"

      # 데이터 관문 (2026-07-30 도입): 로봇이 바꾼 데이터가 규칙을 어기면 저장하지 않고 되돌린다.
      # 잘못된 공고가 앱에 하루라도 노출되는 일을 막는 장치 — 사람이 감사를 기억해서 돌릴 필요가 없다.
      # 위치 규칙 (2026-08-01): 관문은 **저장 직전**에 둔다. 예전엔 양식 스키마화보다 앞에 있어서
      # 스키마화가 만든 잘못된 연결이 그 실행에서는 안 잡히고 다음 날 실행에서 터졌다(이슈 #79).
      # PDF 글자 뽑기 (2026-09-05) — 첨부 293개 중 HWP 138개만 읽히고 있었다.
      # PDF 94개(262만 자)가 잠들어 있었고 그 안에 자격·금액·작성 규정이 들어 있다.
      # 🔴 위 '양식 확보' 단계 **안에** 넣으면 그 단계의 예산(6분)을 먹어 뒤따르는
      #    스키마화가 통째로 안 돈다(2026-08-04 사고와 같은 구조). 그래서 자기 단계로 둔다.
      - name: PDF 글자 뽑기
        timeout-minutes: 3
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python3 collector/pdf-text.py
      # 그림·스캔 첨부 글자 읽기 (OCR · 2026-09-17 개발자 지시 "직접 할 수 있으면 사용") — 무료 tesseract.
      # 품질 관문(한글 비율)을 넘은 것만 .ocr.txt 로 남기고, 장부(ocr-ledger.json)가 같은 파일을 다시 안 읽는다.
      # 🔴 `|| true` 로 설치 실패를 삼키지 말 것 — '매번 0개 + 초록불'(pdf-text 와 같은 규칙 · test-collector 관문).
      - name: 그림·스캔 첨부 글자 읽기 (OCR)
        timeout-minutes: 4
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor poppler-utils
          python3 collector/ocr-text.py --budget-sec=150
      # 대외활동·공모전 — 본문에 자격이 없는 글의 첨부·포스터를 무료로 읽는다 (2026-10-03 개발자 지시 "무료로 최대한 땜빵").
      # 받은 파일은 collector/act-files/(.gitignore) — 한 단계 안에서 받고(①) HWP·OCR 글자를 뽑고 자격을 고른다(②). 커밋은 장부 act-docs.json 만.
      # 유료 AI(③)는 여기서 안 돈다 — 「자격요건 매칭 · AI 자격 읽기」 버튼에서만. 보강 단계 규칙: 자기 상한 + continue-on-error.
      # 포스터는 PaddleOCR(무료) — tesseract 는 디자인 포스터를 거의 못 읽는다(24건 중 0 → PaddleOCR 11 · 2026-10-03 실측 · collector/paddle-ocr.py).
      - name: 대외활동 첨부·포스터 자격 읽기 (무료 · 보강)
        timeout-minutes: 9
        continue-on-error: true
        run: |
          node collector/activity-docs.mjs --fetch
          pip install olefile --quiet
          python3 collector/hwp-bodytext.py collector/act-files || true   # 실패해도 아래 읽기는 돈다(그 글의 무료 기회 두 번 중 하나를 날리지 않게)
          sudo apt-get install -y -qq poppler-utils   # PDF 공고문을 쪽 그림으로(pdftoppm) — 서울문화포털 글은 자격이 PDF 에만 있다
          pip install --quiet paddlepaddle==3.2.0 paddleocr==3.3.3 || echo "::warning::PaddleOCR 설치 실패 — 아래 읽기가 엔진 없음으로 적고 HWP·본문으로만 계속"   # 🔴 실패를 삼키지도, 경고 없이 떼지도 말 것 — 떼면 같은 단계의 --apply 가 bash -e 에 끊겨 HWP 로 읽은 자격까지 버려진다(2026-10-04 점검 gaps-02) · 🔴 판 고정 — 3.3.x 는 x86 CPU 에서 첫 그림부터 ConvertPirAttribute2RuntimeAttribute 오류(2026-10-04 첫 클라우드 실행 · PaddleOCR discussions 17350)
          python3 collector/paddle-ocr.py collector/act-files --budget-sec=180 || echo "::warning::PaddleOCR 실패 — 자격 읽기는 HWP·본문으로만 계속(엔진 고장이면 그 글의 기회는 --apply 가 되돌린다)"
          node collector/activity-docs.mjs --apply
      - name: 데이터 관문 (수집기 규칙 테스트 + 데이터 감사)
        id: audit
        continue-on-error: true
        run: |
          node verify/test-collector.mjs
          node verify/audit-data.js
      # 🔴 되돌리고 **관문을 다시 잰다** (2026-10-04 · 로봇·도구 점검 — 로직은 collector/gate-guard.mjs 한 곳).
      #    예전엔 새 자동 등록분만 빼고 끝나, 원인이 기존 항목 수정(발췌 등)이면 아무것도 못 한 채 아래 저장 단계가 관문 실패 상태의
      #    정식 등록 파일을 커밋했다. 이제 ① 새 자동 등록분 → 다시 재기 → ② 정식 등록·양식·대기열을 HEAD 판으로 → 다시 재기.
      #    결과는 steps.guard.outputs.gate(reverted-auto · reverted-files · still-failing · flaky) — still-failing 이면 맨 끝 단계가 빨간불 + 이슈.
      #    상한 3분 = 관문 최대 두 번(로컬 실측 ~25초씩) + 여유. 넘어지면 정식 등록 파일만이라도 HEAD 판으로(|| 뒤).
      - name: 감사 실패 시 자동 등록분 되돌리기
        id: guard
        if: steps.audit.outcome == 'failure'
        timeout-minutes: 3
        run: |
          node collector/gate-guard.mjs --report collector/report.md --note /tmp/gate-note.md --stage auto --stage data/registered.json,data/forms.json,collector/pending-forms.json || git checkout -- data/registered.json data/forms.json collector/pending-forms.json

      - name: 수집 상태 저장 (중복 방지 기록)
        run: |
          git config user.name "handaejang-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/forms.json 반드시 포함 — 스키마화가 만든 양식 원본이 여기 들어 있다.
          # 빠뜨리면 registered.json의 formId만 저장되고 양식은 버려져 '없는 양식을 가리키는
          # 연결'이 생긴다 (2026-08-01 감사 실패의 원인 — 이슈 #79).
          git add collector/seen.json data/notices.json data/registered.json data/forms.json
          # 판정 로봇 셋의 장부 (2026-09-30) — 로봇이 고친 파일은 전부 git add 에 (이슈 #79 규칙)
          [ -f collector/own-programs.json ] && git add collector/own-programs.json
          [ -f collector/kind-candidates.json ] && git add collector/kind-candidates.json
          [ -f collector/portal-candidates.json ] && git add collector/portal-candidates.json
          [ -f collector/school-board-seeds.json ] && git add collector/school-board-seeds.json
          # 대외활동·공모전 (2026-09-25) — 로봇이 고친 파일은 전부 git add 에 (이슈 #79 규칙). 장부와 발행 파일 한 쌍.
          [ -f data/activities.json ] && git add data/activities.json
          [ -f collector/seen-activities.json ] && git add collector/seen-activities.json
          [ -f collector/act-docs.json ] && git add collector/act-docs.json   # 대외활동 첨부·포스터 '해 봤다' 장부 (2026-10-03)
          # 재단·지자체 게시판 (2026-09-26) — 찾기 로봇이 고친 출처 목록·리포트와 발행 파일·장부
          [ -f collector/external-sources.json ] && git add collector/external-sources.json
          [ -f collector/find-boards-report.md ] && git add collector/find-boards-report.md
          [ -f data/external.json ] && git add data/external.json
          [ -f collector/seen-external.json ] && git add collector/seen-external.json
          # 대외활동·재단 출처의 연속 실패 장부 (2026-10-05 점검 collect-08 · collector/source-health.mjs) — 빠지면 매 실행 0 부터 세어 🙋 가 영영 안 뜬다
          [ -f collector/source-health.json ] && git add collector/source-health.json
          # 🔴 학교별 공고 파일 — 앱이 **실제로 읽는 것은 이쪽**이다(data/notices.json 은
          #    학교별 파일이 아직 없는 학교를 위한 뒷길). 수집기는 매 실행 이 폴더를 새로
          #    쓰는데 여기에 없어서 **한 번도 저장되지 않았다** — 2026-08-17 에 폴더를
          #    만든 뒤로 19일 동안 앱의 실시간 공고가 그날 그대로 멈춰 있었다.
          #    (2026-08-01 이슈 #79 와 같은 유형: 로봇이 고친 파일은 전부 git add 에 넣는다)
          [ -d data/notices ] && git add data/notices
          # 🔴 PDF 에서 뽑은 글자(2026-09-05 신설) — 여기 없으면 매 실행 뽑고 매 실행 버린다.
          #    (이슈 #79 와 같은 유형: 로봇이 고친 파일은 전부 git add 에 넣는다)
          [ -d collector/extracted ] && git add collector/extracted
          # health.json(학교별 연속 실패 장부)도 반드시 — 2026-08-02에 일반 수집기가 이 파일을
          # 쓰기 시작했는데 여기 안 넣어서, 추적 중인 파일이 스테이지 안 된 채 남아
          # 재시도의 git pull --rebase가 "unstaged changes"로 죽고 24분짜리 수집이 통째로 날아갔다.
          # 검수 후보 장부 — 앱 파일(notices.json)의 크기 상한에 밀린 공고까지 담는다.
          # 빠뜨리면 매 실행 되살아났다 다시 사라져, 컨펌 대상이 조용히 증발한다 (2026-08-17).
          [ -f collector/candidates.json ] && git add collector/candidates.json
          # 페이지 넘기기 방식 기록 — 빠뜨리면 매 실행 처음부터 헤맨다 (2026-08-17)
          [ -f collector/pagination.json ] && git add collector/pagination.json
          # 회전 커서 (2026-09-29) — 없으면 매 실행 같은 학교에서 시작해 예산에 걸리는 학교가 늘 같다
          [ -f collector/collect-cursor.json ] && git add collector/collect-cursor.json
          [ -f collector/health.json ] && git add collector/health.json
          [ -f collector/pending-forms.json ] && git add collector/pending-forms.json
          [ -f collector/auto-held.json ] && git add collector/auto-held.json   # 관문에 걸린 자동 등록 쉬기 장부 (2026-10-04 · gate-guard·auto-register)
          [ -f collector/past-rounds.json ] && git add collector/past-rounds.json   # 지난 회차 장부 — 등록 뒤 마감 경과로 뺀 등록분의 사업 (2026-10-05 · auto-register)
          [ -d collector/extracted ] && git add collector/extracted
          # 리포트 본문도 저장한다 — 이슈에만 올리고 파일을 커밋하지 않아서, 관리자 화면의
          # '일반 수집 리포트' 버튼이 늘 "리포트 파일이 아직 없습니다"였다 (2026-08-12 수리).
          # 형제 로봇(브라우저 수집·사냥꾼·복구)은 셋 다 자기 리포트를 커밋하고 있었다.
          [ -f collector/report.md ] && git add collector/report.md
          true  # 위 선택 파일이 없어도 저장 단계는 계속된다 (2026-07-19 8회 연속 실패 원인 수정)
          if ! git diff --cached --quiet; then
            git commit -m "collector: seen state update"
            pushed=0
            # 다른 로봇이 먼저 push했을 수 있음 — 받아서 얹은 뒤 재시도 (수집분 유실 방지)
            for i in 1 2 3; do
              if git push; then pushed=1; break; fi
              # --autostash: 저장 목록에 안 든 파일이 남아 있어도 재시도가 죽지 않게 (2026-08-02).
              # 이게 없으면 "cannot pull with rebase: You have unstaged changes"로 실행 전체가 날아간다.
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            done
            # 3번 다 실패하면 조용히 넘어가지 않는다 — 빨간불로 죽고 아래 실패 알림이 이슈에 붙는다
            if [ "$pushed" != "1" ]; then
              echo "::error::수집 데이터 push 실패 — 3회 재시도 모두 실패. 이번 수집분이 저장되지 않았습니다."
              exit 1
            fi
          fi

      - name: 컨펌용 리포트 이슈 생성
        # 수집 스텝이 값을 못 남긴 경우('')엔 리포트를 만들지 않는다 — 건수 없는 빈 이슈 방지
        if: github.event_name == 'workflow_dispatch' || (steps.run.outputs.new_count != '' && steps.run.outputs.new_count != '0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub 이슈 본문은 65,536자가 한도다. 학교를 16곳 늘린 2026-08-02 첫 수집에서
          # 새 공고가 265건 나오며 이 한도를 넘어 이슈 생성이 실패했다(수집·저장은 다 성공한 뒤였다).
          # 학교를 붙일수록 다시 터질 자리라, 넘치면 잘라내고 어디서 전문을 볼지 안내한다.
          BODY=collector/report.md
          LIMIT=60000   # 한도 65536에서 아래 안내문과 여유분을 뺀 값
          if [ "$(wc -c < "$BODY")" -gt "$LIMIT" ]; then
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            head -c "$LIMIT" "$BODY" > /tmp/report-cut.md
            {
              printf '\n\n---\n\n'
              printf '> ⚠️ **리포트가 길어 여기서 잘렸습니다.** 이슈 본문 한도(65,536자)를 넘었습니다.\n'
              printf '> 전문은 저장소의 `collector/report.md`에서 보거나 [이 실행 로그](%s)를 여세요.\n' "$RUN_URL"
            } >> /tmp/report-cut.md
            BODY=/tmp/report-cut.md
            echo "리포트가 한도를 넘어 잘랐습니다 — 전문은 collector/report.md"
          fi
          gh issue create \
            --title "🤖 장학공고 수집 리포트 $(TZ=Asia/Seoul date +%Y-%m-%d) (새 공고 ${{ steps.run.outputs.new_count }}건)" \
            --body-file "$BODY" \
            --repo "${{ github.repository }}" \
            --assignee "${{ github.repository_owner }}" \
            --assignee "Se-Hyeon-Jo"

      # 새 공고가 0건이라 리포트를 생략할 때도, 로봇이 정상 실행됐다는 사실은
      # 최근 리포트 이슈에 한 줄 코멘트로 남긴다 (매일 새 이슈를 만들면 소음이라서)
      - name: 0건 실행 알림 (최근 리포트 이슈에 코멘트)
        if: steps.run.outputs.new_count == '0' && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh issue list --repo "${{ github.repository }}" \
            --search '"장학공고 수집 리포트" in:title' --state open \
            --limit 1 --json number --jq '.[0].number' || true)
          # 🔴 관문 결과로 가른다 (2026-10-04) — 관문이 빨간 날에도 '정상 실행'이라 적어 감사 실패가 묻혔다.
          #    다시 재니 통과(flaky)는 빨간불이 아니다 — 결과 이름(영문)을 그대로 적지 않고 쉬운 말로(리뷰 2026-10-04).
          if [ "${{ steps.audit.outcome }}" = "failure" ]; then
            case "${{ steps.guard.outputs.gate }}" in
              flaky)          gate="데이터 관문은 처음에 빨갛다가 다시 재니 통과 — 되돌린 것 없음" ;;
              reverted-auto)  gate="**데이터 관문 빨간불** — 새 자동 등록분을 되돌려 통과" ;;
              reverted-files) gate="**데이터 관문 빨간불** — 파일을 직전 판으로 되돌려 통과(무엇인지는 아래 코멘트)" ;;
              still-failing)  gate="**데이터 관문 빨간불** — 되돌려도 빨간불(이 실행은 빨간불로 끝납니다)" ;;
              *)              gate="**데이터 관문 빨간불** — 되돌리기 도구가 결과를 남기지 못함" ;;
            esac
            msg="🤖 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST 수집은 정상 · $gate — 새 공고 0건 · 아래 감사 실패 코멘트를 보세요."
          else
            msg="🤖 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST 수집 로봇 정상 실행 — 새 공고 0건이라 새 리포트는 만들지 않았어요."
          fi
          # 피드 메우기(🔁)·화면 0건 학교(🙋) 줄은 0건 날에도 붙인다 (2026-10-05 리뷰) — 리포트 이슈는 새 공고가 있는 날만 생겨,
          # 피드가 비어 '새 공고 0건'이 이어지는 날(9-30 사고 뒤처럼)에 이 두 줄이 report.md 에만 남고 아무에게도 안 닿았다.
          feedlines=$(grep -E '^(🔁|🙋) ' collector/report.md 2>/dev/null || true)
          if [ -n "$feedlines" ]; then
            msg="$msg"$'\n\n'"$feedlines"
          fi
          if [ -n "$last" ] && [ "$last" != "null" ]; then
            gh issue comment "$last" --repo "${{ github.repository }}" --body "$msg"
          fi

      # 로봇이 어떤 단계에서든 실패하면 조용히 멈추지 않고 즉시 알린다
      # (2026-07-17~19 이틀간 8회 연속 실패를 아무도 몰랐던 사고의 재발 방지)
      # 🔴 제 리포트 이슈로 (2026-10-04) — '"수집 리포트"' 부분 일치는 더 최근의 브라우저형 리포트 이슈를 집어(#381 코멘트 9개 중 4개가 이 로봇 것)
      #    어느 로봇의 실패인지도 안 적혀 있었다. 무엇을 되돌렸는지는 gate-guard 의 단락(/tmp/gate-note.md)을 싣는다.
      - name: 🚨 데이터 감사 실패 알림
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 무엇을 되돌렸는지는 gate-guard 의 단락(/tmp/gate-note.md — 실제로 되돌린 파일에서 만든다)을 그대로 싣는다(문구를 여기 베끼지 않는다).
          # 결과(steps.guard.outputs.gate)가 비었으면 되돌리기 도구가 넘어져 아래 || 뒤가 파일을 직전 판으로 돌린 것이다.
          {
            echo "🤖 장학공고 수집 로봇: 🚨 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST **데이터 관문(감사) 실패**"
            echo
            if [ -n "${{ steps.guard.outputs.gate }}" ] && [ -s /tmp/gate-note.md ]; then cat /tmp/gate-note.md
            else echo "> 되돌리기 도구가 결과를 남기지 못해 정식 등록·양식·양식 대기열 파일을 직전 판으로 돌렸습니다."; fi
            echo
            echo "실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} · Claude 세션에 '감사 실패 확인해줘'라고 지시하세요."
          } > /tmp/audit-alert.md
          last=$(gh issue list --repo "${{ github.repository }}" \
            --search '"장학공고 수집 리포트" in:title' --state open \
            --limit 1 --json number --jq '.[0].number' || true)
          if [ -n "$last" ] && [ "$last" != "null" ]; then
            gh issue comment "$last" --repo "${{ github.repository }}" --body-file /tmp/audit-alert.md
          fi

      # cancelled()가 반드시 있어야 한다 (2026-08-04에 뚫린 구멍).
      # 작업이 시간 상한을 넘기면 GitHub는 '실패'가 아니라 '취소'로 끝내는데,
      # failure() 하나만 보고 있으면 이 알림 단계까지 건너뛴다 —
      # 그래서 8/3 밤·8/4 아침 두 번 연속으로 수집이 죽었는데도 아무 데도 알림이 안 갔다.
      - name: 🚨 실패·시간초과 알림 (최근 리포트 이슈에 코멘트)
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh issue list --repo "${{ github.repository }}" \
            --search '"장학공고 수집 리포트" in:title' --state open \
            --limit 1 --json number --jq '.[0].number' || true)
          if [ -n "$last" ] && [ "$last" != "null" ]; then
            gh issue comment "$last" --repo "${{ github.repository }}" \
              --body "🚨 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST **수집 로봇이 끝까지 못 갔어요** (실패 또는 시간 초과로 취소) — 이번 수집분은 저장되지 않았습니다. 실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} · 관리자 화면 → 로봇 (https://hanggonggan-admin.pages.dev/#robots) 에서 「일반 수집 로봇」의 **지금 실행**을 **한 번** 눌러 보세요 — 학교 서버가 잠깐 늦은 것이면 이것으로 끝납니다. 그래도 또 넘어지면 Claude 세션에 '로봇 실패 확인해줘'라고 지시하세요."
          fi

      # 🔴 되돌린 뒤에도 관문이 빨가면 초록불로 끝내지 않는다 (2026-10-04 · 로봇·도구 점검).
      #    failure()·cancelled() 알림 **뒤**에 둔다 — 앞에 두면 그 알림이 '이번 수집분은 저장되지 않았습니다'라는 틀린 말을 붙인다(저장은 됐다).
      - name: 🚨 관문이 끝내 빨간불 (되돌린 뒤에도)
        if: steps.guard.outputs.gate == 'still-failing'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "🤖 장학공고 수집 로봇: 🚨 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST 되돌리기 단계를 거친 뒤에도 데이터 관문이 빨갛습니다 — 무엇을 되돌렸는지는 아래 단락에 있습니다."
            echo
            cat /tmp/gate-note.md 2>/dev/null || true
            echo
            echo "실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} · Claude 세션에 '데이터 관문 빨간불 확인해줘'라고 지시하세요."
          } > /tmp/gate-issue.md
          # 원인이 기존 데이터면 실행마다 빨갛다 — 열린 같은 이슈가 있으면 코멘트(하루 최대 5개씩 쌓이지 않게 · 2026-10-04 리뷰). 로봇 이름은 본문 첫 줄에.
          open=$(gh issue list --repo "${{ github.repository }}" \
            --search '"데이터 관문이 되돌린 뒤에도 빨간불" in:title' --state open \
            --limit 1 --json number --jq '.[0].number' || true)
          if [ -n "$open" ] && [ "$open" != "null" ]; then
            gh issue comment "$open" --repo "${{ github.repository }}" --body-file /tmp/gate-issue.md || true
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "🚨 데이터 관문이 되돌린 뒤에도 빨간불 — 장학공고 수집 로봇 $(TZ=Asia/Seoul date +%Y-%m-%d)" \
              --body-file /tmp/gate-issue.md \
              --assignee "${{ github.repository_owner }}" || true
          fi
          echo "::error::데이터 관문이 되돌린 뒤에도 빨간불입니다 — 이슈에 적었습니다."
          exit 1
