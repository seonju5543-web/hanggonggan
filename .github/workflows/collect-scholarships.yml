name: 장학공고 수집 로봇

on:
  schedule:
    # GitHub는 혼잡 시간대(특히 UTC 정각·자정) 예약을 지연·생략할 수 있다 —
    # 2026-07-06 아침 수집 누락의 원인. 홀수 분으로 하루 2회(아침+낮 백업) 예약.
    # 중복 실행은 seen.json이 걸러서 무해 (0건이면 이슈 코멘트만 남음).
    - cron: '41 22 * * *'   # 매일 07:41 KST
    - cron: '41 2 * * *'    # 매일 11:41 KST (아침 실행이 생략됐을 때 백업)
  workflow_dispatch:
  push:
    branches: ['claude/nice-heisenberg-WESq5']
    paths:
      - 'collector/run-collect.txt'   # 이 파일을 수정해 push하면 즉시 수집 (push-to-run)

permissions:
  contents: write
  issues: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 시간 상한 (2026-08-01) — 없으면 GitHub 기본값인 **6시간**까지 매달린다.
    # 실제로 7/31 브라우저 수집이 360분을 돌다 취소됐고, 수집 로봇 2종이 같은
    # 대기줄(concurrency: collector)을 쓰기 때문에 그동안 다음 수집이 줄을 섰다.
    # 학교를 더 붙일수록 '한 곳이 안 열려 멈추는' 확률도 같이 오른다.
    timeout-minutes: 26   # 실측 0.9~7.7분 (단계 예산 합: 6+5+1+2 + 준비·저장)
    steps:
      - uses: actions/checkout@v4

      - name: 협업 병합기 등록 (충돌 자동 해소 — COLLAB.md)
        run: bash tools/setup-collab.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: run
        name: 게시판 수집
        run: node collector/collect.mjs

      - name: 정식 등록 자동화 (선조치후보고 — collector/auto-register-config.json으로 on/off)
        run: node collector/auto-register.mjs

      # 이 단계는 '있으면 좋은' 보강 작업이다 — 수집 자체가 아니다.
      # 그래서 2026-08-04부터 **자기 시간 상한**과 continue-on-error를 달았다.
      # 그날 사고: 이 단계가 심층 수집 본편(공고 614건 본문 재수집, 19분)을 돌리는 바람에
      # 작업 전체 상한 25분을 넘겨 **취소**됐고, 취소는 뒤 단계를 전부 건너뛰므로
      # 수집분 저장·리포트 이슈가 통째로 버려졌다(8/3 밤·8/4 아침 연속 — 리포트 미도착의 원인).
      # 이제 여기서 무슨 일이 생기든 수집분은 저장되고 리포트는 나간다.
      # 예산 배분(합이 작업 상한 25분 안에 들어와야 한다): 수집 ≤8 + 이 단계 6 + 보충 5 + 나머지 ≈2 = 21
      - name: 신규 등록분 양식 원본 자동 확보 + 스키마화 (같은 실행 안에서 끝낸다)
        timeout-minutes: 6
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          targets=$(node collector/pending-targets.mjs)
          if [ -n "$targets" ]; then
            # --forms-only : 첨부 원본만 받는다. 본문은 바로 아래 증분 수집(--fill)의 일이다.
            FORM_TARGETS="$targets" node collector/deepfetch.mjs --forms-only
            pip install olefile --quiet
            python3 collector/hwp-prvtext.py
            python3 collector/hwp-bodytext.py || true   # 본문 전체 (미리보기는 1023자에서 잘린다)
            # 실제로 원본이 내려온 항목만 fetched로 표시한다 (전부 true로 찍어 원본 없는 항목이
            # 영원히 대기하던 버그 수정 — 2026-07-30)
            node collector/mark-fetched.mjs
          fi
          # 원본은 deepfetch가 매 실행마다 갈아엎으므로 스키마화는 반드시 같은 실행에서
          npm i @anthropic-ai/sdk --no-audit --no-fund --silent
          node collector/schematize-forms.mjs

      # 원문 보충 (2026-08-03 도입) — 자격 요건이 사라지던 두 원인을 막는 단계.
      #   ① 등록 공고의 원문은 수집 목록이 60일마다 갈리면서 통째로 사라졌다.
      #   ② 예전엔 본문을 5,000자에서 잘라 자격 절이 컷 뒤로 밀렸다.
      # --fill 은 **빠진 것·잘린 것만** 받는 증분 모드라 평소엔 몇 건 안 받는다(시간 부담 없음).
      # 반드시 발췌 갱신 '앞'에 둘 것 — 원문이 있어야 자격을 뽑는다.
      # 여기도 보강 작업이라 시간 상한을 건다 (2026-08-04). 상한 120건 × 8초면 최악의 날
      # 16분까지 갈 수 있는데, 그것 때문에 그날 수집분을 버리는 건 밑지는 장사다.
      # 못 받은 원문은 다음 실행이 마저 받는다.
      - name: 공고 원문 보충 수집 (빠진 것·잘린 것만)
        timeout-minutes: 5
        continue-on-error: true
        run: node collector/deepfetch.mjs --fill

      # 학교 이름이 바뀌면 health.json에 옛 키가 고아로 남아 "이 학교는 그날 이후 멈췄다"로
      # 보인다. 2026-08-02 캠퍼스 정리 뒤 실제로 4곳이 그 상태였고, 2026-08-09 세션이
      # 그걸 '멈춘 학교'로 잘못 진단했다. 매 실행 청소해 없는 고장을 만들지 않는다.
      # 보강 단계이므로 실패해도 그날 수집·저장·리포트는 그대로 나간다.
      - name: 건강 기록 고아 키 청소
        continue-on-error: true
        timeout-minutes: 1
        run: node collector/prune-health.mjs
      - name: 공고 원문 발췌 갱신 (정직 원칙 — 추론 대신 원문 그대로)
        run: node collector/extract-excerpts.mjs --write

      # 데이터 관문 (2026-07-30 도입): 로봇이 바꾼 데이터가 규칙을 어기면 저장하지 않고 되돌린다.
      # 잘못된 공고가 앱에 하루라도 노출되는 일을 막는 장치 — 사람이 감사를 기억해서 돌릴 필요가 없다.
      # 위치 규칙 (2026-08-01): 관문은 **저장 직전**에 둔다. 예전엔 양식 스키마화보다 앞에 있어서
      # 스키마화가 만든 잘못된 연결이 그 실행에서는 안 잡히고 다음 날 실행에서 터졌다(이슈 #79).
      - name: 데이터 관문 (수집기 규칙 테스트 + 데이터 감사)
        id: audit
        continue-on-error: true
        run: |
          node verify/test-collector.mjs
          node verify/audit-data.js
      - name: 감사 실패 시 자동 등록분 되돌리기
        if: steps.audit.outcome == 'failure'
        run: |
          # 파일 전체가 아니라 '이번 실행이 새로 자동 등록한 공고'만 골라서 뺀다
          # (같은 실행의 원문 발췌 갱신 같은 정상 작업까지 버리지 않도록)
          node collector/revert-auto.mjs || git checkout -- data/registered.json

      - name: 수집 상태 저장 (중복 방지 기록)
        run: |
          git config user.name "handaejang-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/forms.json 반드시 포함 — 스키마화가 만든 양식 원본이 여기 들어 있다.
          # 빠뜨리면 registered.json의 formId만 저장되고 양식은 버려져 '없는 양식을 가리키는
          # 연결'이 생긴다 (2026-08-01 감사 실패의 원인 — 이슈 #79).
          git add collector/seen.json data/notices.json data/registered.json data/forms.json
          # health.json(학교별 연속 실패 장부)도 반드시 — 2026-08-02에 일반 수집기가 이 파일을
          # 쓰기 시작했는데 여기 안 넣어서, 추적 중인 파일이 스테이지 안 된 채 남아
          # 재시도의 git pull --rebase가 "unstaged changes"로 죽고 24분짜리 수집이 통째로 날아갔다.
          # 검수 후보 장부 — 앱 파일(notices.json)의 크기 상한에 밀린 공고까지 담는다.
          # 빠뜨리면 매 실행 되살아났다 다시 사라져, 컨펌 대상이 조용히 증발한다 (2026-08-17).
          [ -f collector/candidates.json ] && git add collector/candidates.json
          [ -f collector/health.json ] && git add collector/health.json
          [ -f collector/pending-forms.json ] && git add collector/pending-forms.json
          [ -d collector/extracted ] && git add collector/extracted
          # 리포트 본문도 저장한다 — 이슈에만 올리고 파일을 커밋하지 않아서, 관리자 화면의
          # '일반 수집 리포트' 버튼이 늘 "리포트 파일이 아직 없습니다"였다 (2026-08-12 수리).
          # 형제 로봇(브라우저 수집·사냥꾼·복구)은 셋 다 자기 리포트를 커밋하고 있었다.
          [ -f collector/report.md ] && git add collector/report.md
          true  # 위 선택 파일이 없어도 저장 단계는 계속된다 (2026-07-19 8회 연속 실패 원인 수정)
          if ! git diff --cached --quiet; then
            git commit -m "collector: seen state update"
            pushed=0
            # 다른 로봇이 먼저 push했을 수 있음 — 받아서 얹은 뒤 재시도 (수집분 유실 방지)
            for i in 1 2 3; do
              if git push; then pushed=1; break; fi
              # --autostash: 저장 목록에 안 든 파일이 남아 있어도 재시도가 죽지 않게 (2026-08-02).
              # 이게 없으면 "cannot pull with rebase: You have unstaged changes"로 실행 전체가 날아간다.
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            done
            # 3번 다 실패하면 조용히 넘어가지 않는다 — 빨간불로 죽고 아래 실패 알림이 이슈에 붙는다
            if [ "$pushed" != "1" ]; then
              echo "::error::수집 데이터 push 실패 — 3회 재시도 모두 실패. 이번 수집분이 저장되지 않았습니다."
              exit 1
            fi
          fi

      - name: 컨펌용 리포트 이슈 생성
        # 수집 스텝이 값을 못 남긴 경우('')엔 리포트를 만들지 않는다 — 건수 없는 빈 이슈 방지
        if: github.event_name == 'workflow_dispatch' || (steps.run.outputs.new_count != '' && steps.run.outputs.new_count != '0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub 이슈 본문은 65,536자가 한도다. 학교를 16곳 늘린 2026-08-02 첫 수집에서
          # 새 공고가 265건 나오며 이 한도를 넘어 이슈 생성이 실패했다(수집·저장은 다 성공한 뒤였다).
          # 학교를 붙일수록 다시 터질 자리라, 넘치면 잘라내고 어디서 전문을 볼지 안내한다.
          BODY=collector/report.md
          LIMIT=60000   # 한도 65536에서 아래 안내문과 여유분을 뺀 값
          if [ "$(wc -c < "$BODY")" -gt "$LIMIT" ]; then
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            head -c "$LIMIT" "$BODY" > /tmp/report-cut.md
            {
              printf '\n\n---\n\n'
              printf '> ⚠️ **리포트가 길어 여기서 잘렸습니다.** 이슈 본문 한도(65,536자)를 넘었습니다.\n'
              printf '> 전문은 저장소의 `collector/report.md`에서 보거나 [이 실행 로그](%s)를 여세요.\n' "$RUN_URL"
            } >> /tmp/report-cut.md
            BODY=/tmp/report-cut.md
            echo "리포트가 한도를 넘어 잘랐습니다 — 전문은 collector/report.md"
          fi
          gh issue create \
            --title "🤖 장학공고 수집 리포트 $(TZ=Asia/Seoul date +%Y-%m-%d) (새 공고 ${{ steps.run.outputs.new_count }}건)" \
            --body-file "$BODY" \
            --repo "${{ github.repository }}" \
            --assignee "${{ github.repository_owner }}" \
            --assignee "Se-Hyeon-Jo"

      # 새 공고가 0건이라 리포트를 생략할 때도, 로봇이 정상 실행됐다는 사실은
      # 최근 리포트 이슈에 한 줄 코멘트로 남긴다 (매일 새 이슈를 만들면 소음이라서)
      - name: 0건 실행 알림 (최근 리포트 이슈에 코멘트)
        if: steps.run.outputs.new_count == '0' && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh issue list --repo "${{ github.repository }}" \
            --search '"장학공고 수집 리포트" in:title' --state open \
            --limit 1 --json number --jq '.[0].number' || true)
          if [ -n "$last" ] && [ "$last" != "null" ]; then
            gh issue comment "$last" --repo "${{ github.repository }}" \
              --body "🤖 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST 수집 로봇 정상 실행 — 새 공고 0건이라 새 리포트는 만들지 않았어요."
          fi

      # 로봇이 어떤 단계에서든 실패하면 조용히 멈추지 않고 즉시 알린다
      # (2026-07-17~19 이틀간 8회 연속 실패를 아무도 몰랐던 사고의 재발 방지)
      - name: 🚨 데이터 감사 실패 알림
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh issue list --repo "${{ github.repository }}" \
            --search '"수집 리포트" in:title' --state open \
            --limit 1 --json number --jq '.[0].number' || true)
          if [ -n "$last" ] && [ "$last" != "null" ]; then
            gh issue comment "$last" --repo "${{ github.repository }}" \
              --body "🚨 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST **데이터 감사 실패 — 이번 자동 등록분은 되돌렸습니다.** 실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} · 수집된 공고 자체는 실시간 피드에 그대로 남아 있어요. Claude 세션에 '감사 실패 확인해줘'라고 지시하세요."
          fi

      # cancelled()가 반드시 있어야 한다 (2026-08-04에 뚫린 구멍).
      # 작업이 시간 상한을 넘기면 GitHub는 '실패'가 아니라 '취소'로 끝내는데,
      # failure() 하나만 보고 있으면 이 알림 단계까지 건너뛴다 —
      # 그래서 8/3 밤·8/4 아침 두 번 연속으로 수집이 죽었는데도 아무 데도 알림이 안 갔다.
      - name: 🚨 실패·시간초과 알림 (최근 리포트 이슈에 코멘트)
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh issue list --repo "${{ github.repository }}" \
            --search '"장학공고 수집 리포트" in:title' --state open \
            --limit 1 --json number --jq '.[0].number' || true)
          if [ -n "$last" ] && [ "$last" != "null" ]; then
            gh issue comment "$last" --repo "${{ github.repository }}" \
              --body "🚨 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST **수집 로봇이 끝까지 못 갔어요** (실패 또는 시간 초과로 취소) — 이번 수집분은 저장되지 않았습니다. 실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} · 반복되면 Claude 세션에 '로봇 실패 확인해줘'라고 지시하세요."
          fi
