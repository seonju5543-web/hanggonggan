name: 링크 정찰

# '이 주소가 학생에게 실제로 어떻게 보이는가'를 눈으로 확인하는 도구.
# 로그인 벽인지, 학생이 보는 게시판이 맞는지 확인할 때 쓴다.
# 실행: collector/run-probe.txt 를 고쳐 push

on:
  workflow_dispatch:
  push:
    # 기본 브랜치에서만 (2026-10-03) — 저장은 안 하지만, 거르지 않으면 같은 커밋을 작업 브랜치·main 에 올릴 때마다 다시 떠
    #    같은 학교 서버를 한 번에 여러 번 두드린다(관례: 세 브랜치에 같은 내용 push).
    branches: ['claude/nice-heisenberg-WESq5']
    paths:
      - 'collector/run-probe.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    # 시간 상한 (2026-08-01) — 없으면 GitHub 기본값인 **6시간**까지 매달린다.
    # 실제로 7/31 브라우저 수집이 360분을 돌다 취소됐고, 수집 로봇 2종이 같은
    # 대기줄(concurrency: collector)을 쓰기 때문에 그동안 다음 수집이 줄을 섰다.
    # 학교를 더 붙일수록 '한 곳이 안 열려 멈추는' 확률도 같이 오른다.
    timeout-minutes: 15   # 정찰은 짧다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm init -y >/dev/null && npm i playwright@1 --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node collector/probe-links.mjs
      # 인증서 사슬 정찰 (2026-10-01) — run-probe.txt 의 `certHost: <호스트>` 줄마다 서버가 보내는 사슬을 보고, 잎사귀만 보내면
      # 그 인증서의 AIA(CA Issuers) 주소에서 중간 인증서를 받아 **시스템 뿌리로 검증이 되는지** 확인한 뒤 PEM 을 로그에 그대로 적는다.
      # (서강대 2026-09-30 UNABLE_TO_VERIFY_LEAF_SIGNATURE — 계명대와 같은 '빠뜨린 사슬' 증상 · collector/certs/README.md)
      # 저장소에 쓰지 않는다(이 워크플로는 contents: read) — 사람이 로그의 PEM 을 certs/ 에 넣고 README 표에 적는다. 검증을 끄는 것이 아니다.
      - name: 인증서 사슬 정찰 (certHost 줄)
        if: always()
        timeout-minutes: 3
        run: bash collector/certs/probe-chain.sh collector/run-probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-report
          path: collector/probe-report.md
          retention-days: 7
