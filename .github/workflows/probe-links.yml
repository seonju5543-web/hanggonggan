name: 링크 정찰

# '이 주소가 학생에게 실제로 어떻게 보이는가'를 눈으로 확인하는 도구.
# 로그인 벽인지, 학생이 보는 게시판이 맞는지 확인할 때 쓴다.
# 실행: collector/run-probe.txt 를 고쳐 push

on:
  workflow_dispatch:
  push:
    paths:
      - 'collector/run-probe.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    # 시간 상한 (2026-08-01) — 없으면 GitHub 기본값인 **6시간**까지 매달린다.
    # 실제로 7/31 브라우저 수집이 360분을 돌다 취소됐고, 수집 로봇 2종이 같은
    # 대기줄(concurrency: collector)을 쓰기 때문에 그동안 다음 수집이 줄을 섰다.
    # 학교를 더 붙일수록 '한 곳이 안 열려 멈추는' 확률도 같이 오른다.
    timeout-minutes: 15   # 정찰은 짧다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm init -y >/dev/null && npm i playwright@1 --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node collector/probe-links.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-report
          path: collector/probe-report.md
          retention-days: 7
