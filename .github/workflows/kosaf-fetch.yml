name: 한국장학재단 수확 로봇

# 앱의 **층2**(재단 장학금 목록)를 살려 두는 로봇이다.
#
# 🔴 왜 반드시 있어야 하나 (2026-08-30 개발자 지시로 신설):
#    층2는 마감 전인 재단만 보여 준다. 새로 안 받으면 **1주에 43곳, 2주에 69곳이 마감**되어
#    두 달이면 목록이 사실상 빈다. 붙여만 두고 갱신하지 않으면 두 달짜리 기능이 된다.
#
# 🔴 이 로봇이 지키는 것 둘 (되돌리지 말 것):
#    ① **지난 실행의 상세를 이어받는다.** 목록은 매 실행 새로 받지만 상세(자격 20칸)는
#       일부만 받으므로, 그냥 덮어쓰면 애써 모은 205건이 매 실행 사라진다.
#    ② **예산 안에 스스로 끝낸다**(--budget-min). 시간초과는 GitHub이 프로세스를 강제
#       종료하는 것이라 '넘어져도 저장'으로 못 막는다 — 저장 단계까지 통째로 죽는다.
#
# ⚠️ KOSAF 는 재단은 100% 알지만 **이번 회차는 19%만** 안다(실측). 층2는 층1(학교 게시판
#    원문)의 대체가 아니라 보완이다 — 실제로 경원장학재단을 KOSAF 는 2025년 회차로,
#    우리 앱은 2026년 2학기로 알고 있었고 **학교 공고를 직접 열어 우리 쪽이 맞았다.**
on:
  schedule:
    - cron: '53 20 * * 1,4'   # 화·금 05:53 KST = 월·목 20:53 UTC (홀수 분 · 05:23 은 '공고 본문 재수집'과 겹쳐 피했다 —
    #                          둘 다 같은 브랜치에 커밋해서 push 가 부딪힌다)
  workflow_dispatch:
    inputs:
      mode:
        description: '무엇을 할까요'
        type: choice
        required: false
        default: 'full'
        options:
          - full        # 목록·상세 수확 → 공고문 사본 → 저장 (예약 실행과 같음)
          - attach      # 공고문 사본만 (수확은 건너뜀 — 사본만 이어 받을 때 빠르다)
          - probe       # 첨부 칸이 어떻게 생겼는지 **보기만** 한다 (저장 없음)
  push:
    branches: ['claude/nice-heisenberg-WESq5']
    paths:
      - 'collector/run-kosaf.txt'   # 이 파일을 고쳐 push하면 즉시 실행 (push-to-run)

permissions:
  contents: write
  issues: write

# 수집 로봇과 다른 대기줄 — 같은 줄에 넣으면 GitHub이 오래된 대기분을 취소해
# 이 로봇이 조용히 사라진다 (되가져오기 로봇에서 겪은 일).
concurrency:
  group: kosaf
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 작업 상한은 **아래 단계 상한의 합을 담는 그릇**이다
    # (수확 20 + 사본 8 + 글자 4 + 앱 파일 다시 만들기 2 + 여유).
    # 이게 깨지면 마지막 단계(저장·리포트)가 시작도 못 하고 취소되고, 취소는 그날 결과를
    # 통째로 버린다 — 2026-08-04에 실제로 이렇게 이틀치가 사라졌다.
    timeout-minutes: 61   # OCR 단계 4분 추가 (2026-09-17) · 저장 앞 데이터 관문 5분 추가 (2026-11-15 G-16) · 되돌리기 7 + 관문 경보 짝 1+1+1 + 끝내 빨간불 1 (2026-11-16 G-16 리뷰)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/nice-heisenberg-WESq5   # 로봇은 자기가 읽은 브랜치에만 저장한다 (배포는 deploy-sync가)
      - name: 협업 병합기 등록 (충돌 자동 해소 — COLLAB.md)
        run: bash tools/setup-collab.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # 🔴 정찰 — 첨부 칸이 실제로 어떻게 생겼는지 **눈으로 본다**. 짐작으로 주소를 만들면
      #    조용히 0건이 되고 원인을 토큰·헤더로 잘못 짚게 된다(CLAUDE.md '정찰' 규칙).
      - name: 정찰 — 첨부 칸이 어떻게 생겼나 (보기만 함)
        if: inputs.mode == 'probe'
        timeout-minutes: 6
        run: node collector/kosaf-attach.mjs --probe --max=5

      - name: 한국장학재단 통합검색 수확
        if: inputs.mode != 'probe' && inputs.mode != 'attach'
        timeout-minutes: 20
        run: node collector/kosaf-fetch.mjs --budget-min=15 --write

      # ── 여기부터는 **보강**이다 (2026-08-04 규칙: 본업은 수확·저장·리포트).
      #    넘어져도 그날 수확분은 저장되어야 하므로 continue-on-error 를 단다.
      - name: 선발공고문 사본 받기 (층2의 유일한 공고 원문)
        if: inputs.mode != 'probe'
        timeout-minutes: 8
        continue-on-error: true
        run: node collector/kosaf-attach.mjs --budget-min=6 --write

      # HWP·PDF 글자 뽑기 — 받아 둔 공고문이 마감일·자격·검색·양식 스키마화의 재료가 된다.
      # 🔴 `|| true` 로 설치 실패를 삼키지 말 것 — '매번 0개 + 초록불'이 된다(2026-09-05).
      - name: 공고문에서 글자 뽑기
        if: inputs.mode != 'probe'
        timeout-minutes: 4
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          python3 -m pip install --quiet olefile
          # 🔴 hwp 를 **먼저** 돌린다 — 이 스크립트가 zip 을 풀어 안의 pdf 를 꺼내므로,
          #    순서를 바꾸면 그 pdf 가 그 실행에서 안 읽힌다.
          python3 collector/hwp-prvtext.py data/kosaf-files
          # 🔴 **본문 전체**를 뽑는다 — 미리보기(PrvText)는 1023자에서 잘린다(2026-08-14 실측).
          #    공고문은 신청 방법·자격·붙임 서식이 뒷부분에 있어, 앞 1000자만 보면
          #    "읽었다"고 착각한 채 정작 필요한 것을 통째로 못 본다.
          python3 collector/hwp-bodytext.py data/kosaf-files || true
          python3 collector/pdf-text.py data/kosaf-files
      # 그림·스캔 첨부 글자 읽기 (OCR · 2026-09-17 개발자 지시 "직접 할 수 있으면 사용") — 무료 tesseract.
      # 품질 관문(한글 비율)을 넘은 것만 .ocr.txt 로 남기고, 장부(ocr-ledger.json)가 같은 파일을 다시 안 읽는다.
      # 🔴 `|| true` 로 설치 실패를 삼키지 말 것 — '매번 0개 + 초록불'(pdf-text 와 같은 규칙 · test-collector 관문).
      - name: 그림·스캔 첨부 글자 읽기 (OCR)
        if: inputs.mode != 'probe'
        timeout-minutes: 4
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor poppler-utils
          python3 collector/ocr-text.py data/kosaf-files --budget-sec=150

      # 🔴 **여기서 앱 파일을 다시 만든다 — 이 순서가 이 장치의 전부다** (2026-09-13).
      #    첨부 사본은 바로 위 두 단계에서 처음 내려오고 글자도 그때 뽑힌다. 그 전에 만든
      #    앱 파일(kosaf-fetch·kosaf-attach 가 만든 것)은 **열어 보기 전**의 판정이라,
      #    속이 빈 공고문(재단이 `공고문 없음.hwp` 를 올려 둔 것)이 한 회차 그대로 나간다.
      #    이 단계가 collector/kosaf-block.json(내려 둔 목록)도 같이 새로 쓴다.
      - name: 앱 파일 다시 만들기 (빈 껍데기 걸러 내기)
        if: inputs.mode != 'probe'
        timeout-minutes: 2
        run: node collector/kosaf-open.mjs --write

      - name: 관문 — 층2가 비거나 대출이 섞이지 않았나
        if: inputs.mode != 'probe'
        run: node collector/kosaf-check.mjs

      # 🔴 저장 직전 규칙 관문 + 데이터 감사 (2026-11-15 · 노션 G-16 · 관문 「로봇·도구 점검 관문」 savegate) —
      #    test-collector 는 이 로봇이 쓰는 collector/kosaf-block.json 을 직접 읽어 모양을 잰다(층2 제외 장부 절). 관문 없이 저장하면
      #    그 장부가 어긋나는 순간 그날 돈 다른 로봇 전부가 관문에 걸려 제 결과를 되돌린다(10-13 사냥꾼과 같은 꼴).
      #    🔴 2026-11-16 (노션 G-16 리뷰): 처음엔 관문이 넘어지면 그대로 멈췄다(continue-on-error 없음) — 그러면 **다른 로봇이 남긴** 빨간불 하나에도
      #    층2 저장이 매 실행 막혀 목록이 1주에 43곳씩 빈다(11/4~11/7 수집 로봇이 겪은 일 — --keep-preexisting 의 이유). 이제 다른 저장 로봇과 같은 장치:
      #    관문(continue-on-error) → gate-guard 가 이번 실행의 층2 파일을 되돌려 다시 잰다 → 초록이거나 원래 있던 빨간불일 때만 저장 · 경보 짝(아래).
      - name: 데이터 관문 (규칙 관문 + 데이터 감사)
        id: audit
        if: inputs.mode != 'probe'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          node verify/test-collector.mjs
          node verify/audit-data.js

      # 되돌리고 **관문을 다시 잰다** (collector/gate-guard.mjs 한 곳 · 수집·사냥꾼 로봇과 같은 장치) — 되돌릴 것은 이 로봇이 저장하는 넷(장부·앱 파일·내려 둔 목록·사본 폴더).
      # --keep-preexisting: 되돌려도 빨가고 새로 걸린 검사가 없으면(원래 있던 빨간불) 이번 수확분은 저장한다(2026-11-10 수집 로봇과 같은 결정).
      # 도구가 넘어지면(|| 뒤) 그 넷을 직전 판으로 — 사본 폴더는 새로 받은 파일도 지운다. 상한 7분 = 관문 최대 세 번 + 여유.
      - name: 관문 실패 시 층2 파일 되돌리기
        id: guard
        if: inputs.mode != 'probe' && steps.audit.outcome == 'failure'
        timeout-minutes: 7
        run: |
          node collector/gate-guard.mjs --note /tmp/gate-note.md --keep-preexisting --stage data/kosaf.json,data/kosaf-open.json,collector/kosaf-block.json,data/kosaf-files \
            || { git checkout -- data/kosaf.json data/kosaf-open.json collector/kosaf-block.json data/kosaf-files 2>/dev/null; git clean -fdq -- data/kosaf-files; }

      # 🔴 저장은 관문이 초록일 때만 — 처음 통과 · 되돌려서 통과 · 다시 재니 통과(flaky) · 원래 있던 빨간불(kept-preexisting).
      #    끝내 빨가면 **저장하지 않는다**(always() 를 쓰지 말 것) — 이미 올라가 있는 멀쩡한 데이터가 이긴다. 한 번 걸러도 다음 실행에 다시 받으면 그만이다.
      - name: 저장
        if: inputs.mode != 'probe' && (steps.audit.outcome == 'success' || steps.guard.outputs.gate == 'reverted-files' || steps.guard.outputs.gate == 'flaky' || steps.guard.outputs.gate == 'kept-preexisting')
        run: |
          git config user.name "handaejang-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/kosaf.json ] && git add data/kosaf.json
          [ -f data/kosaf-open.json ] && git add data/kosaf-open.json
          # 🔴 내려 둔 공고문 장부 — 빠뜨리면 매 실행 장부가 버려져, 사람이 내린 것이
          #    되살아나고 로봇이 같은 것을 매번 다시 찾는다 (2026-08-01 이슈 #79 유형).
          [ -f collector/kosaf-block.json ] && git add collector/kosaf-block.json
          # 🔴 **로봇이 고친 파일은 전부 여기 있어야 한다** (2026-08-01 이슈 #79).
          #    사본을 빠뜨리면 장부(kosaf.json)에는 '받았다'고 적히는데 파일이 없어,
          #    학생 화면에 **죽은 링크**가 뜨고 다음 실행은 '이미 받았다'고 건너뛴다.
          [ -d data/kosaf-files ] && git add -A data/kosaf-files
          [ -f collector/kosaf-attach-report.md ] && git add collector/kosaf-attach-report.md
          true
          if ! git diff --cached --quiet; then
            git commit -m "kosaf: 재단 장학금 목록·선발공고문 사본 갱신 (층2)"
            pushed=0
            for i in 1 2 3; do
              if git push; then pushed=1; break; fi
              git pull --rebase --autostash || true
              sleep $((i * 5))
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::한국장학재단 목록 저장 실패 (push 3회)"
              exit 1
            fi
          else
            echo "바뀐 것 없음"
          fi

      # 🔴 관문 실패는 조용히 넘어가지 않는다 — 무엇을 되돌렸는지는 gate-guard 의 단락(/tmp/gate-note.md)을 그대로 싣는다(검색용 요약·공공 API 로봇과 같은 꼴).
      #    이슈 **하나**에 모은다(제목에 날짜·결과 없음 · prefix) · 관문이 다시 통과하면 아래 짝이 닫는다(tools/alert-issue.mjs).
      #    '로봇이 넘어졌습니다' 이슈와 따로 둔다 — 관문 빨간불은 수확이 넘어진 것이 아니다.
      - name: 🚨 데이터 관문 실패 알림
        if: always() && steps.audit.outcome == 'failure'
        timeout-minutes: 1
        run: |
          case "${{ steps.guard.outputs.gate }}" in
            reverted-files)   result="층2 파일을 되돌려서 통과 — 이번 수확분은 저장하지 않음(다음 실행에 다시 받음)" ;;
            kept-preexisting) result="원래 있던 빨간불 — 이번 수확분은 저장" ;;
            still-failing)    result="되돌려도 빨간불 — 이번 수확분은 저장하지 않음" ;;
            flaky)            result="다시 재니 통과(되돌린 것 없음)" ;;
            *)                result="되돌리기 단계가 결과를 남기지 못함(넘어짐·건너뜀·시간 초과) — 이번 수확분은 저장하지 않음" ;;
          esac
          {
            echo "🎓 한국장학재단 수확 로봇: 🚨 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST **데이터 관문(test-collector · audit-data) 실패** — $result"
            echo
            if [ -n "${{ steps.guard.outputs.gate }}" ] && [ -s /tmp/gate-note.md ]; then cat /tmp/gate-note.md
            else echo "> 되돌리기 단계가 결과를 남기지 못했습니다(넘어짐·건너뜀·시간 초과) — 이번 수확분은 저장하지 않았습니다."; fi
            echo
            echo "실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} · Claude 세션에 '층2 수확 관문 실패 확인해줘'라고 지시하세요."
          } > /tmp/gate-issue.md
      - name: 🚨 데이터 관문 실패 — 경보 이슈
        if: always() && steps.audit.outcome == 'failure'
        timeout-minutes: 1
        uses: ./.github/actions/alert-issue
        with:
          token: ${{ github.token }}
          mode: open
          match: prefix
          title: 🚨 한국장학재단 수확 로봇 — 데이터 관문 실패
          label: kosaf-gate
          label-description: 한국장학재단 수확 로봇 — 데이터 관문 실패
          body-file: /tmp/gate-issue.md
      - name: ✅ 데이터 관문 회복 — 경보 닫기
        if: always() && steps.audit.outcome == 'success'
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/alert-issue
        with:
          token: ${{ github.token }}
          mode: resolve
          match: prefix
          title: 🚨 한국장학재단 수확 로봇 — 데이터 관문 실패
          body: |
            ✅ 데이터 관문이 다시 통과했습니다 — 이번 수확분은 저장됩니다. 자동으로 닫습니다.
            실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # 🔴 2026-11-13 경보 짝 — 여는 단계만 있어 회복해도 #501 이 10-27 부터 열려 있었다(그 뒤 실행은 전부 성공). 같은 제목으로 닫는다
      - name: 회복했으면 옛 경보를 닫는다
        if: success()
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/alert-issue
        with:
          token: ${{ github.token }}
          mode: resolve
          title: 🚨 한국장학재단 수확 로봇이 넘어졌습니다
          body: |
            ✅ 한국장학재단 수확이 다시 성공했습니다 — 자동으로 닫습니다.

      # 🔴 상한을 넘긴 작업은 '실패'가 아니라 '취소'라 if: failure() 만으로는 안 잡힌다
      - name: 넘어졌으면 알린다
        if: failure() || cancelled()
        uses: actions/github-script@v8
        with:
          script: |
            const title = '🚨 한국장학재단 수확 로봇이 넘어졌습니다';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'kosaf',
            });
            const body = `앱의 **층2(재단 장학금 목록)** 갱신이 멈췄습니다.\n\n`
              + `새로 안 받으면 1주에 43곳, 2주에 69곳이 마감되어 목록이 서서히 빕니다.\n`
              + `실행 기록: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['kosaf'],
              });
            }

      # 🔴 관문이 끝내 빨가면 초록불로 끝내지 않는다 — 이슈는 위 「데이터 관문 실패 — 경보 이슈」가 이미 열었다.
      #    failure()·cancelled() 알림 **뒤**에 둔다(앞에 두면 '로봇이 넘어졌습니다'라는 틀린 말이 붙는다 · 검색용 요약·수집 로봇과 같은 순서).
      - name: 🚨 관문이 끝내 빨간불 (되돌린 뒤에도 · 원래 있던 빨간불 · 되돌리기 도구가 넘어짐)
        if: always() && steps.audit.outcome == 'failure' && steps.guard.outputs.gate != 'reverted-files' && steps.guard.outputs.gate != 'flaky'
        timeout-minutes: 1
        run: |
          echo "::error::데이터 관문이 빨갛습니다(결과: '${{ steps.guard.outputs.gate }}') — 이슈에 적었습니다."
          exit 1
