# 유료 확인 2 — 최종 검토 (2026-11-20 개발자 지시 · 설계 docs/designs/paid-gate-pipeline.md 3절)
#
# 🔴 돈이 나가는 워크플로다. 켜고 끄는 곳은 collector/final-review-config.json 의 enabled 하나(꺼져 있으면 돌아도 부르지 않는다 ·
#    켜는 것은 개발자가 채팅에서 지시할 때만 — CLAUDE.md 🔴 8). 한 실행의 상한은 같은 파일의 maxPerRun · maxUsdPerRun.
#    같은 문서·카드는 다시 보지 않는다(해시) — 평소에는 새로 유료 확인을 통과한 공고만 본다.
#
# 하는 일: 앱이 보이는 문서가 원본과 같은가 · 이 공고의 문서인가 · 신청 양식인가 · 내용이 있는가 · 그 내용이 카드에 다 들어갔나 →
#   collector/final-review.json(관리자 「할 일」 · 앱은 받지 않는다). 아무것도 고치지 않는다(보고만).

name: 유료 최종 검토

on:
  workflow_dispatch:
  schedule:
    - cron: '47 13 * * *'   # 22:47 KST — 저녁 유료 카드 읽기(21:17) 뒤 · 신청서 PDF(새벽 심층 수집)는 그 전날 것

permissions:
  contents: write
  issues: write

# 수집 로봇·유료 카드 읽기와 다른 대기줄 — 같은 줄이면 대기 중인 실행이 취소된다
concurrency:
  group: final-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.ref_name == 'claude/nice-heisenberg-WESq5'
    timeout-minutes: 55   # 단계 상한의 합(사전 관문 12 + 글자 도구 4 + 검토 12 + 규칙 관문 12 + 감사 5 + 저장·알림)보다 길게
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: 협업 병합기 등록 (충돌 자동 해소 — COLLAB.md)
        run: bash tools/setup-collab.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm i @anthropic-ai/sdk --no-audit --no-fund --silent
      # 신청서 PDF 사본의 글자를 뽑는 도구(pdftotext) — 없으면 「원본과 같은가」를 못 재고 그 칸만 비운다(실패로 만들지 않는다)
      - name: PDF 글자 도구
        timeout-minutes: 4
        continue-on-error: true
        run: sudo apt-get install -y -qq poppler-utils >/dev/null

      # 부르기 전에 안전장치를 가짜 응답으로 시험한다(돈 0) — 기계 대조·일치 검사가 무력해졌으면 여기서 멈춘다.
      # 🔴 pipefail 을 건다 — 안 걸면 이 단계의 성패가 `tail` 의 것이라 관문이 빨개도 다음 유료 단계가 돈다(2026-11-15 리뷰 C3)
      - name: 사전 관문 (가짜 응답 — 돈 0)
        timeout-minutes: 12
        run: |
          set -o pipefail
          node verify/test-collector.mjs | tail -40
          # 데이터 감사도 **돈을 쓰기 전에** 한 번 — 다른 로봇 탓에 감사가 빨간 날은 읽고도 저장을 못 해, 같은 공고를 하루 두 번씩 다시 사게 된다(2026-11-18 리뷰)
          node verify/audit-data.js | tail -15

      # 일부 공고가 실패해도(로봇은 실패가 있으면 1 로 끝난다) 읽은 것은 저장한다 — 그래서 continue-on-error. 실패는 아래 알림 단계가 알린다
      - id: read
        name: 최종 검토 (유료)
        timeout-minutes: 12
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINAL_REVIEW_ENABLE: '1'
        run: |
          set -o pipefail
          node collector/final-review.mjs --write | tee /tmp/final-review.txt

      # 저장 앞 관문 — 결과 파일의 꼴(앱이 받는 파일) · 규칙 관문 · 데이터 감사. 하나라도 빨가면 저장하지 않고 멈춘다.
      # 그때 돈을 쓴 결과를 잃지 않게 장부(응답 원본이 들어 있다)를 아티팩트로 남긴다 — 되살린 뒤 `--recheck --write` 로 돈 없이 다시 만든다
      - name: 규칙 관문
        timeout-minutes: 12
        run: node verify/test-collector.mjs > /tmp/gate.txt 2>&1 || { tail -40 /tmp/gate.txt; exit 1; }

      - name: 데이터 감사
        timeout-minutes: 5
        run: node verify/audit-data.js

      - name: 결과 저장 (기본 브랜치 → deploy-sync 가 main 으로)
        run: |
          git config user.name "handaejang-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f collector/final-review.json ] && git add collector/final-review.json
          [ -f collector/final-review-ledger.json ] && git add collector/final-review-ledger.json
          if ! git diff --cached --quiet; then
            git commit -m "유료 최종 검토: $(grep -o '검토 [0-9]*건' /tmp/final-review.txt | tail -1 || echo '결과 갱신')"
            pushed=0
            for i in 1 2 3; do
              if git push origin HEAD:${{ github.ref_name }}; then pushed=1; break; fi
              git pull --rebase --autostash origin "${{ github.ref_name }}"
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::유료 최종 검토 결과 push 실패 — 3회 재시도 모두 실패."
              exit 1
            fi
          fi

      # 유료 관문 기록 (2026-11-21 개발자 지시) — 숨김 공고 몇 건 · 통과 · 사람에게 · 건당 비용 · 줄 통과율 · 최종 검토 비용을 실행 요약 칸에(장부에서 센다 · 돈 0)
      - name: 유료 관문 기록 (비용·통과율)
        if: always()
        timeout-minutes: 1
        continue-on-error: true
        run: node collector/card-read.mjs --stats >> "$GITHUB_STEP_SUMMARY"

      - name: 저장하지 못했으면 장부를 남긴다 (돈을 쓴 응답 원본)
        if: failure() || cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: final-review-ledger
          path: |
            collector/final-review-ledger.json
            collector/final-review.json
          retention-days: 14

      - name: 🚨 실패 알림
        if: failure() || cancelled() || steps.read.outcome == 'failure'
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          body="🚨 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST **유료 최종 검토** 가 끝까지 돌지 못했습니다.
          $(tail -5 /tmp/final-review.txt 2>/dev/null || true)

          실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          학생 화면은 그대로입니다(최종 검토는 보고만 한다). 잔액 부족이면 콘솔 Billing 을 확인하세요.
          다음 실행이 성공하면 이 이슈는 저절로 닫힙니다."
          node tools/alert-issue.mjs --mode open --match exact --title '🧾 유료 최종 검토 알림' \
            --label final-review --label-color 5319E7 --label-description '유료 최종 검토 로봇 실패' --body "$body"

      - name: 다시 성공하면 알림을 닫는다
        if: success() && steps.read.outcome == 'success'
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          body="✅ $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST 유료 최종 검토 — 다시 끝까지 돌았습니다. 자동으로 닫습니다.
          $(tail -1 /tmp/final-review.txt 2>/dev/null || true)"
          node tools/alert-issue.mjs --mode resolve --match exact --title '🧾 유료 최종 검토 알림' --body "$body"
