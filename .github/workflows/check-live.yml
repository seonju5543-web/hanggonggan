name: 실제 앱 반영 확인 (라이브 점검)

# Claude 실행 환경은 github.io 접속이 막혀 있어서 "정말 앱에 반영됐는지"를 직접 볼 수 없다.
# 그래서 이 워크플로가 GitHub 쪽에서 진짜 배포된 앱을 열어보고, 저장소(main)의 파일과 대조한다.
# 결과는 실행 로그에 한글로 남고, 어긋나면 🚨 이슈로 알린다.
#   수동 실행: Actions 탭 → '실제 앱 반영 확인' → Run workflow
#   자동 실행: 매일 13:11 KST (오전 수집 + 배포 동기화가 끝난 뒤)

on:
  workflow_dispatch:
  schedule:
    - cron: '11 4 * * *'   # 13:11 KST

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 배포된 앱과 저장소(main) 대조
        id: check
        env:
          SITE: https://seonju5543-web.github.io/hanggonggan
        run: |
          mkdir -p live
          for f in sw.js app.js data/notices.json data/registered.json data/forms.json; do
            mkdir -p "live/$(dirname "$f")"
            curl -sSL --max-time 30 -H 'Cache-Control: no-cache' "$SITE/$f" -o "live/$f" || echo "받기 실패: $f"
          done

          echo "— 캐시 응답 헤더(참고) —"
          curl -sSI --max-time 30 "$SITE/data/registered.json" | grep -i "cache-control\|etag\|last-modified" || true

          node - <<'EOF'
          const fs = require('fs');
          /* 파일마다 담는 모양이 달라서(공고=items 배열, 양식=templates 목록) 개수를 각각 센다.
             모양을 못 읽으면 '읽기실패'로 남겨 두 쪽 다 undefined라 통과해 버리는 일이 없게 한다. */
          const count = (p) => {
            try {
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              const box = j.items || j.templates || j;
              if (Array.isArray(box)) return box.length;
              if (box && typeof box === 'object') return Object.keys(box).length;
              return '읽기실패';
            } catch { return '읽기실패'; }
          };
          const cache = (p) => { try { return (fs.readFileSync(p, 'utf8').match(/const CACHE = '([^']+)'/) || [,'?'])[1]; } catch { return '?'; } };
          const rows = [
            ['서비스워커 버전', cache('sw.js'), cache('live/sw.js')],
            ['실시간 공고', count('data/notices.json'), count('live/data/notices.json')],
            ['정식 등록', count('data/registered.json'), count('live/data/registered.json')],
            ['양식', count('data/forms.json'), count('live/data/forms.json')],
          ];
          let bad = 0;
          console.log('\n항목             저장소(main)   실제 앱   결과');
          for (const [name, repo, live] of rows) {
            const ok = String(repo) === String(live);
            if (!ok) bad++;
            console.log(`${name.padEnd(16)} ${String(repo).padEnd(13)} ${String(live).padEnd(9)} ${ok ? '✅ 같음' : '❌ 다름'}`);
          }
          const appOk = fs.existsSync('live/app.js') && fs.readFileSync('live/app.js', 'utf8').length > 1000;
          console.log(`앱 코드 내려받기 ${appOk ? '✅ 정상' : '❌ 실패'}`);
          if (!appOk) bad++;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `bad=${bad}\n`);
          console.log(bad === 0
            ? '\n✅ 배포된 앱이 저장소와 같습니다 — 사용자는 재설치 없이 최신 내용을 봅니다.'
            : `\n❌ ${bad}개 항목이 어긋납니다 (Pages 배포가 아직 안 끝났거나 동기화 실패).`);
          EOF

      # 관리자 페이지가 학생용 주소에 딸려 나가지 않았는지 매일 확인한다.
      #
      # 왜 필요한가: 관리자 화면은 `_admin/`에 있고, **밑줄로 시작하는 폴더는 GitHub Pages(Jekyll)가
      # 배포하지 않는다**는 성질에 기대어 학생용 주소에서 감춰져 있다. 이 성질이 깨지면
      # (예: 나중에 누군가 `.nojekyll`을 추가하면) 잠기지 않은 관리자 화면이 그대로 공개된다.
      # 조용히 새는 것을 막기 위해 '정말 404인지'를 로봇이 매일 대신 확인한다.
      - name: 관리자 페이지가 학생용 주소에 노출되지 않았는지 확인
        id: admin
        env:
          SITE: https://seonju5543-web.github.io/hanggonggan
        run: |
          leaked=0
          for p in _admin/ _admin/index.html _admin/admin.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/$p" || echo 000)
            echo "$p → HTTP $code"
            if [ "$code" = "200" ]; then leaked=1; fi
          done
          echo "leaked=$leaked" >> "$GITHUB_OUTPUT"
          if [ "$leaked" = "1" ]; then
            echo "::error::관리자 페이지가 학생용 주소에서 열립니다 — 즉시 조치가 필요합니다."
          else
            echo "✅ 관리자 페이지는 학생용 주소에서 열리지 않습니다."
          fi

      - name: 🚨 관리자 페이지 노출 알림
        if: steps.admin.outputs.leaked == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 본문에 역따옴표·중괄호가 들어가므로 셸이 건드리지 못하게 따옴표 친 heredoc으로 쓴다
          cat > /tmp/admin-leak.md <<'EOF'
          `_admin/`이 학생용 주소(https://seonju5543-web.github.io/hanggonggan)에서 열립니다.
          관리자 화면은 Cloudflare(Access 뒤)에만 있어야 하고, 이 주소에서는 열리면 안 됩니다.

          확인할 것: 저장소에 `.nojekyll`이나 `_config.yml`이 새로 생겼는지 —
          Jekyll이 꺼지면 밑줄로 시작하는 폴더도 그대로 배포됩니다.
          EOF
          printf '\n실행 기록: %s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' \
            "$RUN_URL" >> /tmp/admin-leak.md
          gh issue create \
            --title "🚨 관리자 페이지가 공개 주소에 노출됨 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)" \
            --repo "$REPO" --assignee "$OWNER" --body-file /tmp/admin-leak.md

      - name: 🚨 어긋남 알림
        if: steps.check.outputs.bad != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "🚨 앱 반영 점검 실패 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)" \
            --repo "${{ github.repository }}" \
            --assignee "${{ github.repository_owner }}" \
            --body "배포된 앱(https://seonju5543-web.github.io/hanggonggan)이 저장소 main과 다릅니다.
          Pages 배포가 늦어졌을 수도 있으니 먼저 다시 실행해 보고, 계속 다르면 배포 동기화를 확인하세요.

          실행 기록: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
