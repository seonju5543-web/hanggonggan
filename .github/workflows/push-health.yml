name: 푸시 서버 상태 확인 (발송 없음)

# 알림 발송 서버가 **조용히 멈추지 않았는지** 매일 확인한다. (2026-08-31 신설)
#
# 왜 만들었나:
#   · 진짜 푸시는 2026-08-06부터 켜져 있는데, 실제 상태를 본 것은 `push-check` 두 번
#     (둘 다 2026-08-07)뿐이었다. 그 뒤 24일간 아무도 안 봤다.
#   · 예약으로 도는 로봇이 15개인데(수집·배포동기화·관리자 잠금 확인·본문 재수집…)
#     **푸시만 수동이었다.** 관리자 화면 잠금은 매일 보면서, 학생에게 알림이 실제로
#     가는지는 아무도 안 보고 있었다. 서버가 죽어도 알 방법이 없다.
#   · Claude 실행 환경은 workers.dev 접속이 프록시에서 막혀(403) 세션 안에서는 확인이 안 된다.
#     그래서 바깥(Actions)에서 여는 것만이 증명이다 — 관리자 잠금 확인과 같은 계열.
#
# 🔴 **이 워크플로는 알림을 발송하지 않는다.** `/health` 만 읽는다.
#    시험 발송(`/test`)은 등록된 **모든 학생 폰에 실제 알림이 뜨는 일**이라,
#    사람이 `push-check` 를 직접 누를 때만 일어나야 한다. 여기서 부르면 안 된다.
#
# ⚠️ `/health` 의 `subs` 는 **등록 기록 수이지 살아 있는 폰 수가 아니다**(worker.js 주석).
#    폰 쪽에서 구독이 죽어도 기록은 남아 있다가 다음 발송 때 404 로 정리된다.
#    "실제로 받는지"는 여전히 `push-check` 의 시험 발송으로만 증명된다.
#
# 실행: Actions 탭 → 이 워크플로 → Run workflow · 자동: 매일 06:17 KST

on:
  schedule:
    # 21:17 UTC = 06:17 KST. 정각·자정을 피한 홀수 분 (예약 혼잡 회피 정책)
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: push-health          # 수집 로봇들과 대기줄을 섞지 않는다
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: /health 읽기
        id: probe
        env:
          URL: https://handaejang-push.seonju5543.workers.dev/health
        run: |
          set +e
          BODY=$(curl -sS --max-time 25 -w '\n%{http_code}' "$URL")
          CURL_RC=$?
          set -e
          CODE=$(printf '%s' "$BODY" | tail -1)
          JSON=$(printf '%s' "$BODY" | sed '$d')
          echo "— 응답 —"; echo "HTTP $CODE"; echo "$JSON"

          # 판정은 지어내지 않고 worker.js 가 실제로 주는 칸으로만 한다:
          #   ok · configured · step · sent · subs · lastError
          VERDICT=ok; WHY=""
          if [ "$CURL_RC" != "0" ] || [ "$CODE" != "200" ]; then
            VERDICT=down; WHY="서버가 응답하지 않습니다 (curl rc=$CURL_RC · HTTP $CODE)"
          else
            CONF=$(printf '%s' "$JSON" | jq -r '.configured // empty')
            LERR=$(printf '%s' "$JSON" | jq -r '.lastError // empty')
            SUBS=$(printf '%s' "$JSON" | jq -r '.subs // empty')
            if [ "$CONF" != "true" ]; then
              VERDICT=misconfig; WHY="VAPID 키가 서버에 없습니다 (configured=false) — 푸시가 실제로는 안 나갑니다"
            elif [ -n "$LERR" ]; then
              VERDICT=error; WHY="서버에 마지막 오류 기록이 남아 있습니다: $LERR"
            elif [ "$SUBS" = "-1" ]; then
              VERDICT=error; WHY="등록 저장소(KV)를 읽지 못했습니다 (subs=-1)"
            fi
            # subs=0 은 오류가 아니라 '알릴 대상이 없음'이다 — 이슈로 만들지 않고 로그에만 적는다
            [ "$SUBS" = "0" ] && echo "⚠️ 등록된 폰이 0대입니다 (오류는 아니지만 알림이 갈 곳이 없습니다)"
          fi
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "why=$WHY"        >> "$GITHUB_OUTPUT"
          { echo "json<<EOJ"; echo "$JSON"; echo "EOJ"; } >> "$GITHUB_OUTPUT"
          echo "판정: $VERDICT ${WHY:+— $WHY}"

      - name: 🚨 이상이면 이슈로 알린다
        if: steps.probe.outputs.verdict != 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          WHY: ${{ steps.probe.outputs.why }}
          JSON: ${{ steps.probe.outputs.json }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create push-health --repo "$REPO" --color B60205 \
            --description "푸시 발송 서버 경보" 2>/dev/null || true
          # 라벨로 중복을 막는다 (제목 검색은 이모지·한글에서 놓친다 — 되가져오기 로봇의 교훈)
          if [ -n "$(gh issue list --repo "$REPO" --label push-health --state open --json number --jq '.[0].number')" ]; then
            echo "이미 열린 경보 이슈가 있어 새로 만들지 않습니다."
            exit 0
          fi
          {
            echo "학생에게 가는 **알림 발송 서버**에 이상이 있습니다."
            echo
            echo "> $WHY"
            echo
            echo '```json'
            echo "$JSON"
            echo '```'
            echo
            echo "조치: Cloudflare 대시보드 → Workers → \`handaejang-push\` 에서"
            echo "로그와 배포 상태를 확인하세요. 설정 값은 \`server/push/README.md\` 에 있습니다."
            echo
            echo "고친 뒤에는 **\`푸시 알림 검사 (상태 + 시험 발송)\`** 을 눌러 실제 도달까지 확인하세요."
            echo "이 워크플로는 상태만 읽고 **발송은 하지 않습니다** — 등록 기록 수(\`subs\`)는"
            echo "살아 있는 폰 수가 아니라서, 실제로 받는지는 시험 발송으로만 증명됩니다."
            echo
            echo "실행 기록: $RUN_URL"
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > /tmp/push.md
          gh issue create \
            --title "🚨 푸시 발송 서버 이상 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)" \
            --repo "$REPO" --assignee "$OWNER" --label push-health --body-file /tmp/push.md

      - name: 정상이면 옛 경보 이슈를 닫는다
        if: steps.probe.outputs.verdict == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for n in $(gh issue list --repo "$REPO" --label push-health --state open --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$REPO" \
              --comment "✅ 발송 서버가 정상으로 응답합니다. (자동 확인 · 발송은 하지 않았습니다)

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
          done

      - name: 결과를 실패로 남긴다 (이상한 경우)
        if: steps.probe.outputs.verdict != 'ok'
        run: exit 1
