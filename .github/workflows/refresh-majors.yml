# 학교별 학과 목록 갱신 (2026-08-06)
# 커리어넷 오픈API에서 학교별 개설 학과를 수확해 data/majors.json으로 발행한다.
# 학과 개편은 학기 단위다 — 학기 시작 전(2월·8월 20일 새벽)에 한 번씩 예약으로 돈다(2026-10-05 점검 결정 ·
# 그 전에는 예약이 없어 08-06 로컬 실행 뒤로 한 번도 안 돌았다). 필요하면 관리자 화면 「학과 목록 갱신」이나 Actions 에서 수동 실행.
# 키는 저장소 Secret CAREERNET_API_KEY — 없으면 Actions 에서는 빨간불(::error)로 끝난다(로컬 실행만 조용히 종료).
# 실행 결과(서비스 학교인데 학과 파일이 없는 곳 · 분교 이름 후보)는 collector/majors-report.md 와 ::warning 으로 남는다.
# 저장은 기본 브랜치(로봇 저장 위치 원칙) — deploy-sync가 main으로 자동 배포한다.
name: 학과 목록 갱신 (커리어넷)

on:
  # 2·8월 19일 21:29 UTC = 20일 06:29 KST (홀수 분 · 정각·UTC 자정 피함 · 같은 시각에 저장하는 로봇 없음).
  # ⚠️ 달 칸이 있는 예약이라 하트비트(robot-heartbeat)는 '너무 오래 조용함'을 판정하지 않는다(null — 반년 간격은 주 단위로 못 잰다).
  #    넘어지면 아래 넘어짐 알림이 알린다.
  schedule:
    - cron: '29 21 19 2,8 *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# 🔴 수집 로봇과 다른 대기줄 (2026-10-05 · 옛 판은 group: collector) — 같은 줄이면 이 로봇이 기다리거나 도는 동안 줄에 선
#    예약 수집·관리자 버튼 실행이 취소될 수 있다(GitHub 은 한 줄에 대기 실행을 하나만 남긴다). 이 로봇이 쓰는 파일
#    (data/majors.json · data/majors/ · collector/majors-report.md)은 다른 로봇이 안 쓴다 · 저장 충돌은 아래 pull --rebase 재시도가 받는다.
concurrency:
  group: refresh-majors
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # 🔴 기본 브랜치의 **지금 끝**에서 시작하고 그 브랜치에만 저장한다 (kosaf-fetch 와 같은 꼴 · 2026-10-05).
          #    기본값(GITHUB_SHA)은 실행이 생긴 시점에 굳어서 앞 로봇이 저장한 커밋 위로 rebase 하다 충돌할 수 있다(2026-09-30 사고) —
          #    브랜치 이름으로 받으면 체크아웃 시점의 끝이다. 어느 브랜치에서 깨워도 읽는 곳과 저장하는 곳이 같다.
          ref: claude/nice-heisenberg-WESq5
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 학과 수확
        env:
          CAREERNET_API_KEY: ${{ secrets.CAREERNET_API_KEY }}
        run: node collector/majors.mjs

      - name: 저장
        run: |
          git config user.name "handaejang-bot"
          git config user.email "bot@handaejang.local"
          # 🔴 학교별 파일까지 넣는다 — 앱이 받는 것은 그쪽뿐이다(2026-09-26).
          #    빠뜨리면 앱은 새 학과를 영영 못 보고, 파일이 없으면 전국 공통 목록으로
          #    조용히 물러나므로 화면상 아무 일도 안 일어난 것처럼 보인다.
          git add data/majors.json data/majors
          # 실행 리포트(서비스 학교인데 학과 파일이 없는 곳 · 분교 이름 후보) — 사람이 BRANCH_MAP 을 고칠 증거
          [ -f collector/majors-report.md ] && git add collector/majors-report.md
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "majors: 학교별 학과 목록 갱신 (커리어넷 API)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin claude/nice-heisenberg-WESq5 && git push origin HEAD:claude/nice-heisenberg-WESq5 && exit 0
            sleep 5
          done
          echo "::error::push 3회 실패"; exit 1

      # 🔴 시간 초과는 '실패'가 아니라 '취소'라 둘 다 본다 (2026-08-04 사고) · 회복하면 하트비트가 닫는다.
      - name: 🚨 로봇이 넘어졌다
        if: failure() || cancelled()
        uses: ./.github/actions/robot-down
        with:
          robot: 학과 목록 갱신
          token: ${{ github.token }}
