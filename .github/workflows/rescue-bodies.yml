# 공고 본문 재수집 — 등록 공고 중 '메뉴만 받아 온' 것을 브라우저로 다시 받는다 (2026-08-23 신설)
#
# 왜 필요한가: 자격을 못 읽는 70건 중 29건이 원문을 **받아 놓고도** 본문이 없는 상태였다
# (세종이도: 5,439자 중 공고 본문은 한글 191자, 나머지는 로그인·사이트맵·학사일정).
# 본문을 자바스크립트로 그리는 게시판이라 일반 fetch로는 몇 번을 받아도 똑같다.
# 브라우저는 그릴 수 있는데, 브라우저 수집기는 '새로 발견한 공고'만 보고 등록 공고는 안 본다.
#
# 🔴 수집 로봇과 **다른 대기줄**이다. 같은 줄에 넣으면 GitHub이 대기 중인 예약 수집을
#    취소해 그날 수집분이 조용히 사라진다(deploy-sync·main-guard를 따로 둔 것과 같은 함정).

# 🔴 2026-10-04 「자격요건 로봇」으로 키웠다 (개발자 지시 — *"진짜 브라우저로 열어야 되는 장학금 공모전 대외활동 공고는 다 이걸로 돌리도록 해.
#    로봇은 시간초과등 오류 안나게"*). 진짜 크롬으로 자격을 찾는 로봇은 **이것 하나**다 — 같은 일을 하는 로봇을 하나 더 만들면
#    같은 공고를 두 로봇이 두드린다. 수집 로봇(장학공고 수집 · 브라우저형 수집)과는 대기줄·시간대·쓰는 파일이 다 따로다.
#      ① 장학 — 등록 공고 본문 재수집(collector/rescue-bodies.mjs · 그대로)
#      ② 대외활동·공모전 — 무료 받기로 못 읽은 글을 진짜 크롬으로(collector/activity-docs.mjs --browser)
#         → HWP · 그림·PDF(PaddleOCR) → 결과는 자기 장부(collector/act-browser.json)에만. data/activities.json 은 수집 로봇이 합친다
#    🔴 시간 초과 대비: 단계마다 자기 예산(env) < 단계 시한 < 작업 시한 · 글마다 저장 · 보강 단계는 continue-on-error.
#    ⚠️ 파일 이름(rescue-bodies.yml)은 관리자 화면 버튼이 부르므로 그대로 둔다.

name: 자격요건 로봇 (진짜 브라우저)

on:
  workflow_dispatch:
    inputs:
      cap:
        description: '이번 실행에서 최대 몇 건까지 받을까 (기본 50)'
        type: string
        required: false
        default: '50'
  schedule:
    # 05:23 KST — 링크 사냥(06:37)·일반 수집(07:41)·브라우저 수집(08:07) 앞이고
    # 충분히 떨어져 있다. 같은 학교를 연달아 두드리면 서버가 막는다(동국대 사례).
    - cron: '23 20 * * *'
    # 18:23 KST — 낮 수집(15:41) 뒤 · 공공 API 백업(16:17) 뒤. 대외활동 글이 하루 두 번 바뀌어 두 번 본다(장학 쪽은 장부가 같은 글을 이레 안에 다시 안 연다)
    - cron: '23 9 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: rescue-bodies
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: ubuntu-latest
    # 🔴 학교가 중간 인증서를 빠뜨려 Node 만 연결이 막히는 곳이 있다(계명대·조선대 등).
    # 브라우저·curl 은 시스템 저장소에서 사슬을 이어 붙이지만 Node 는 안 한다 —
    # '로봇만 못 읽고 학생은 멀쩡히 보는' 상태가 된다. 검증을 끄는 것이 아니라
    # 서버가 깜빡한 사슬 한 칸을 우리가 들고 있는 것이다. 자세히: collector/certs/README.md
    # 2026-08-23에 이게 없어서 조선대 공고문 PDF 내려받기가 TypeError 로 죽었다.
    env:
      NODE_EXTRA_CA_CERTS: collector/certs/bundle.pem
    # 재수집 예산 12분 + 브라우저 설치·검증·저장. 상한은 예산의 그릇이지 '넉넉히'가 아니다.
    timeout-minutes: 50   # 크롬 설치 5 + 장학 11 + 활동 받기 8 + 글자 읽기 8 + 고르기 2 + 관문 5 + 저장 3 = 42 · 체크아웃·알림 여유 8 (2026-10-04)
    steps:
      - uses: actions/checkout@v5
        with:
          # 로봇은 자기가 읽은 브랜치(= 기본 브랜치)에만 저장한다. 배포는 deploy-sync의 몫.
          ref: 'claude/nice-heisenberg-WESq5'
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: 진짜 크롬 설치
        timeout-minutes: 5
        run: |
          npm init -y >/dev/null && npm i playwright@1 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 본문 재수집
        id: rescue
        timeout-minutes: 11
        continue-on-error: true      # 여기서 무슨 일이 생겨도 아래 저장·리포트는 나간다
        env:
          RESCUE_BUDGET_MS: '540000'   # 9분(2026-10-04 12→9 · 대외활동 단계 몫) — 못 끝낸 것은 다음 실행이 이어서 한다
          RESCUE_CAP: ${{ inputs.cap || '50' }}   # 25→50 (2026-10-04 실측: 25건에 약 5분 · 예산 9분) — 예산이 먼저 멈추고 한 페이지 60초 시한이 있어 넘치지 않는다
        run: node collector/rescue-bodies.mjs --write

      # 데이터 관문은 저장 직전에 둔다 (이슈 #79의 교훈)
      # ── 대외활동·공모전 (2026-10-04) — 규칙은 수집 로봇의 무료 모드와 한 벌(activity-docs.mjs) · 페이지만 진짜 크롬으로 받는다 ──
      - name: 대외활동 — 진짜 크롬으로 받기
        timeout-minutes: 8
        continue-on-error: true
        env:
          ACT_DOCS_BUDGET_MS: '360000'   # 6분 — 글 하나에 절대 시한 45초(activity-docs PAGE_MS) · 글마다 장부 저장
          ACT_DOCS_POSTS: '25'
        run: node collector/activity-docs.mjs --fetch --browser
      - name: 대외활동 — 첨부·포스터·PDF 글자 읽기 (HWP · PaddleOCR)
        timeout-minutes: 8
        continue-on-error: true
        run: |
          pip install olefile --quiet
          python3 collector/hwp-bodytext.py collector/act-files || true
          sudo apt-get install -y -qq poppler-utils
          pip install --quiet paddlepaddle==3.2.0 paddleocr==3.3.3   # 🔴 판 고정 — 3.3.x 는 x86 CPU 에서 첫 그림부터 ConvertPirAttribute2RuntimeAttribute 오류(2026-10-04 첫 클라우드 실행 · PaddleOCR discussions 17350)
          python3 collector/paddle-ocr.py collector/act-files --budget-sec=240 || true
      - name: 대외활동 — 자격 고르기 (자기 장부에만)
        timeout-minutes: 2
        continue-on-error: true
        run: node collector/activity-docs.mjs --apply --browser

      - name: 데이터 관문
        id: audit
        timeout-minutes: 5
        continue-on-error: true
        run: |
          node verify/test-collector.mjs
          node verify/audit-data.js
      - name: 관문에 걸리면 되돌린다
        if: steps.audit.outcome == 'failure'
        run: |
          git checkout -- collector/extracted/browser-bodies.json data/registered.json || true
          echo "::error::재수집 결과가 감사를 통과하지 못했습니다. 되돌렸습니다."
          exit 1

      - name: 저장
        if: always()
        timeout-minutes: 3
        run: |
          git config user.name "handaejang-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 로봇이 고치는 파일은 전부 여기 있어야 한다 (이슈 #79 — 빠뜨리면 조용히 버려진다)
          [ -f collector/extracted/browser-bodies.json ] && git add collector/extracted/browser-bodies.json
          [ -f collector/rescue-ledger.json ] && git add collector/rescue-ledger.json
          [ -f collector/rescue-report.md ] && git add collector/rescue-report.md
          [ -f collector/act-browser.json ] && git add collector/act-browser.json   # 대외활동 브라우저 장부·결과 (2026-10-04)
          # 첨부 목록을 새로 받아 적으면 registered.json 이 바뀐다 — 빠뜨리면
          # 애써 찾은 공고문 첨부가 조용히 버려진다 (이슈 #79와 같은 유형)
          git add data/registered.json
          true
          if ! git diff --cached --quiet; then
            git commit -m "자격요건 로봇: 장학 본문 재수집 · 대외활동 브라우저 자격"
            pushed=0
            for i in 1 2 3; do
              if git push; then pushed=1; break; fi
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::push 3회 실패 — 이번 재수집분이 저장되지 않았습니다."
              exit 1
            fi
          else
            echo "::notice::새로 확보한 본문이 없습니다."
          fi

      # 🔴 `if: failure()` 만 쓰면 안 된다 — 시간 초과는 '실패'가 아니라 '취소'라
      #    알림 단계까지 통째로 건너뛴다 (2026-08-04 사고).
      - name: 실패하면 이슈로 알린다
        if: failure() || cancelled()
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let body = '(리포트 없음)';
            try { body = fs.readFileSync('collector/rescue-report.md', 'utf8').slice(0, 8000); } catch {}
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: ['rescue-bodies'],
              title: `🚨 자격요건 로봇 (진짜 브라우저) 실패 — ${new Date().toISOString().slice(0, 10)}`,
              body: ['재수집이 실패하거나 시간 초과로 취소됐습니다.', '', '```', body, '```'].join('\n'),
            });
