# 앱 화면 검사 (브라우저) — 2026-08-29 신설
#
# 왜 만들었나 (개발자 질문: "왜 자꾸 스스로 뭔가를 빼먹거나 오류가 나지?"):
#   이 저장소의 검사 31개 중 **워크플로가 돌리는 것은 5개뿐**이었다. 나머지는
#   브라우저가 필요해서 사람이 손으로 돌려야 했고, 그래서 아무도 안 돌렸다.
#   2026-08-29에 전수로 돌려 보니 **7개가 깨진 채 방치**돼 있었다. 원인은 셋뿐이었다:
#     ① 온보딩 단계 번호를 박아 둠 (단계가 4→6이 되며 6개가 동시에 죽음)
#     ② 브라우저 경로를 박아 둠 (리눅스 샌드박스 경로라 맥에서 아예 안 뜸)
#     ③ "사람이 미리 준비해야 하는" 픽스처에 의존 (그 준비를 아무도 안 함)
#   셋 다 고쳐 13개 전부 초록불로 만들었고, 재발은 test-collector 의 정적 검사가 막는다.
#
#   🔴 이 저장소의 원칙 그대로다 — **리포트가 아니라 관문이어야 재발이 끝난다.**
#   Claude 세션 안내문에 "검사를 돌려라"라고 적어 두는 것은 리포트다(실제로 안 돌았다).
#   여기서 돌리면 사람이 기억하든 말든 돈다.
name: 앱 화면 검사 (브라우저)

on:
  push:
    branches: [claude/nice-heisenberg-WESq5, main]
    paths:                     # 화면·판정에 닿는 것이 바뀔 때만 (로봇 데이터 커밋마다 돌지 않게)
      # 🔴 **파일 이름을 하나씩 적지 말 것** (2026-09-09 전수 대조에서 잡았다).
      #    손으로 관리하던 목록이라 새 파일이 생길 때마다 어긋났다 — 실측으로 여덟이 빠져 있었다:
      #    boot.js · resume.js · interactions.js · sw.js · supabase-client.js ·
      #    push-config.js · supabase-config.js · chat-config.js.
      #    그래서 `boot.js` 만 고치면 그걸 검사하는 verify-resume.js 가 **한 번도 안 돌았다.**
      #    2026-09-06 에 ui-tone 이 넉 달 가까이 빨간불인 채 안 보였던 것도 같은 유형이다(B-4).
      #    ⚠️ 글로브의 `*` 는 `/` 를 안 넘는다 — 그래서 뿌리의 앱 파일만 잡히고
      #       `collector/*.mjs` 나 `data/*.json`(로봇이 하루 열 번 커밋한다)은 안 걸린다.
      #    관문: test-collector 'CI 감시 범위' 절이 index.html 의 스크립트와 대조한다.
      - '*.js'               # 뿌리의 앱 스크립트 전부 (app·match-engine·boot·resume·interactions…)
      - '*.html'             # index.html · terms.html
      - '*.css'
      - 'sw.js'              # 위 '*.js' 에 이미 포함 — 잊지 말라고 남겨 둔다
      - 'verify/**'
      - '_admin/**'          # 관리자 화면 (verify-admin.js 가 스스로 빌드해 검사한다)
      # 🔴 관리자 화면은 collector 의 공용 원본을 vendor 로 옮겨 쓴다(build.sh).
      #    그 원본이 새 이웃을 부르기 시작하면 화면이 통째로 죽는데, 여기 없으면
      #    **collector 아래만 고치는 커밋**에서 이 검사가 한 번도 안 돈다.
      #    ⚠️ 2026-09-13 사고는 그 경우가 아니었다(처음에 그렇게 적었다가 감사에서 잡혔다) —
      #       그 커밋은 '*.js'·'verify/**' 에 걸려 돌았고 verify-admin.js 가 8회 연속
      #       빨간불이었는데 아무도 안 읽었다. 경위는 SESSIONS.md 2026-09-13 절.
      #    ⚠️ `collector/**` 로 넓히면 안 된다 — 로봇이 seen.json·extracted 를 하루 열 번
      #       커밋해서 25분짜리 브라우저 검사가 그때마다 돈다(test-collector 'CI 감시 범위'
      #       절이 그걸 막는다). 그래서 **vendor 로 옮기는 파일만** 적는다.
      #    이 목록이 build.sh 와 어긋나면 verify-admin-vendor.js 가 실패시킨다 — 손으로
      #    맞출 필요 없이, 새 파일을 vendor 에 넣으면 그 관문이 여기 적으라고 말해 준다.
      - 'collector/url-key.mjs'
      - 'collector/deadline-hint.mjs'
      - 'collector/notice-source.mjs'      # 저장된 공고 원문 ↔ 등록 공고 잇기 (2026-09-13)
      - 'collector/canon-url.mjs'          #   그 파일이 부르는 이웃
      - 'collector/page-boilerplate.mjs'   #   그 파일이 부르는 이웃
      - 'tools/edit-diff.mjs'             # 관리자 수정 전후 대조 규칙 (화면·저장소 공용)
      - 'collector/activity-kind.mjs'     # 대외활동·공모전 종류 (관리자 「활동」 탭이 vendor 로 쓴다 · 2026-09-29)
      - 'collector/news-kind.mjs'         # 교내 소식 갈래 (build.sh 가 vendor 로 옮긴다 · 2026-10-01)
      - 'collector/link-fix.mjs'          # 관리자가 넣는 원문 주소 규칙 (화면·저장소 공용 · 2026-10-04 · source-link.js 는 위 '*.js')
      # 🔴 관리자 화면이 누르는 **쓰기 경로**. 아래 '수집기 규칙 관문' 이 이 파일을
      #    진짜로 돌려 본다(많이 지우기 확인·필수 칸 빈칸 금지·재등록 차단 주소).
      #    여기 없으면 그 안전장치를 떼는 커밋에서 이 검사가 한 번도 안 돈다.
      - 'tools/admin-apply.mjs'
      - 'server/push/**'     # 푸시 발송 서버 (verify-push-server.mjs)
      - 'insta/**'           # 인스타 카드 (verify-insta.js)
      - '.github/workflows/verify-ui.yml'
      # 🔴 경보 한 곳(2026-10-04 로봇·도구 점검) — 경보 도구·리포트 정리 규칙·앱이 받는 파일 목록과 공용 액션.
      #    여기 없으면 그 파일만 고친 커밋에서 관문(test-collector 「로봇·도구 점검 관문」 alerts)이 한 번도 안 돈다.
      - 'tools/alert-issue.mjs'
      - 'tools/report-retention.mjs'
      - 'tools/app-fetch-files.cjs'
      - '.github/actions/**'
      # 🔴 워크플로만 고친 커밋에도 돈다 (2026-10-05 리뷰). 「로봇·도구 점검 관문」(alerts S1~S4 · 각 로봇 절)은 워크플로 **글자**를 잰다.
      #    여기 없으면 그 위반을 처음 보는 곳이 수집 로봇의 데이터 관문이 된다 — 그쪽은 경고만 하므로(로봇 결과를 되돌리지 않게)
      #    엄격하게 실패시키는 곳은 이 검사 하나다. 로봇은 워크플로 파일을 커밋하지 않아 수집 커밋마다 돌지는 않는다.
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write        # 빨간불을 이슈로 알리기 위해 (아래 '🚨 화면이 깨졌다' 단계)

concurrency:
  group: verify-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    # 🔴 상한은 **모든 단계 예산을 담는 그릇**이다 (CLAUDE.md 규칙). 2026-09-21 에 전 여정
    #    회귀(drive.js · 2~3분)를 더하며 25 → 30 으로 키웠다. 시간 초과는 '실패'가 아니라
    #    '취소'라 아래 `if: failure()` 경보가 안 뜬다 — 그래서 넉넉히 둔다.
    #    🔴 그릇을 키워 때우지 않는다 — 오래 걸리는 두 단계가 **스스로 끝낸다**(화면 검사 루프 예산 20분 · 전 여정 5분 · 2026-10-04).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm init -y >/dev/null && npm i playwright-core@1 --no-audit --no-fund
      # 🔴 `id: browser` — 아래 화면 검사·전 여정은 **이 단계가 성공했을 때만** 돈다. 앞(내려받기·도구 설치)이 넘어져도
      #    이 단계가 건너뛰어져 성공이 아니게 되므로, 조건 하나로 준비 단계 전부를 본다(브라우저 없이 드라이버가 다 빨개지는 소음을 막는다).
      - id: browser
        run: npx playwright@1 install --with-deps chromium
      - name: 브라우저 경로 찾기
        run: echo "CHROME_PATH=$(find ~/.cache/ms-playwright -name chrome -type f | head -1)" >> $GITHUB_ENV

      # 🔴 **여기부터 경보 앞까지 모든 관문 단계에 `!cancelled()` 를 단다** (2026-10-04 코드 리뷰).
      #    GitHub 은 한 단계가 실패하면 `if:` 없는 아래 단계를 **통째로 건너뛴다.** 화면 검사 단계에만 달면
      #    이 값싼 관문 일곱 가운데 하나만 넘어져도 드라이버 전부와 전 여정이 또 한 번도 안 돈다 — 2026-10-04 에 막으려던 '그물 걷힘'과 같은 꼴이다.
      #    관문 verify/health-gates/ci.mjs ②(test-collector 「로봇·도구 점검 관문」 이 부른다)가 이 구간의 `if:` 를 하나씩 잰다(새 단계를 더할 때도).
      # 🔴 순수 모듈 검사도 여기서 돌린다 (2026-08-29 코드 리뷰 지적).
      #    essay-playbook.yml 에도 있지만 그건 **주 1회 예약**이라, 제출 관문이 깨져도
      #    최대 일주일 뒤에 안다. 관문은 밀어 넣는 그 순간 막아야 한다.
      #    브라우저가 필요 없어 몇 초면 끝난다.
      - name: 제출 관문 판정 검사 (순수 모듈)
        if: ${{ !cancelled() }}
        run: node verify/verify-essay-submit.mjs

      # 🔴 접수 대행 — 보내기 전 서버 재검증 (2026-09-25 · 고문 보고서 Q4).
      #    막는 것: 변조된 클라이언트가 **아무 주소로나** 우리 이름으로 메일을 보내는 것 ·
      #    자격을 조작한 신청서가 그대로 나가는 것. 지금은 mailto: 라 안 터지지만,
      #    Resend 를 켜는 순간 우리가 보내는 주체가 된다 — 그때 이 관문이 서 있어야 한다.
      - name: 접수 대행 재검증 관문 (순수 모듈)
        if: ${{ !cancelled() }}
        run: node verify/verify-apply-guard.mjs

      # 🔴 아래 셋은 오랫동안 **어떤 워크플로에도 안 걸려 있었다**(2026-09-09 전수 조사에서 발견).
      #    셋 다 브라우저가 필요 없어 몇 초면 끝나는데, 안 걸어 둔 탓에 깨져도 아무도 몰랐다.
      #    · notify-rules  — 언제 무엇을 알릴지의 단 하나의 기준 (화면·서비스워커가 공유)
      #    · push-server   — 발송 서버가 폰 주소·학교·캠퍼스 말고 아무것도 저장하지 않는가
      #    · form-snapshot — 질문을 줄여도 **문서는 한 글자도 안 바뀐다**는 증명 (운영 원칙 4)
      - name: 알림 규칙 관문 (순수 모듈)
        if: ${{ !cancelled() }}
        run: node verify/verify-notify-rules.js

      - name: 푸시 발송 서버 관문
        if: ${{ !cancelled() }}
        run: node verify/verify-push-server.mjs

      - name: 양식 문서 동일성 관문 (원칙 4)
        if: ${{ !cancelled() }}
        run: node verify/form-snapshot.mjs

      # 🔴 인스타 카드 사실 관문 — 145건 전수. 브라우저가 필요 없다(파일·JSON 만 읽는다).
      #    카드가 원문을 상하게 하는 유형(부정어 잘림·지역/소득 조건 증발·마감 지난 공고를
      #    '모집 중'·저작자 표시 누락)을 잡는다. 규칙은 render.mjs 에서 **이름으로 떼어 온다** —
      #    베끼면 코드를 되돌려도 초록불로 남는다(실제로 그랬다).
      - name: 인스타 카드 사실 관문
        if: ${{ !cancelled() }}
        run: node verify/verify-insta.js

      # 🔴 관리자 화면 빠진 이웃 — 브라우저가 필요 없다(파일만 읽는다). 몇 초면 끝난다.
      #    admin.js 는 ES 모듈이라 import 하나가 404 나면 파일 전체가 안 돌고,
      #    버튼에 동작이 안 붙어 "눌러도 아무 일이 없는" 화면이 된다(오류 문구도 안 뜬다).
      #    이 단계가 부르는 build.sh 안에서 같은 관문이 돈다(규칙은 한 파일 — 베끼지 않는다).
      #    Cloudflare 빌드 때도 같은 것이 돌지만, 그건 배포 직전이라 여기서 먼저 잡는다.
      - name: 관리자 화면 빠진 이웃 관문
        if: ${{ !cancelled() }}
        run: |
          bash _admin/build.sh

      # 드라이버마다 8123·8124 를 쓴다 (verify/README.md)
      - name: 로컬 서버 띄우기
        id: server
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8123 >/dev/null 2>&1 &
          python3 -m http.server 8124 >/dev/null 2>&1 &
          sleep 2

      # ── 관문: 전부 통과해야 한다 (2026-08-29에 7개를 고쳐 모두 초록불로 만들었다) ──
      # 🔴 여기서 실패하면 화면이 깨진 것이다. 넘기지 말 것 —
      #    "나중에 보자"로 두면 정확히 그렇게 7개가 썩었다.
      # 🔴 **하나가 넘어져도 끝까지 돈다** (2026-10-04 · 이슈 #389·#390). 예전엔 `set -e` + 맨몸 `node` 라
      #    verify-registered 하나가 데이터 탓으로 넘어지자 뒤 드라이버 22개와 아래 단계 셋이 **통째로 안 돌았고**,
      #    그 사이 들어온 토큰 위반(ui-tone)이 한 번도 안 보였다. `set -e` 만 지우면 아무것도 안 바뀐다 —
      #    GitHub 기본 셸이 `bash -e` 라서 실패를 `||` 로 받아 모은 뒤 마지막에 한 번 실패시킨다.
      #    `timeout 300`: 가장 긴 드라이버가 76초(verify-settings · 성공 실행 실측). 매달린 하나가 30분 그릇을 다 먹으면
      #    '취소'로 끝나 경보가 안 뜬다 — 상한을 키우지 않고 드라이버마다 끊는다.
      # 🔴 **루프 전체에도 예산이 있다 — 20분** (2026-10-04 코드 리뷰). 드라이버마다 5분만 있으면 26개 × 5분 = 130분이라,
      #    셋만 상한까지 매달려도 30분 그릇이 넘쳐 '취소'로 끝나고 경보도 실패 목록도 안 나온다(조용한 실패).
      #    예산을 다 쓰면 새 드라이버를 시작하지 않고 그 이름을 `unrun` 으로 넘긴 뒤 **실패로** 끝낸다 — 늘 경보가 뜬다.
      #    드라이버 하나의 시한도 남은 예산을 넘지 않는다(`left`). 성공 실행은 13분 반이 걸렸다(2026-10-04 run 37227739276 실측).
      #    작업 상한(30) > 이 예산(20) + 전 여정 시한(5) + 준비·값싼 관문 여유(3) — 관문 ci.mjs ② 가 셈과 루프를 실제로 돌려 잰다.
      #    예산에 자주 걸리면 예산을 키우기 전에 어느 드라이버가 느려졌는지부터 본다(로그의 `──` 줄 사이 시각).
      # 🔴 **앞의 값싼 관문이 넘어져도 돈다**(`!cancelled()` · 2026-10-04 코드 리뷰 — 조건이 없으면 일곱 가운데 하나만 빨개도
      #    드라이버 전부와 전 여정이 통째로 건너뛰어졌다). 서버를 못 띄웠거나 브라우저를 못 깔았을 때만 건너뛴다 —
      #    그때 경보는 '드라이버가 돌지 않았다'고 적는다(아래 경보의 DRIVERS).
      - name: 화면 검사 (관문)
        id: drivers
        if: ${{ !cancelled() && steps.server.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: |
          budget=$((20*60))
          end=$((SECONDS + budget))
          fails=""
          unrun=""
          for f in verify-fit-badge.js verify-explore-sort.js verify-onboard-gaps.js \
                   verify-registered.js verify-chat.js verify-apps-manage.js \
                   verify-supabase.js verify-essay-ui.js verify-forms-data.js \
                   verify-new-forms.js verify-source-links.js verify-push-client.js \
                   verify-notify.js verify-sheet-back.js verify-kosaf.js \
                   verify-calendar.js verify-resume.js verify-interactions.js \
                   verify-admin.js verify-settings.js verify-admin-shape.js \
                   verify-elig-ask.js \
                   verify-apply-prep.js verify-activities.js verify-news.js \
                   verify-region-city.js; do
            left=$((end - SECONDS))
            if [ "$left" -le 0 ]; then unrun="$unrun $f"; continue; fi
            if [ "$left" -gt 300 ]; then left=300; fi
            echo "── $f"
            timeout -k 10 "$left" node "verify/$f" || { rc=$?; if [ "$rc" = 124 ] || [ "$rc" = 137 ]; then echo "❌ $f — 시한(${left}초) 안에 안 끝나 끊었다"; else echo "❌ $f"; fi; fails="$fails $f"; }
          done
          echo "failed=${fails# }" >> "$GITHUB_OUTPUT"
          echo "unrun=${unrun# }" >> "$GITHUB_OUTPUT"
          if [ -n "$unrun" ]; then echo "❌ 시간 예산($((budget / 60))분)을 다 써서 돌리지 못한 드라이버:$unrun"; fi
          if [ -n "$fails" ]; then echo "❌ 실패한 드라이버:$fails"; fi
          if [ -n "$fails$unrun" ]; then exit 1; fi


      # 화면의 말투·토큰이 되돌아가지 않는지 (2026-08-31 신설 — 브라우저 없이 몇 초).
      # 🔴 여기서 실패하면 이모지·느낌표·1인칭 말투나 토큰 밖 CSS 값이 다시 들어온 것이다.
      #
      # 🔴 **맨 뒤에 둔다** (2026-09-03 개발자 지시). 원래는 화면 검사보다 앞이었는데,
      #    GitHub 은 한 단계가 실패하면 **그 아래를 통째로 건너뛴다.** 그래서 토큰 3건이
      #    걸린 동안 **화면 검사 15개가 한 번도 안 돌았다** — 그물이 걷힌 줄 아무도 몰랐다
      #    (그 사이 '숨긴 요소가 클릭을 먹는' 실제 버그가 들어와 있었다).
      #    ⚠️ 검사를 무르게 한 것이 아니다. 여기서 실패하면 작업 전체가 여전히 빨간불이고,
      #       다만 **화면 검사 결과도 함께 보인다.** 앞에 두면 둘 중 하나만 보인다.
      #    ⚠️ 다시 앞으로 옮기지 말 것 — 옮기는 순간 뒤 단계가 또 통째로 사라진다.
      #    🔴 앞 단계가 실패해도 돈다(`!cancelled()` — 2026-10-04 이전엔 이 조건이 없어 화면 검사가 빨간 날 통째로 건너뛰었다).
      - name: 말투·토큰 관문
        if: ${{ !cancelled() }}
        run: node verify/ui-tone.mjs

      # 수집기·관리자 규칙 관문 (2026-09-14 신설) — 브라우저가 필요 없어 3초면 끝난다.
      #
      # 왜 여기에도 거는가 — 이 검사는 수집 워크플로 넷에 걸려 있는데, 그것들은
      # **collector/ 와 예약(cron)** 으로 돈다. 그래서 `_admin/admin.js` 나
      # `tools/admin-apply.mjs` 만 고치는 커밋에서는 최대 하루가 지나야 돈다.
      # 이 검사가 지키는 것 가운데 **관리자 화면에 닿는 것**이 여럿이다:
      #   · 안내문이 채팅이 아니라 관리자 화면을 가리키는가 (링크의 화면 이름·로봇 이름 대조)
      #   · 화면이 부를 수 있는 로봇 목록 (kosaf-fetch 가 빠지면 · device-deploy 가 들어오면)
      #   · 많이 지우기 확인 · 필수 칸 빈칸 금지 (저장소를 진짜로 돌려 본다)
      #   · 화면 미리보기와 저장소가 같은 규칙으로 '무엇이 바뀌는가'를 세는가
      #
      # 🔴 **맨 끝에 둔다** — 말투·토큰 관문과 같은 이유다. 앞에 두면 여기서 걸린 날
      #    브라우저 검사 20개가 통째로 안 돌아 그물이 걷힌 줄 아무도 모른다.
      #    🔴 앞 단계가 실패해도 돈다(`!cancelled()` — 2026-10-04 이전엔 이 조건이 없어 앞이 빨간 날 통째로 건너뛰었다).
      - name: 수집기·관리자 규칙 관문 (브라우저 불필요)
        if: ${{ !cancelled() }}
        # DOC_GATES: CLAUDE.md 부피·참조 대조는 **여기(코드 검사)와 로컬에서만** 실패시킨다.
        #   수집 로봇도 이 파일을 데이터 관문으로 돌리는데, 거기서 문서 오타가 실패하면
        #   그날 자동 등록분이 되돌려진다 — 문서 문제로 수집이 멈추면 안 된다(2026-09-23).
        env: { DOC_GATES: '1' }
        run: node verify/test-collector.mjs

      # ══ 🚨 빨간불을 사람이 읽게 한다 (2026-09-13 신설 · 노션 G-7) ═══════════════════
      #
      # 왜 필요한가 — **관문이 있는 것과 누가 읽는 것은 다른 일이다.**
      #   이 워크플로는 관문 26개를 돌리면서 **실패해도 아무 일도 하지 않았다.** 그래서
      #   verify-admin.js 가 **8회 연속 빨간불**(runs 273~282 · 2026-09-12~13)이었는데
      #   아무도 몰랐다. 노션 대외-3 메모가 이미 그렇게 진단해 뒀다 —
      #   "진짜 실패 경로는 '관문이 없어서'가 아니라 '빨간 관문을 아무도 안 읽어서' 이고,
      #    그 원인에는 아직 관문이 없다." 그 자리를 메운다.
      #   수집 로봇은 실패하면 🚨 이슈를 남긴다. 화면 검사만 조용했다.
      #
      # 🔴 열린 경보가 있으면 코멘트만 단다 — 매 push 마다 새 이슈를 만들면 일주일이면 알림을 무시하게 된다.
      #    찾기·만들기는 아래 경보 한 곳(tools/alert-issue.mjs · 2026-10-04)이 열린 이슈 목록의 **제목 글자**로 한다
      #    (옛 판의 라벨 찾기는 같은 초 두 실행이 둘 다 '없음'을 봐 중복을 만들었다 · GitHub 검색은 이모지·한글에서 놓친다 — 2026-07-31).
      #
      # ⚠️ **여기서는 `cancelled()` 를 일부러 안 본다** — 이 저장소의 다른 로봇과 다르다.
      #    다른 로봇은 예약(cron)이라 취소 = 시간 초과지만, 이 워크플로는
      #    `cancel-in-progress: true` 라 **연달아 push 할 때마다 앞 실행이 정상적으로 취소된다.**
      #    거기에 알림을 걸면 헛경보가 쏟아져 진짜 빨간불이 묻힌다(위 '무시하게 된다'와 같은 이유).
      #    ⚠️ 그래서 작업 상한(30분)을 넘긴 경우는 이 알림이 못 잡는다 — 취소 사유를 `if:` 로 가를 수 없어서다.
      #       대신 넘기지 않게 한다: 화면 검사 루프는 20분 예산을 다 쓰면 남은 드라이버를 '돌리지 못함'으로 넘기고
      #       **실패로** 끝내고, 전 여정은 5분에 끊는다(2026-10-04 · 관문 ci.mjs ②).

      # 🔴 전 여정 회귀 — 온보딩 → 매칭 → 신청 → 양식 작성 → 일괄 준비 → 신청내역을
      #    한 번에 걷는 **유일한** 검사인데, 2026-09-21 까지 **어느 워크플로에도 없었다.**
      #    그래서 3번에 1번씩 죽고 있었는데 아무도 몰랐다(새로고침이 알림 동의 시트를 다시
      #    띄워 그 뒤 클릭이 시간초과로 죽던 것 — 2026-09-20 에 고쳤다).
      #    기술 고문 요청서 Q12 가 말한 "검사가 조용히 죽어 있었다"의 마지막 한 칸이다.
      #    ⚠️ 위 목록과 따로 두는 이유: 이 드라이버만 한 번에 2~3분이 걸려, 어느 것이
      #       오래 걸리는지 로그에서 바로 보이게 한다.
      #    🔴 **값싼 관문(말투·토큰·수집기 규칙) 뒤에 둔다.** GitHub 은 한 단계가 실패하면
      #       아래를 통째로 건너뛰므로, 앞에 두면 이 2~3분짜리가 빨간불일 때 3초짜리 관문
      #       결과가 통째로 안 보인다 — 2026-09-03 에 ui-tone 을 맨 뒤로 옮긴 이유와 같다.
      #    🔴 앞 단계가 실패해도 돈다(`!cancelled()` — 2026-10-04 이전엔 이 조건이 없어 앞이 빨간 날 통째로 건너뛰었다).
      #       서버를 못 띄웠거나 브라우저를 못 깔았으면 돌 까닭이 없어 그때만 건너뛴다(위 화면 검사와 같은 조건).
      #    🔴 5분에 끊는다(`timeout -k 10 300` · 2026-10-04 코드 리뷰) — 매달리면 30분 그릇이 넘쳐 '취소'로 끝나 경보가 안 뜬다.
      #       끊기면 이 단계가 실패로 끝나 아래 경보가 뜬다. 위 화면 검사 예산(20분)과 합쳐 작업 상한 안에 들어가야 한다(관문 ci.mjs ②).
      - name: 전 여정 회귀 (drive.js)
        if: ${{ !cancelled() && steps.server.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: PORT=8123 timeout -k 10 300 node verify/drive.js
      - name: 🚨 화면 검사가 빨간불이다
        id: alarm
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          FAILED: ${{ steps.drivers.outputs.failed }}
          # 🔴 화면 검사 단계가 **돌았는지부터** 가른다 (2026-10-04 코드 리뷰). 실패 목록(FAILED)만 보면
          #    단계가 건너뛰어진 날에도 목록이 비어 '실패한 드라이버: 없음'이라고 적혀, 하나도 안 돈 것을 다 통과한 것처럼 말했다
          #    (CLAUDE.md 매 세션 5 — 확인 안 한 원인을 경고 문구에 단정하지 않는다). 관문 verify/health-gates/ci.mjs ② 가 세 갈래를 실제로 돌려 본다.
          DRIVERS: ${{ steps.drivers.outcome }}
          # 시간 예산을 다 써서 **시작도 못 한** 드라이버 — '실패한 드라이버'와 섞지 않는다(돌지 않은 것을 넘어졌다고 적지 않는다).
          UNRUN: ${{ steps.drivers.outputs.unrun }}
        run: |
          set -u
          case "${DRIVERS:-}" in
            success) drv="화면 검사 드라이버는 **전부 통과했습니다.** 빨간 단계는 그 밖(앞의 값싼 관문 · 말투·토큰 · 수집기 규칙 · 전 여정 등)에 있으니, 로그에서 빨간 표시가 붙은 단계를 찾으세요." ;;
            failure)
              drv=""
              if [ -n "${FAILED:-}" ]; then drv="실패한 드라이버: ${FAILED}."; fi
              if [ -n "${UNRUN:-}" ]; then
                drv="${drv:+$drv }화면 검사의 시간 예산을 다 써서 **돌리지 못한 드라이버**: ${UNRUN}. 어느 드라이버가 오래 걸렸는지 로그의 \`──\` 줄 사이 시각을 보세요."
              elif [ -n "$drv" ]; then
                drv="$drv 드라이버는 하나가 넘어져도 끝까지 돌았습니다. 다른 빨간 단계가 더 있을 수 있으니 로그도 보세요."
              else
                drv="화면 검사 단계가 실패했는데 실패한 드라이버 목록을 받지 못했습니다 — 로그에서 \`❌\` 가 붙은 줄과 빨간 단계를 찾으세요."
              fi ;;
            *) drv="화면 검사 드라이버와 전 여정(drive.js)이 **돌지 않았습니다** — 그 앞의 준비 단계(코드 내려받기 · 도구 설치 · 브라우저 설치 · 로컬 서버 띄우기) 가운데 하나가 실패했습니다. 로그에서 빨간 표시가 붙은 단계를 찾으세요." ;;
          esac
          body="**앱 화면 검사(브라우저)가 빨간불입니다.** 화면이나 판정이 깨졌다는 뜻입니다.

          · 브랜치: \`${BRANCH}\`
          · 시각: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST
          · 실행 로그: ${RUN_URL}

          ${drv}

          다음 Claude 세션에 \"화면 검사 빨간불 고쳐줘\" 라고 지시하세요.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
          # 본문은 로그에도 찍고(사람이 실행 화면에서 바로 본다) 다음 단계(경보 한 곳)로 넘긴다.
          printf '%s\n' "$body"
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            { echo 'body<<__UI_ALARM_BODY__'; printf '%s\n' "$body"; echo '__UI_ALARM_BODY__'; } >> "$GITHUB_OUTPUT"
          fi
      # 🔴 경보는 이슈 **하나**에 모은다 (2026-10-04 로봇·도구 점검 · tools/alert-issue.mjs).
      #    옛 판은 '라벨로 열린 것 찾기 → 없으면 만들기'라, 기본 브랜치와 main 두 실행(대기줄이 ref 마다 따로)이 같은 초에 둘 다
      #    '없음'을 보고 둘을 만들었다(#389·#390 · 09-30 #321·#322). 도구는 만든 뒤 다시 보아 큰 번호를 닫는다.
      #    제목 앞머리(prefix)로 찾아 옛 시각 붙은 제목도 이어진다. 여는 것은 아무 브랜치에서나(놓치는 쪽이 더 나쁘다).
      - name: 🚨 화면 검사 경보 이슈 (한 곳에 모은다)
        if: failure()
        uses: ./.github/actions/alert-issue
        with:
          token: ${{ github.token }}
          mode: open
          match: prefix
          title: 🚨 앱 화면 검사가 빨간불입니다
          label: ui-gate
          label-description: 앱 화면 검사(verify-ui)가 빨간불
          body: ${{ steps.alarm.outputs.body }}

      # 다시 초록불이면 스스로 닫는다 (admin-lock-check 와 같은 방식).
      # 🔴 '취소'는 닫는 근거가 못 된다 — 못 읽은 것을 '해결됐다'로 읽으면 경보가 조용히 사라진다.
      #    그래서 success() 일 때만 닫는다.
      # 🔴 **닫는 것은 기본 브랜치에서만** (2026-09-13 코드 리뷰).
      #    이 워크플로는 기본 브랜치와 main 둘 다에서 돈다. 조건 없이 닫으면
      #    **main 의 초록불이 기본 브랜치의 빨간 경보를 닫아 버린다** — 둘의 내용이
      #    잠깐 어긋나는 사이(배포 전)에 실제로 일어날 수 있다.
      #    여는 것은 아무 브랜치에서나 한다(놓치는 쪽이 더 나쁘다), 닫는 것만 좁힌다.
      #    ⚠️ 그래서 main 에서만 났다 고쳐진 경보는 기본 브랜치가 한 번 돌 때까지 열려 있다 —
      #       경보가 남아 있는 쪽이 조용히 사라지는 것보다 낫다(admin-lock-check 와 같은 정신).
      - name: 다시 초록불이면 옛 경보를 닫는다
        if: success() && github.ref_name == 'claude/nice-heisenberg-WESq5'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          for n in $(gh issue list --repo "$REPO" --label ui-gate --state open \
                       --json number --jq '.[].number' 2>/dev/null || true); do
            gh issue close "$n" --repo "$REPO" \
              --comment "✅ 화면 검사가 다시 전부 초록불입니다. (자동 확인 · ${RUN_URL})

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
          done
