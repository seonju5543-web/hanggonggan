# 인스타 카드뉴스 게시 — 관리자가 버튼으로 돌린다 (2026-09-10 신설)
#
# 🔴 **예약이 없다.** 브랜드 계정으로 나가는 되돌릴 수 없는 게시라, 사람이 누를 때만 돈다.
#    익숙해지면 `schedule:` 을 붙이면 되지만 그건 개발자가 정할 일이다.
#
# 🔴 **두 번 눌러야 올라간다 — 그리고 두 번째는 다시 그리지 않는다.**
#    ① 준비(기본)  고르고 · 그리고 · 커밋. 관리자가 그림과 캡션을 눈으로 본다.
#    ② 게시        **①이 커밋해 둔 그 폴더를 그대로** 올린다.
#    🔴 ②에서 다시 그리면 그 사이 데이터가 바뀌었을 때 **관리자가 본 것과 다른 공고**가
#       올라간다. 그래서 ②는 렌더러를 아예 안 부른다.
#    인스타는 파일 업로드를 안 받고 공개 주소를 요구해서, 어차피 커밋 → Pages 배포가
#    끝나야 올릴 수 있다. 그 사이가 사람이 확인하는 자리다.
#
# 🔴 시크릿 둘이 있어야 ②가 된다: IG_USER_ID · IG_ACCESS_TOKEN
#    (인스타 **프로 계정** + 페이스북 페이지 연결 + 앱의 Instagram Tester 역할까지 끝난 뒤)
name: 인스타 카드뉴스 게시

on:
  # 🔴 **예약은 '준비' 까지만이다.** 게시는 여전히 사람이 누른다 —
  #    자동으로 올리면 은서가 카드를 보는 자리가 사라진다(사실 관문이 못 잡는
  #    종류의 사고: 사진이 공고와 안 어울린다·말투가 이상하다 는 눈으로만 보인다).
  #    예약 실행에는 inputs 가 통째로 비어 있어서 `prepare` 만 켜지고 `publish` 는 꺼진다.
  # 🔴 예약은 **기본 브랜치에 있는 파일로만** 돈다 — 작업 브랜치에만 올리면 영영 안 돈다.
  schedule:
    # 08:41 KST. 🔴 UTC 정각·자정 부근은 GitHub 이 지연·생략한다(CLAUDE.md) — 홀수 분으로 피한다.
    #    9시에 메일이 도착해 있으려면 그리기(3~4분) + Pages 배포 기다림(~2분)을 앞당겨 둬야 한다.
    - cron: '41 23 * * 0,3'    # 일·수 23:41 UTC = 월·목 08:41 KST
  workflow_dispatch:
    inputs:
      step:
        description: '무엇을 할까'
        type: choice
        options: [준비만 (그리고 커밋), 게시 (준비된 것을 올린다)]
        default: '준비만 (그리고 커밋)'
      notice:
        description: '[준비] 올릴 공고 이름 일부 (비우면 점수로 자동 선택)'
        type: string
        default: ''
      tpl:
        description: '[준비] 판형 (auto = 공고 이름이 정한다)'
        type: choice
        options: [auto, photo, chat, note]
        default: auto

permissions:
  contents: write
  issues: write   # 🔴 실패를 요약에만 적으면 아무도 안 본다 — 이슈로 부른다

# 🔴 수집 로봇들과 **다른 대기줄**을 쓴다 — 같은 줄에 넣으면 GitHub 이 대기 중인
#    실행을 새 실행으로 취소해서 예약 수집이 조용히 사라진다(CLAUDE.md).
concurrency:
  group: insta-publish
  cancel-in-progress: false

env:
  BASE: claude/nice-heisenberg-WESq5

jobs:
  # ── ① 준비 — 고르고 그리고 커밋한다 ────────────────────────
  prepare:
    if: ${{ !startsWith(inputs.step, '게시') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25          # 🔴 없으면 GitHub 기본값 6시간까지 매달린다
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nice-heisenberg-WESq5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm init -y >/dev/null && npm i playwright@1 --no-audit --no-fund
      - run: npx playwright@1 install --with-deps chromium

      # 🔴 사실 관문을 먼저 통과해야 그린다 — 틀린 카드가 브랜드 계정으로 나가면 못 지운다.
      - name: 사실 관문
        run: node verify/verify-insta.js

      - name: 오늘 올릴 공고 고르기
        id: pick
        env:
          NOTICE: ${{ inputs.notice }}
        run: |
          if [ -n "$NOTICE" ]; then
            echo "손으로 지정: $NOTICE"
          else
            node insta/pick.mjs --list | head -8
            NOTICE=$(node insta/pick.mjs --name)
            echo "자동 선택: $NOTICE"
          fi
          echo "needle=$NOTICE" >> "$GITHUB_OUTPUT"

      - name: 카드·캡션 그리기
        env:
          NEEDLE: ${{ steps.pick.outputs.needle }}
          TPL: ${{ inputs.tpl }}
        run: |
          # 🔴 `--tpl` 을 안 주면 렌더러가 **씨앗으로** 고른다 — 같은 공고는 늘 같은 얼굴.
          if [ "$TPL" = "auto" ] || [ -z "$TPL" ]; then
            node insta/render.mjs "$NEEDLE" --pub
          else
            node insta/render.mjs "$NEEDLE" --tpl="$TPL" --pub
          fi

      - name: 관리자가 눈으로 볼 것
        run: |
          {
            echo '## 준비됐습니다 — 확인하고 「게시」로 다시 돌리세요'
            echo
            echo '### 캡션'
            echo '```'
            cat insta/pub/*/caption.txt
            echo '```'
            echo '### 공고'
            echo '```json'
            cat insta/pub/*/meta.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: 카드
          path: insta/pub/
          retention-days: 7

      # 🔴 커밋해야 GitHub Pages 가 공개 주소로 서빙한다 — 인스타는 그 주소로 가져간다.
      #    ⚠️ 어제 것을 지웠으므로 `-A` 로 **삭제까지** 담아야 한다.
      - name: 게시용 그림 커밋
        id: commit
        run: |
          D=$(ls -d insta/pub/*/ | tail -1 | sed 's:/$::')   # render 가 pub 을 통째로 지우고 써서 늘 하나다
          echo "dir=$D" >> "$GITHUB_OUTPUT"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A insta/pub
          git diff --cached --quiet && { echo '바뀐 게 없습니다'; exit 0; }
          git commit -m "인스타: $(basename "$D") 게시용 카드 준비"
          for i in 1 2 3; do
            git push origin "HEAD:$BASE" && break || { git pull --rebase origin "$BASE"; sleep 5; }
            [ "$i" = 3 ] && { echo '🚨 기본 브랜치에 못 올렸습니다'; exit 1; }   # 🔴 sleep 이 0 을 남겨 그냥 넘어가던 자리
          done
          git push origin HEAD:main        # 🔴 Pages 는 main 을 배포한다

      # 🔴 Pages 가 서빙을 시작해야 이슈에 박은 그림이 뜬다. 아직 404 인 채로 이슈를
      #    만들면 GitHub 의 그림 중계(camo)가 **그 404 를 캐시해** 나중에도 안 보인다.
      - name: 그림이 공개될 때까지 기다린다
        env:
          DIR: ${{ steps.commit.outputs.dir }}
        run: node insta/publish.mjs --dir="$DIR" --wait-only

      # 🔴 여기가 사람이 들어오는 자리다 — 담당자로 지정하면 GitHub 이 **메일을 보낸다**
      #    (이 저장소가 이미 여덟 군데서 쓰는 방식. 새 열쇠도 메일 서버도 필요 없다).
      - name: 은서에게 알린다
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          DIR: ${{ steps.commit.outputs.dir }}
        run: |
          ORG=$(jq -r .org  "$DIR/meta.json")
          NAME=$(jq -r .name "$DIR/meta.json")
          CODE=$(jq -r .code "$DIR/meta.json")
          {
            printf '**%s** · %s\n\n' "$ORG" "$NAME"
            echo '카드가 준비됐습니다. 보고 괜찮으면 **「게시」** 로 다시 돌려 주세요.'
            echo; echo '## 카드'
            # 🔴 주소는 publish.mjs 에 **묻는다** — 여기 베끼면 기다린 주소와 갈라진다.
            node insta/publish.mjs --dir="$DIR" --urls | while read -r u; do printf '![%s](%s)\n' "$(basename "$u")" "$u"; done
            echo; echo '## 캡션'; echo '```'; cat "$DIR/caption.txt"; echo '```'
            echo; echo '## 올리는 법'
            echo "Actions → 「인스타 카드뉴스 게시」 → Run workflow → **게시 (준비된 것을 올린다)**"
            echo
            echo '- 마음에 안 들면 **그냥 두세요** — 아무것도 안 올라갑니다.'
            echo '- 판형을 바꾸려면 「준비만」 을 `tpl` 을 photo·chat·note 로 지정해 다시 돌리면 됩니다.'
            echo "- 원본 PNG 는 실행 화면의 아티팩트: https://github.com/$REPO/actions/runs/$RUN"
            echo
            echo '올리고 나면 이 이슈는 **저절로 닫힙니다.**'
            # 🔴 게시 단계가 '은서가 본 것이 맞는지' 를 대조하는 표식이다. 지우지 말 것.
            echo "<!-- insta-code: $CODE -->"
          } > /tmp/ready.md
          gh label create insta-ready --repo "$REPO" --color 0E8A16 --description '인스타 카드 준비됨' 2>/dev/null || true
          # 🔴 담당자 지정이 **이 기능의 전부**다 — GitHub 이 담당자에게만 메일을 보낸다.
          #    막히면 알림 없는 이슈를 남기고 **빨간불로 끝낸다.** 조용히 초록불이 되면
          #    매주 아무도 안 읽는 이슈만 쌓인다(알림의 실패는 그 자체로 보여야 한다).
          if gh issue create --repo "$REPO" --label insta-ready --assignee didinin-wq \
               --title "📸 인스타 카드 준비됐습니다 — $ORG $NAME" --body-file /tmp/ready.md; then
            NEW=$(gh issue list --repo "$REPO" --label insta-ready --state open \
                    --json number --jq '.[].number' | sort -rn | head -1)
            # 🔴 **만들고 나서** 닫는다 — 먼저 닫으면 만들기가 실패했을 때 아무것도 안 남는다.
            for n in $(gh issue list --repo "$REPO" --label insta-ready --state open \
                         --json number --jq '.[].number'); do
              [ "$n" = "$NEW" ] && continue
              gh issue close "$n" --repo "$REPO" --comment '새로 준비된 카드가 있어 이 건은 닫습니다.'
            done
          else
            gh issue create --repo "$REPO" \
              --title "🚨 인스타 카드는 준비됐는데 은서에게 알리지 못했습니다 — $ORG $NAME" \
              --body-file /tmp/ready.md || true
            echo '🚨 담당자 지정에 실패했습니다 — didinin-wq 가 이 저장소 공동작업자인지 확인하세요.'
            exit 1
          fi

      # **선택** — 우리 주소에서 우리 디자인으로 한 통 더. 시크릿이 없으면 건너뛴다.
      #    기본 알림은 위 이슈의 담당자 지정으로 **GitHub 이** 보낸다(설정 필요 없음).
      #    🔴 SMTP 는 보내는 계정으로 로그인해야 한다 — 주소 없이 보내는 길은 없다.
      #       GitHub 메일이 주소 없이 오는 것처럼 보이는 건 GitHub 이 자기 서버에서
      #       자기 주소로 보내기 때문이고, 그 서버는 우리가 못 빌린다.
      #    🔴 제3자 액션을 안 쓰고 curl 로 보낸다 — 메일 열쇠가 남의 코드를 안 거친다.
      - name: 은서에게 메일 (선택)
        env:
          DIR: ${{ steps.commit.outputs.dir }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          MAIL_SMTP: ${{ secrets.MAIL_SMTP }}
        run: |
          TO="${MAIL_TO:-dhdp0105@gmail.com}"
          if [ -z "$MAIL_USER" ] || [ -z "$MAIL_PASS" ]; then
            # 🔴 이건 고장이 아니다 — **알림은 이미 GitHub 이 보냈다**(위 이슈의 담당자 지정).
            #    이 단계는 '우리 주소에서 우리 디자인으로' 한 통 더 보내는 선택지일 뿐이라,
            #    시크릿이 없다고 🚨 를 찍으면 매번 고장난 것처럼 보인다.
            echo '메일은 GitHub 알림으로 갔습니다(이슈 담당자 지정).' >> "$GITHUB_STEP_SUMMARY"
            echo '우리 주소에서 직접 보내고 싶으면 시크릿 `MAIL_USER`·`MAIL_PASS` 를 넣으세요.' >> "$GITHUB_STEP_SUMMARY"
            echo 'MAIL_USER·MAIL_PASS 없음 — GitHub 알림으로만 갑니다(정상).'
            exit 0
          fi
          node insta/mail.mjs --dir="$DIR" --to="$TO" --from="$MAIL_USER" --run="$RUN_URL" > /tmp/mail.txt
          curl -sS --ssl-reqd --url "smtps://${MAIL_SMTP:-smtp.gmail.com:465}" \
            --user "$MAIL_USER:$MAIL_PASS" \
            --mail-from "$MAIL_USER" --mail-rcpt "$TO" --upload-file /tmp/mail.txt
          echo "✅ $TO 로 메일을 보냈습니다."

      - name: 실패하면 시끄럽게
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          echo '🚨 준비가 실패했습니다 — 이슈를 만들었습니다.' >> "$GITHUB_STEP_SUMMARY"
          gh label create insta-fail --repo "$REPO" --color B60205 --description '인스타 게시 실패' 2>/dev/null || true
          gh issue create --repo "$REPO" --label insta-fail \
            --title '🚨 인스타 카드 준비가 실패했습니다' \
            --body "실행 로그: https://github.com/$REPO/actions/runs/$RUN

          사실 관문이 빨간불이면 카드가 원문을 상하게 하고 있다는 뜻이라, 고치기 전에는 올리면 안 됩니다."

  # ── ② 게시 — ①이 커밋한 것을 그대로 올린다. **다시 안 그린다** ──
  publish:
    if: ${{ startsWith(inputs.step, '게시') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nice-heisenberg-WESq5
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 준비된 것이 있는지
        id: dir
        run: |
          D=$(ls -d insta/pub/*/ 2>/dev/null | tail -1 | sed 's:/$::')
          [ -n "$D" ] || { echo '🚨 준비된 게 없습니다 — 「준비만」 으로 먼저 돌리세요.'; exit 1; }
          echo "준비된 폴더: $D"; cat "$D/meta.json"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      # 🔴 예약(준비)과 사람(게시)이 이제 **따로 돈다** — 그래서 경합이 생겼다.
      #    월요일 카드를 안 올린 채 목요일 아침 예약이 돌고, 그 몇 분 사이에 은서가
      #    월요일 메일을 열어 「게시」 를 누르면 **아무도 못 본 목요일 카드**가 올라간다.
      #    되돌릴 수 없으므로, 이슈에 박아 둔 표식과 지금 폴더가 같은 공고인지 본다.
      - name: 은서가 본 것과 같은 카드인가
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DIR: ${{ steps.dir.outputs.dir }}
        run: |
          NOW=$(jq -r .code "$DIR/meta.json")
          SEEN=$(gh issue list --repo "$REPO" --label insta-ready --state open --json body \
                   --jq '.[0].body' | sed -n 's/.*<!-- insta-code: \(.*\) -->.*/\1/p' | head -1)
          if [ -z "$SEEN" ]; then
            # 준비 이슈가 없다 — 대조할 것이 없다. 지금 버튼을 누른 사람이 곧 확인이다.
            echo "⚠️ 준비 이슈가 없어 대조를 못 했습니다. 폴더: $DIR ($NOW)"
          elif [ "$SEEN" != "$NOW" ]; then
            echo "🚨 은서가 본 카드는 \`$SEEN\` 인데 지금 준비된 것은 \`$NOW\` 입니다."
            echo '그 사이에 「준비만」 이 다시 돌아 폴더가 바뀌었습니다 —'
            echo '**아무도 안 본 카드가 올라갈 뻔했습니다.** 새 이슈를 열어 확인한 뒤 다시 누르세요.'
            exit 1
          else
            echo "✅ 대조 완료 — $NOW"
          fi

      - name: 인스타에 올리기
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node insta/publish.mjs --dir=${{ steps.dir.outputs.dir }} --publish

      - name: 준비 이슈를 닫는다
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for n in $(gh issue list --repo "$REPO" --label insta-ready --state open --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$REPO" --comment '올렸습니다 — 자동으로 닫습니다.'
          done

      # 🔴 올린 것을 기억 못 하면 내일 같은 공고를 다시 올린다(이슈 #75 유형).
      #    `git add` 목록에 넣는 것까지가 한 세트다.
      - name: 올린 기록 저장
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add insta/seen.json
          git diff --cached --quiet && { echo 'seen.json 변화 없음'; exit 0; }
          git commit -m '인스타: 올린 공고 기록'
          for i in 1 2 3; do
            git push origin "HEAD:$BASE" && break || { git pull --rebase origin "$BASE"; sleep 5; }
            [ "$i" = 3 ] && { echo '🚨 기본 브랜치에 못 올렸습니다'; exit 1; }   # 🔴 sleep 이 0 을 남겨 그냥 넘어가던 자리
          done
          git push origin HEAD:main

      # 🔴 `if: failure()` 는 **시간 초과에 반응하지 않는다** — 상한을 넘긴 작업은
      #    '실패' 가 아니라 '취소' 다(CLAUDE.md). 둘 다 잡는다.
      - name: 실패하면 시끄럽게
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          echo '🚨 게시가 실패했습니다 — 이슈를 만들었습니다.' >> "$GITHUB_STEP_SUMMARY"
          gh label create insta-fail --repo "$REPO" --color B60205 --description '인스타 게시 실패' 2>/dev/null || true
          gh issue create --repo "$REPO" --label insta-fail \
            --title '🚨 인스타 게시가 실패했습니다' \
            --body "실행 로그: https://github.com/$REPO/actions/runs/$RUN

          자주 나는 원인 셋
          - 토큰 만료 → IG_ACCESS_TOKEN 갱신 (「인스타 토큰 수명 확인」 참고)
          - 그림이 아직 공개 안 됨 → Pages 배포를 기다렸다 「게시」 를 다시
          - 24시간 100건 상한 초과 → 내일 다시"
