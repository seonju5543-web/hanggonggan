name: 배포 동기화 (기본 브랜치 → main)

# 왜 필요한가 (2026-07-31 발견):
#   앱(GitHub Pages)은 **main 브랜치**만 배포한다. 그런데 수집 로봇·심층 수집·자동 등록은
#   전부 기본 브랜치(claude/nice-heisenberg-WESq5)에만 커밋한다. 그래서 로봇이 매일 새 공고를
#   모아도 사람이 손으로 main에 옮기기 전까지는 **앱에 하루도 안 보였다**.
#   (7/30~7/31 수집분 = 공고 5건·정식 등록 5건이 이 이유로 배포되지 않은 채 남아 있었다.)
#   이제 로봇이 데이터를 바꿀 때마다 이 워크플로가 main까지 자동으로 밀어 올린다.
#
# 언제 도는가: 데이터를 바꾸는 로봇들이 끝난 직후 + 기본 브랜치에 사람이 push할 때 + 하루 2회 보정 + 수동 버튼.
#   ⚠️ **데이터를 고치는 로봇을 새로 만들면 아래 workflow_run 목록에 반드시 추가할 것.**
#   빠뜨리면 그 로봇의 결과는 '하루 2회 보정'에 걸릴 때까지 최대 12시간 앱에 안 나간다
#   (로봇 push는 GitHub 규칙상 push 트리거를 깨우지 못하기 때문). 2026-08-01에 링크 사냥꾼이
#   이 상태로 하루를 보낼 뻔했다.
#   (로봇 push는 GitHub 규칙상 다른 워크플로를 깨우지 못하므로 workflow_run·schedule을 함께 둔다.)

on:
  workflow_run:
    workflows: ['장학공고 수집 로봇', '브라우저형 수집 로봇', '공고 원문 심층 수집',
      '링크 사냥꾼 (까다로운 원문 주소 전담)', '원문 링크 복구 로봇', '관리자 조정',
      '검색용 요약 만들기']
    types: [completed]
  push:
    branches: ['claude/nice-heisenberg-WESq5']
  schedule:
    - cron: '23 3 * * *'   # 12:23 KST — 오전 수집(07:41·08:07) 뒤 보정
    - cron: '23 7 * * *'   # 16:23 KST — 낮 수집(11:41·12:07) 뒤 보정
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: deploy-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: main 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 로봇 기록장(공고 목록·본 공고 장부 등)이 양쪽에서 달라졌을 때 자동으로 합쳐 준다.
      # 이게 없으면 아래 병합이 충돌로 멈추고 🚨 이슈만 남는다 (COLLAB.md 참조).
      - name: 협업 병합기 등록 (충돌 자동 해소 — COLLAB.md)
        run: bash tools/setup-collab.sh

      - name: 기본 브랜치 내용을 main에 반영 (= 앱 배포)
        id: sync
        env:
          BASE: claude/nice-heisenberg-WESq5
        run: |
          git config user.name "handaejang-deploy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BASE" main

          if git merge-base --is-ancestor "origin/$BASE" HEAD; then
            echo "main이 이미 최신 — 배포할 변경 없음"
            echo "state=uptodate" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 최대 3회: 병합 → push. 그 사이 진척도 봇 등이 main을 바꿨으면 다시 받아서 재시도.
          for i in 1 2 3; do
            if ! git merge --no-edit "origin/$BASE" -m "배포 동기화: 기본 브랜치 수집분을 main에 반영 (자동)"; then
              git merge --abort || true
              echo "state=conflict" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git push origin HEAD:main; then
              echo "state=pushed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main && git reset --hard origin/main
          done
          echo "state=pushfail" >> "$GITHUB_OUTPUT"

      - name: 배포된 내용 요약
        if: steps.sync.outputs.state == 'pushed'
        run: |
          echo "✅ main 배포 완료 — 앱은 재설치 없이 자동 반영됩니다."
          node -e "const n=require('./data/notices.json'),r=require('./data/registered.json');
            const a=x=>Array.isArray(x)?x:(x.items||[]);
            console.log('실시간 공고 '+a(n).length+'건 · 정식 등록 '+a(r).length+'건');"

      - name: 🚨 동기화 실패 알림 (조용히 멈추지 않는다)
        if: failure() || steps.sync.outputs.state == 'conflict' || steps.sync.outputs.state == 'pushfail'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reason="${{ steps.sync.outputs.state }}"
          [ -z "$reason" ] && reason="error"
          gh issue create \
            --title "🚨 앱 배포 동기화 실패 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)" \
            --repo "${{ github.repository }}" \
            --assignee "${{ github.repository_owner }}" \
            --body "기본 브랜치(claude/nice-heisenberg-WESq5)의 내용을 **main**(앱이 배포되는 브랜치)에
          자동으로 옮기지 못했습니다. 사유: \`$reason\`

          그동안 수집된 새 장학 공고가 **앱에 보이지 않는 상태**입니다.
          다음 Claude 세션에서 아래를 실행해 손으로 병합해 주세요.

          \`\`\`
          git fetch origin main claude/nice-heisenberg-WESq5
          git checkout -B deploy origin/main
          git merge origin/claude/nice-heisenberg-WESq5
          # 충돌이 있으면 해결 후
          git push origin HEAD:main
          \`\`\`

          실행 기록: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
