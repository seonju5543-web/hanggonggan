name: 링크 사냥꾼 (까다로운 원문 주소 전담)

# 앱에 담긴 공고 중 아직 '게시판 목록 + 제목 표식(#n-…)'으로 남아 있는 것을 골라,
# 게시판에서 그 행을 실제로 **눌러서** 원문 주소를 알아낸다.
# 수집 로봇과 따로 두는 이유: 수집은 매일 12개 캠퍼스를 훑어야 해서 빨라야 하고,
# 이 일은 느려도 정확해야 하기 때문. 대상이 '남은 어려운 것'뿐이라 느려도 괜찮다.
#
# 실행 방법
#   · collector/run-link-hunt.txt 를 고쳐 push (push-to-run)
#   · Actions 화면에서 수동 실행
#   · 매일 새벽 (수집 로봇과 시간을 벌려 같은 학교를 연달아 두드리지 않게)

on:
  workflow_dispatch:
    inputs:
      dry:
        description: '모의 실행(저장하지 않고 결과만 확인)'
        type: boolean
        default: false
      only_board:
        description: '게시판 하나만 (주소 조각 — 예: dongguk.edu)'
        type: string
        default: ''
  push:
    paths:
      - 'collector/run-link-hunt.txt'
  schedule:
    # 06:37 KST — 일반 수집(07:41)·브라우저 수집(08:07)보다 앞서고 충분히 떨어져 있다.
    # 같은 학교를 연달아 두드리면 서버가 막는다(2026-07-31 동국대 사례).
    - cron: '37 21 * * *'
  # 🔴 **수집이 끝날 때마다 이어서 돈다** (2026-09-04 신설 — 예약 하나에만 매달리지 않는다).
  # 왜: 사냥꾼이 2026-08-26 이후 **열흘 동안 한 번도 결과를 남기지 않았다.** 그동안 다른
  # 로봇(수집·브라우저·검색요약·KOSAF)은 매일 커밋하고 있었고, 감사 관문도 그 기간 내내
  # 초록불이었다(09-03 트리에서 재현 확인). 즉 데이터도 코드도 멀쩡한데 **실행만 없었다** —
  # 손으로 돌려 보니 그 자리에서 원문 주소 16건을 찾아냈다. 예약이 왜 안 깨어났는지는
  # Actions 기록을 봐야 알 수 있지만, 원인을 몰라도 **깨우는 길을 하나 더 두면** 같은
  # 침묵이 반복되지 않는다. 새 `#n-` 표식은 정확히 '수집이 새 공고를 담았을 때' 생기므로
  # 수집 뒤가 사냥의 제자리다(deploy-sync 가 로봇들 뒤에 붙는 것과 같은 방식).
  # ⚠️ 로봇 push 는 GitHub 규칙상 push 트리거를 못 깨운다 — 그래서 workflow_run 이어야 한다.
  # ⚠️ 자주 돈다고 학교를 더 두드리지는 않는다: 실패한 표적은 nextTryAt(1→3→7→14→30일)에
  #    걸려 그날 안에 다시 두드려지지 않고, 찾은 것은 표식이 사라져 대상에서 빠진다.
  workflow_run:
    workflows: ['장학공고 수집 로봇', '브라우저형 수집 로봇']
    types: [completed]

permissions:
  contents: write
  issues: write

concurrency:
  group: link-hunter
  # 🔴 **끼어들어 죽이지 않는다** (2026-09-04 — workflow_run 을 붙이면서 함께 바꿨다).
  # 예약 하나뿐일 때는 true 여도 무해했지만, 이제 수집 둘이 26분 간격으로 끝나는데
  # 사냥 예산이 25분이라 **두 번째 트리거가 첫 사냥을 한창일 때 취소**할 수 있다.
  # 취소는 강제 종료라 저장 단계까지 죽는다 — 이 저장소가 세 번 겪은 그 사고다.
  # 사냥은 '남은 것을 이어서 하는' 일이라 기다렸다 도는 편이 언제나 옳다.
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    # 🔴 학교가 중간 인증서를 빠뜨려 Node 만 연결이 막히는 곳이 있다(계명대·조선대 등).
    # 브라우저·curl 은 사슬을 스스로 이어 붙이지만 Node 는 안 한다 — '로봇만 못 읽고
    # 학생은 멀쩡히 보는' 상태가 된다. 검증을 끄는 것이 아니라 서버가 깜빡한 사슬 한 칸을
    # 우리가 들고 있는 것이다(collector/certs/README.md). 2026-08-23 전수 점검으로 추가.
    env:
      NODE_EXTRA_CA_CERTS: collector/certs/sectigo-server-auth-dv-r36.pem
    # 시간 상한 (2026-08-01) — 없으면 GitHub 기본값인 **6시간**까지 매달린다.
    # 실제로 7/31 브라우저 수집이 360분을 돌다 취소됐고, 수집 로봇 2종이 같은
    # 대기줄(concurrency: collector)을 쓰기 때문에 그동안 다음 수집이 줄을 섰다.
    # 학교를 더 붙일수록 '한 곳이 안 열려 멈추는' 확률도 같이 오른다.
    timeout-minutes: 40   # 사냥 예산 25분 + 설치·검증
    steps:
      - uses: actions/checkout@v4
      - name: 협업 병합기 등록 (충돌 자동 해소 — COLLAB.md)
        run: bash tools/setup-collab.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm init -y >/dev/null && npm i playwright@1 --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - id: hunt
        env:
          HUNT_BUDGET_MS: '1500000'      # 25분 — 못 끝낸 것은 다음 실행이 이어서 한다
          HUNT_ONLY_BOARD: ${{ inputs.only_board }}
        run: node collector/link-hunter.mjs ${{ inputs.dry && '--dry' || '' }}

      # 데이터 관문 — 사냥해 온 주소가 규칙을 어기면 저장하지 않는다
      #
      # ⚠️ always() 인 이유 (2026-08-01): 예전에는 사냥 단계가 실패하면 이 아래가 통째로
      # 건너뛰어져, **4분 동안 실제로 찾아낸 원문 주소 13건이 그대로 버려졌다**
      # (리포트 마지막 줄의 낱말 하나 때문에 로봇이 넘어진 사고). 사냥은 오래 걸리는
      # 일이라 '다 되거나 아니면 전부 버리거나'는 너무 비싸다. 로봇도 넘어지기 전에
      # 저장하도록 고쳤고(link-hunter.mjs), 워크플로도 저장까지는 가도록 바꿨다.
      # 실행 자체는 여전히 빨간불로 남는다 — 아래 '🚨 실패 알림'이 그대로 뜬다.
      - name: 데이터 감사
        id: audit
        if: always()
        continue-on-error: true
        run: |
          node verify/test-collector.mjs
          node verify/audit-data.js

      - name: 감사 실패 시 되돌리기
        if: always() && steps.audit.outcome == 'failure'
        run: git checkout -- data/registered.json data/notices.json

      - name: 결과 저장 (기본 브랜치에 저장 → deploy-sync가 main으로 자동 배포)
        if: always() && steps.audit.outcome == 'success'
        run: |
          git config user.name "handaejang-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notices.json data/registered.json collector/link-hunt.json collector/link-hunt-report.md
          if ! git diff --cached --quiet; then
            git commit -m "링크 사냥꾼: 원문 주소 ${{ steps.hunt.outputs.found }}건 확보"
            pushed=0
            for i in 1 2 3; do
              if git push; then pushed=1; break; fi
              # --autostash: 저장 목록에 안 든 파일이 남아 있어도 재시도가 죽지 않게 (2026-08-02).
              # 이게 없으면 "cannot pull with rebase: You have unstaged changes"로 실행 전체가 날아간다.
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::링크 사냥 결과 push 실패 — 3회 재시도 모두 실패."
              exit 1
            fi
          fi

      - name: 리포트 출력
        if: always()
        run: cat collector/link-hunt-report.md || true

      # 3회 못 찾은 건을 사람에게 알린다 — 로봇이 포기하는 게 아니라, 사람이 보면
      # 더 빨리 풀릴 수 있는 것(게시판 주소가 바뀌었다 등)을 알리는 것이다.
      - name: 🔧 사람 확인 필요 건 알림
        if: steps.hunt.outputs.stuck != '' && steps.hunt.outputs.stuck != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "🔧 원문 주소를 3회 못 찾은 공고 ${{ steps.hunt.outputs.stuck }}건 (링크 사냥꾼 — 로봇은 계속 찾습니다)" \
            --body-file collector/link-hunt-report.md \
            --repo "${{ github.repository }}" \
            --label "link-hunter" \
            --assignee "${{ github.repository_owner }}" || \
          gh issue create \
            --title "🔧 원문 주소를 3회 못 찾은 공고 ${{ steps.hunt.outputs.stuck }}건 (링크 사냥꾼 — 로봇은 계속 찾습니다)" \
            --body-file collector/link-hunt-report.md \
            --repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-hunt-report
          path: |
            collector/link-hunt-report.md
            collector/link-hunt.json
          retention-days: 7

      - name: 🚨 실패 알림
        # cancelled()도 본다 — 시간 상한을 넘긴 작업은 '실패'가 아니라 '취소'로 끝나서
        # failure()만 보면 이 알림까지 건너뛴다 (2026-08-04·05 수집 로봇에서 실제로 겪은 구멍).
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::링크 사냥꾼 실행 실패 — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
