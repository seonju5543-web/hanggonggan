name: 로그인 서버 상태 확인 (Supabase)

# 로그인·기기 간 이어쓰기 서버(Supabase)가 **응답하는지** 매일 확인한다. (2026-10-04 로봇·도구 점검 · 묶음 servers)
#
# 왜 만들었나:
#   · 로그인은 켜져 있는데(supabase-config.js 에 주소·공개 열쇠가 채워져 있다) 살아 있는지 보는 로봇이 없었다.
#     푸시 서버(push-health)·관리자 잠금(admin-lock-check)은 매일 보면서 로그인 서버는 아무도 안 봤다.
#   · Claude 실행 환경은 *.supabase.co 접속이 프록시에서 막혀 세션 안에서는 확인이 안 된다 — 바깥(Actions)에서 여는 것만이 증명이다.
#
# 판정은 한 곳(tools/supabase-health.mjs · 관문 verify/health-gates/servers.mjs ⑨):
#   ok · misconfig(열쇠 거절 401/403) · down(그 밖·연결 실패 — 3번 물어도 안 될 때만) · off(설정이 비어 로그인이 꺼짐)
#   🔴 설정 파일을 못 읽으면(문법 오류·충돌 표식 등) 판정을 내지 않고 확인 단계가 실패한다 → 맨 아래 robot-down.
#      'off' 로 두면 아래 '닫는다' 단계가 열린 경보를 닫아 감시가 조용히 꺼진다(2026-10-04 리뷰).
# 🔴 공개 열쇠만 쓴다(service_role 아님 · 시크릿 불필요). 데이터는 읽지도 쓰지도 않는다(/auth/v1/health 만).
# ⚠️ 이 확인은 감시(알림)다 — 이 요청이 Supabase 휴면을 막아 주는지는 확인하지 않았다.
#
# 실행: Actions 탭 → 이 워크플로 → Run workflow · 자동: 매일 06:41 KST

on:
  schedule:
    # 21:41 UTC = 06:41 KST. 정각·자정을 피한 홀수 분 · 푸시 서버 확인(06:17)과 겹치지 않게
    - cron: '41 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: supabase-health      # 다른 로봇들과 대기줄을 섞지 않는다
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 🔴 체크아웃이 먼저다 — 판정 도구(tools/)·경보 액션(.github/actions/)이 저장소 파일이다(관문 alerts ⑥ S2).
      #    맨 위 폴더의 파일(supabase-config.js)은 sparse 체크아웃에서도 늘 같이 받는다.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/actions
            tools

      - name: 로그인 서버 응답 확인
        id: probe
        run: node tools/supabase-health.mjs

      - name: 🚨 이상이면 경보 이슈로 알린다
        id: alarm
        if: steps.probe.outputs.verdict == 'down' || steps.probe.outputs.verdict == 'misconfig'
        uses: ./.github/actions/alert-issue
        with:
          token: ${{ github.token }}
          mode: open
          title: 🚨 로그인 서버(Supabase) 이상
          match: exact
          label: supabase-health
          label-description: 로그인 서버(Supabase) 경보
          assignee: ${{ github.repository_owner }}
          body: |
            학생 **로그인·기기 간 이어쓰기** 서버(Supabase)가 매일 확인에서 정상 응답하지 않았습니다 (3번 물어 봄).

            > ${{ steps.probe.outputs.why }}

            원인은 이 확인만으로는 알 수 없습니다. 먼저 볼 것:
            1. Supabase 대시보드 → 이 프로젝트가 일시정지(Paused) 상태인지 · 상태 페이지(status.supabase.com)에 장애가 있는지
            2. 열쇠 거절(401·403)이면 Settings → API Keys 의 공개 열쇠(Publishable key)가 `supabase-config.js` 의 `anonKey` 와 같은지

            로그인이 멈춰도 앱은 게스트로 그대로 쓸 수 있습니다(기기 안 자료는 그대로) — 막히는 것은 로그인·다른 기기로 이어쓰기입니다.
            정상으로 돌아오면 다음 날 확인이 이 이슈를 닫습니다.

            실행 기록: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ---
            _Generated by [Claude Code](https://claude.ai/code)_

      - name: 정상이면 옛 경보 이슈를 닫는다
        if: steps.probe.outputs.verdict == 'ok' || steps.probe.outputs.verdict == 'off'
        uses: ./.github/actions/alert-issue
        with:
          token: ${{ github.token }}
          mode: resolve
          title: 🚨 로그인 서버(Supabase) 이상
          match: exact
          body: |
            ✅ 로그인 서버가 다시 정상으로 응답합니다(또는 로그인이 꺼져 확인 대상이 아닙니다). (자동 확인)

            ---
            _Generated by [Claude Code](https://claude.ai/code)_

      - name: 결과를 실패로 남긴다 (이상한 경우)
        if: steps.probe.outputs.verdict == 'down' || steps.probe.outputs.verdict == 'misconfig'
        run: exit 1

      # 결과 알림(위 경보)과 다른 것 — "보러 가다가 내가 넘어졌다"(확인 단계·경보 단계 자체가 실패·시간 초과)
      - name: 🚨 로봇이 넘어졌다
        if: cancelled() || (failure() && (steps.probe.outcome != 'success' || steps.alarm.outcome == 'failure'))
        uses: ./.github/actions/robot-down
        with:
          robot: 로그인 서버 상태 확인
          token: ${{ github.token }}
