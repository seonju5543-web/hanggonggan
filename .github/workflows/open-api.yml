# 공공 API 로봇 (2026-10-01) — 대외활동·공모전을 칸이 채워진 채로 받아 data/activities.json 에 싣는다.
# 출처·열쇠 설명은 collector/open-api.mjs 머리말. 열쇠는 이 저장소의 Actions secrets 에만:
#   DATA_GO_KR_KEY(공공데이터포털 · K-Startup·1365) · YOUTHCENTER_KEY · YOUTHCENTER_CONTENT_KEY(온통청년)
# 열쇠가 없는 출처는 로봇이 조용히 건너뛴다 — 그래서 열쇠가 다 오기 전에 걸어 둬도 안전하다.
# 저장은 기본 브랜치(로봇 저장 위치 원칙) — deploy-sync 가 main 으로 옮긴다(그 workflows: 목록에 이 이름이 있어야 한다).
name: 공공 API 로봇

on:
  schedule:
    # 홀수 분 · UTC 정각/자정 피함 · 07:41 수집 로봇보다 먼저(같은 파일을 쓰지만 대기줄이 같아 겹치지 않는다)
    # 🔴 같은 대기줄은 기다리는 실행을 하나만 남긴다 — 수집 로봇(07:41·11:41·15:41)·브라우저 수집(08:07·12:07)과 시간이 겹치면
    #    기다리던 예약 수집이 소리 없이 취소될 수 있어 아무도 안 도는 새벽에 둔다(리뷰 I4)
    - cron: '17 19 * * *'   # 매일 04:17 KST
    - cron: '17 7 * * *'    # 매일 16:17 KST — 백업(2026-10-04 · 새벽 실행이 공공데이터포털 'fetch failed' 로 두 번 졌다. 하루 한 번이면 그날 새 글이 빠진다)
  workflow_dispatch:
    inputs:
      probe:
        description: '정찰만 — 온통청년 쪽 하나씩 상태·응답 머리만 찍는다(저장·알림 안 함 · 목록은 open-api.mjs --probe)'
        type: boolean
        default: false
  push:
    branches: ['claude/nice-heisenberg-WESq5']
    paths:
      - 'collector/run-open-api.txt'   # 이 파일을 고쳐 push 하면 즉시 실행 (push-to-run)

permissions:
  contents: write
  issues: write

# 수집 로봇과 **같은 대기줄** — 둘 다 data/activities.json 을 쓴다. 같은 줄이면 순서대로 돈다.
concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 다른 브랜치에서 수동 실행하면 그 브랜치 커밋이 기본 브랜치로 rebase 되어 올라간다 — 기본 브랜치에서만 돈다(리뷰 M5)
    if: github.ref_name == 'claude/nice-heisenberg-WESq5'
    # 로봇 자체 예산 6분(요청 20초 · 청년콘텐츠 45초 × 3회 · 넘겨도 1분 반 안) + 준비·저장 여유 + 저장 앞 관문 5 · 되돌리기 7 (2026-11-15 G-16)
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v7
        with:
          # 대기줄에서 기다린 뒤에는 지금 브랜치 끝에서 시작한다(앞 로봇의 저장 위로 rebase 충돌 방지)
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 공공 API 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          YOUTHCENTER_KEY: ${{ secrets.YOUTHCENTER_KEY }}
          YOUTHCENTER_CONTENT_KEY: ${{ secrets.YOUTHCENTER_CONTENT_KEY }}
        # 🔴 tools/robot-run.sh 로 감싸지 말 것 — 그건 로컬용이라 클라우드에서는 '도는 로봇(=자기 자신)'을 보고 멈춘다
        run: node collector/open-api.mjs ${{ inputs.probe && '--probe' || '' }}

      # 데이터 관문 — 저장 직전. 실패하면 이번 결과는 저장하지 않는다(로봇이 고친 파일을 되돌린다)
      # 🔴 규칙 관문(test-collector)도 저장 앞에 (2026-11-15 · 노션 G-16 · 관문 「로봇·도구 점검 관문」 savegate) — data/activities.json 은
      #    수집 로봇도 쓰고 test-collector 도 읽는다. 감사만 거치면 test-collector 만 아는 규칙을 어긴 저장이 통과해 다음 수집 로봇의 관문이 빨개진다.
      - name: 데이터 관문 (규칙 관문 + 데이터 감사)
        id: audit
        continue-on-error: true
        timeout-minutes: 5
        run: |
          node verify/test-collector.mjs
          node verify/audit-data.js

      # 되돌리고 **관문을 다시 잰다** (collector/gate-guard.mjs 한 곳 · 수집 로봇과 같은 장치) — 되돌릴 것은 활동 파일 하나.
      # --keep-preexisting: 되돌려도 빨가고 새로 걸린 검사가 없으면(원래 있던 빨간불) 이번 결과는 저장한다(2026-11-10 수집 로봇과 같은 결정).
      # 도구가 넘어지면 예전처럼 활동 파일을 직전 판으로. 상한 7분 = 관문 최대 세 번 + 여유.
      - name: 관문 실패 시 활동 파일 되돌리기
        id: guard
        if: steps.audit.outcome == 'failure'
        timeout-minutes: 7
        run: |
          node collector/gate-guard.mjs --report collector/open-api-report.md --note /tmp/gate-note.md --keep-preexisting --stage data/activities.json || git checkout -- data/activities.json

      # 저장은 관문이 초록일 때만 — 처음 통과 · 되돌려서 통과 · 다시 재니 통과(flaky) · 원래 있던 빨간불(kept-preexisting). 끝내 빨가면 저장하지 않는다.
      - name: 저장
        if: steps.audit.outcome == 'success' || steps.guard.outputs.gate == 'reverted-files' || steps.guard.outputs.gate == 'flaky' || steps.guard.outputs.gate == 'kept-preexisting'
        run: |
          git config user.name "handaejang-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 로봇이 고친 파일은 전부 git add 에 (이슈 #79 규칙)
          [ -f data/activities.json ] && git add data/activities.json
          [ -f collector/open-api-report.md ] && git add collector/open-api-report.md
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "open-api: 공공 API 대외활동·공모전 갱신"
          for i in 1 2 3; do
            git pull --rebase --autostash origin claude/nice-heisenberg-WESq5 && git push origin HEAD:claude/nice-heisenberg-WESq5 && exit 0
            sleep 5
          done
          echo "::error::push 3회 실패"; exit 1

      # 출처 하나라도 ❌ 면 이슈로 알린다 — 로봇은 넘어지지 않고 지난 글을 지키므로, 알리지 않으면 아무도 모른다.
      # 시간 초과는 '실패'가 아니라 '취소'라 cancelled() 도 함께 본다(2026-08-04 수집 로봇 사고).
      - name: 🚨 출처 실패 알림
        if: success() || failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "${{ inputs.probe }}" = "true" ] && { echo "정찰 실행 — 알림 안 함"; exit 0; }   # 정찰은 아무것도 안 받아 저장하므로 옛 리포트의 ❌ 로 알리지 않는다
          failed=""
          [ "${{ job.status }}" != "success" ] && failed="로봇 실행이 끝까지 못 갔어요(실패 또는 시간 초과)."
          if [ -f collector/open-api-report.md ] && grep -q '❌' collector/open-api-report.md; then failed="$failed 받아 오지 못한 출처가 있어요."; fi
          [ -z "$failed" ] && exit 0
          body="🚨 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST **공공 API 로봇** — $failed
          $(grep -E '❌|⏸|✅' collector/open-api-report.md 2>/dev/null || true)

          실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          지난 글은 그대로 남아 있습니다. 고치려면 Claude 세션에 '공공 API 로봇 실패 확인해줘'라고 지시하세요.
          모든 출처를 다시 받아 오면 이 이슈는 저절로 닫힙니다."
          # 경보 한 곳(tools/alert-issue.mjs · 2026-10-04) — 제목 글자 그대로 찾아 댓글, 없으면 만든다(GitHub 검색으로 찾지 않는다)
          node tools/alert-issue.mjs --mode open --match exact --title '🛰 공공 API 로봇 알림' \
            --label open-api --label-color 1D76DB --label-description '공공 API 로봇 출처 실패' --body "$body"

      # 🔴 모든 출처가 다시 받아지면 알림을 닫는다 (2026-10-04 로봇·도구 점검). 옛 판은 ❌ 가 없으면 조용히 끝나기만 해서,
      #    10-02 'fetch failed' 뒤 출처 넷이 모두 ✅ 로 돌아왔는데도 #356 이 열린 채였다. 정찰 실행은 받지 않으므로 닫지 않는다.
      #    리포트가 없으면(못 읽음) 닫지 않는다 — 못 읽은 것을 '괜찮다'로 읽지 않는다.
      - name: 모든 출처가 다시 받아지면 알림을 닫는다
        if: success() && inputs.probe != true
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -f collector/open-api-report.md ] || { echo "리포트가 없어 판정하지 않습니다 — 닫지 않습니다."; exit 0; }
          if grep -q '❌' collector/open-api-report.md; then echo "아직 받지 못한 출처가 있어 닫지 않습니다."; exit 0; fi
          body="✅ $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST 공공 API 로봇 — 출처를 모두 다시 받았습니다. 자동으로 닫습니다.
          $(grep -E '✅|⏸' collector/open-api-report.md 2>/dev/null || true)

          실행 로그: ${RUN_URL}"
          node tools/alert-issue.mjs --mode resolve --match exact --title '🛰 공공 API 로봇 알림' --body "$body"

      # 🔴 관문 실패는 조용히 넘어가지 않는다 — 무엇을 되돌렸는지는 gate-guard 의 단락(/tmp/gate-note.md)을 그대로 싣는다(사냥꾼과 같은 꼴).
      #    이슈 **하나**에 모은다(제목에 날짜·결과 없음 · prefix) · 관문이 다시 통과하면 아래 짝이 닫는다(tools/alert-issue.mjs).
      - name: 🚨 데이터 관문 실패 알림
        if: always() && steps.audit.outcome == 'failure'
        timeout-minutes: 1
        run: |
          case "${{ steps.guard.outputs.gate }}" in
            reverted-files)   result="활동 파일을 되돌려서 통과 — 이번 API 결과는 저장하지 않음(리포트만)" ;;
            kept-preexisting) result="원래 있던 빨간불 — 이번 API 결과는 저장" ;;
            still-failing)    result="되돌려도 빨간불 — 이번 API 결과는 저장하지 않음" ;;
            flaky)            result="다시 재니 통과(되돌린 것 없음)" ;;
            *)                result="되돌리기 단계가 결과를 남기지 못함(넘어짐·건너뜀·시간 초과) — 이번 API 결과는 저장하지 않음" ;;
          esac
          {
            echo "🛰 공공 API 로봇: 🚨 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST **데이터 관문(test-collector · audit-data) 실패** — $result"
            echo
            if [ -n "${{ steps.guard.outputs.gate }}" ] && [ -s /tmp/gate-note.md ]; then cat /tmp/gate-note.md
            else echo "> 되돌리기 단계가 결과를 남기지 못했습니다(넘어짐·건너뜀·시간 초과) — 이번 API 결과는 저장하지 않았습니다."; fi
            echo
            echo "실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} · Claude 세션에 '공공 API 관문 실패 확인해줘'라고 지시하세요."
          } > /tmp/gate-issue.md
      - name: 🚨 데이터 관문 실패 — 경보 이슈
        if: always() && steps.audit.outcome == 'failure'
        timeout-minutes: 1
        uses: ./.github/actions/alert-issue
        with:
          token: ${{ github.token }}
          mode: open
          match: prefix
          title: 🚨 공공 API 로봇 — 데이터 관문 실패
          label: open-api-gate
          label-description: 공공 API 로봇 — 데이터 관문 실패
          body-file: /tmp/gate-issue.md
      - name: ✅ 데이터 관문 회복 — 경보 닫기
        if: always() && steps.audit.outcome == 'success'
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/alert-issue
        with:
          token: ${{ github.token }}
          mode: resolve
          match: prefix
          title: 🚨 공공 API 로봇 — 데이터 관문 실패
          body: |
            ✅ 데이터 관문이 다시 통과했습니다 — 이번 API 결과는 저장됩니다. 자동으로 닫습니다.
            실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # 🔴 관문이 끝내 빨가면 초록불로 끝내지 않는다 — 이슈는 위 단계가 이미 열었다. 알림 단계들 **뒤**(맨 끝)에 둔다
      #    (앞에 두면 「출처 실패 알림」이 job.status 를 보고 '로봇 실행이 끝까지 못 갔어요'라는 틀린 말을 붙인다).
      - name: 🚨 관문이 끝내 빨간불 (되돌린 뒤에도 · 원래 있던 빨간불 · 되돌리기 도구가 넘어짐)
        if: always() && steps.audit.outcome == 'failure' && steps.guard.outputs.gate != 'reverted-files' && steps.guard.outputs.gate != 'flaky'
        run: |
          echo "::error::데이터 관문이 빨갛습니다(결과: '${{ steps.guard.outputs.gate }}') — 이슈에 적었습니다."
          exit 1
