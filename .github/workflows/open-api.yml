# 공공 API 로봇 (2026-10-01) — 대외활동·공모전을 칸이 채워진 채로 받아 data/activities.json 에 싣는다.
# 출처·열쇠 설명은 collector/open-api.mjs 머리말. 열쇠는 이 저장소의 Actions secrets 에만:
#   DATA_GO_KR_KEY(공공데이터포털 · K-Startup·1365) · YOUTHCENTER_KEY · YOUTHCENTER_CONTENT_KEY(온통청년)
# 열쇠가 없는 출처는 로봇이 조용히 건너뛴다 — 그래서 열쇠가 다 오기 전에 걸어 둬도 안전하다.
# 저장은 기본 브랜치(로봇 저장 위치 원칙) — deploy-sync 가 main 으로 옮긴다(그 workflows: 목록에 이 이름이 있어야 한다).
name: 공공 API 로봇

on:
  schedule:
    # 홀수 분 · UTC 정각/자정 피함 · 07:41 수집 로봇보다 먼저(같은 파일을 쓰지만 대기줄이 같아 겹치지 않는다)
    # 🔴 같은 대기줄은 기다리는 실행을 하나만 남긴다 — 수집 로봇(07:41·11:41·15:41)·브라우저 수집(08:07·12:07)과 시간이 겹치면
    #    기다리던 예약 수집이 소리 없이 취소될 수 있어 아무도 안 도는 새벽에 둔다(리뷰 I4)
    - cron: '17 19 * * *'   # 매일 04:17 KST
    - cron: '17 7 * * *'    # 매일 16:17 KST — 백업(2026-10-04 · 새벽 실행이 공공데이터포털 'fetch failed' 로 두 번 졌다. 하루 한 번이면 그날 새 글이 빠진다)
  workflow_dispatch:
    inputs:
      probe:
        description: '정찰만 — 온통청년 쪽 하나씩 상태·응답 머리만 찍는다(저장·알림 안 함 · 목록은 open-api.mjs --probe)'
        type: boolean
        default: false
  push:
    branches: ['claude/nice-heisenberg-WESq5']
    paths:
      - 'collector/run-open-api.txt'   # 이 파일을 고쳐 push 하면 즉시 실행 (push-to-run)

permissions:
  contents: write
  issues: write

# 수집 로봇과 **같은 대기줄** — 둘 다 data/activities.json 을 쓴다. 같은 줄이면 순서대로 돈다.
concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 다른 브랜치에서 수동 실행하면 그 브랜치 커밋이 기본 브랜치로 rebase 되어 올라간다 — 기본 브랜치에서만 돈다(리뷰 M5)
    if: github.ref_name == 'claude/nice-heisenberg-WESq5'
    # 로봇 자체 예산 6분(요청 20초 · 청년콘텐츠 45초 × 3회 · 넘겨도 1분 반 안) + 준비·감사·저장 여유
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # 대기줄에서 기다린 뒤에는 지금 브랜치 끝에서 시작한다(앞 로봇의 저장 위로 rebase 충돌 방지)
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 공공 API 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          YOUTHCENTER_KEY: ${{ secrets.YOUTHCENTER_KEY }}
          YOUTHCENTER_CONTENT_KEY: ${{ secrets.YOUTHCENTER_CONTENT_KEY }}
        # 🔴 tools/robot-run.sh 로 감싸지 말 것 — 그건 로컬용이라 클라우드에서는 '도는 로봇(=자기 자신)'을 보고 멈춘다
        run: node collector/open-api.mjs ${{ inputs.probe && '--probe' || '' }}

      # 데이터 관문 — 저장 직전. 실패하면 이번 결과는 저장하지 않는다(로봇이 고친 파일을 되돌린다)
      - name: 데이터 감사
        run: node verify/audit-data.js || { git checkout -- data/activities.json; echo "::error::감사 실패 — 이번 API 결과를 버렸습니다"; exit 1; }

      - name: 저장
        run: |
          git config user.name "handaejang-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 로봇이 고친 파일은 전부 git add 에 (이슈 #79 규칙)
          [ -f data/activities.json ] && git add data/activities.json
          [ -f collector/open-api-report.md ] && git add collector/open-api-report.md
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "open-api: 공공 API 대외활동·공모전 갱신"
          for i in 1 2 3; do
            git pull --rebase --autostash origin claude/nice-heisenberg-WESq5 && git push origin HEAD:claude/nice-heisenberg-WESq5 && exit 0
            sleep 5
          done
          echo "::error::push 3회 실패"; exit 1

      # 출처 하나라도 ❌ 면 이슈로 알린다 — 로봇은 넘어지지 않고 지난 글을 지키므로, 알리지 않으면 아무도 모른다.
      # 시간 초과는 '실패'가 아니라 '취소'라 cancelled() 도 함께 본다(2026-08-04 수집 로봇 사고).
      - name: 🚨 출처 실패 알림
        if: success() || failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "${{ inputs.probe }}" = "true" ] && { echo "정찰 실행 — 알림 안 함"; exit 0; }   # 정찰은 아무것도 안 받아 저장하므로 옛 리포트의 ❌ 로 알리지 않는다
          failed=""
          [ "${{ job.status }}" != "success" ] && failed="로봇 실행이 끝까지 못 갔어요(실패 또는 시간 초과)."
          if [ -f collector/open-api-report.md ] && grep -q '❌' collector/open-api-report.md; then failed="$failed 받아 오지 못한 출처가 있어요."; fi
          [ -z "$failed" ] && exit 0
          body="🚨 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST **공공 API 로봇** — $failed
          $(grep -E '❌|⏸|✅' collector/open-api-report.md 2>/dev/null || true)

          실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          지난 글은 그대로 남아 있습니다. 고치려면 Claude 세션에 '공공 API 로봇 실패 확인해줘'라고 지시하세요."
          last=$(gh issue list --repo "${{ github.repository }}" --search '"공공 API 로봇" in:title' --state open --limit 1 --json number --jq '.[0].number' || true)
          if [ -n "$last" ] && [ "$last" != "null" ]; then
            gh issue comment "$last" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "🛰 공공 API 로봇 알림" --body "$body"
          fi
