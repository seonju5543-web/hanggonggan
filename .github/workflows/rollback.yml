name: 직전 판으로 되돌리기

# 사람이 올린 작업 하나를 **취소하는 기록**을 기본 브랜치에 얹고(git revert) 앱에 내보낸다 (2026-11-11 · 은서 · 출시 전 백엔드 8번).
#   · 도구: tools/rollback.mjs — 로봇 기록·합치기 기록·워크플로 파일을 고친 작업은 고를 수 없다 · 부딪히면 아무것도 안 바꾸고 멈춘다
#   🔴 기록을 되감지 않는다(reset·강제 push 금지 — 그 사이 로봇이 모은 공고가 사라진다) · main 만 돌리지 않는다(배포 동기화가 되살린다)
#   🔴 미리보기가 기본이다. 되돌리기는 **작업 번호를 직접 넣어야** 한다 — '가장 최근 것 바로 되돌리기'는 없다(2026-11-11 은서 결정).
#   🔴 검사(test-collector · audit-data)가 빨가면 저장하지 않는다.
#   쓰는 법: docs/backend/되돌리기-사용법.md · 관문: verify/health-gates/ops.mjs 「⑤ 직전 판으로 되돌리기」
#   입력은 셸 글자에 끼우지 않고 환경 변수로만 넘긴다(저장소 보안 규칙).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '미리보기(아무것도 안 바꿈) · 되돌리기(작업 번호 필요)'
        type: choice
        options: ['미리보기', '되돌리기']
        default: '미리보기'
      commit:
        description: '작업 번호 — 미리보기 목록의 번호 그대로 (되돌리기일 때 필수)'
        type: string
        default: ''
      reason:
        description: '왜 되돌리나요 (기록 이슈에 남습니다)'
        type: string
        default: ''

permissions:
  contents: write
  issues: write
  actions: write   # 배포 동기화·실제 앱 반영 확인을 깨운다

concurrency:
  group: rollback
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    if: github.ref_name == 'claude/nice-heisenberg-WESq5'
    timeout-minutes: 30   # 목록 1 + 되돌리기 1 + 검사 8 + 저장 2 + 배포 확인 대기 14 + 기록 2 + 여유 2
    env:
      MODE: ${{ inputs.mode }}
      COMMIT: ${{ inputs.commit }}
      REASON: ${{ inputs.reason }}
      ACTOR: ${{ github.actor }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 400
      - name: 협업 병합기 등록 (충돌 자동 해소 — COLLAB.md)
        run: bash tools/setup-collab.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 최근 사람 작업 목록
        timeout-minutes: 1
        run: node tools/rollback.mjs --list

      - name: 미리보기 (아무것도 바꾸지 않는다)
        if: inputs.mode == '미리보기' && inputs.commit != ''
        timeout-minutes: 1
        run: node tools/rollback.mjs --preview "$COMMIT"

      - name: 되돌리기 — 번호가 없으면 멈춘다
        id: revert
        if: inputs.mode == '되돌리기'
        timeout-minutes: 1
        run: |
          if [ -z "$COMMIT" ]; then
            echo "::error::되돌릴 작업 번호가 없습니다 — 먼저 미리보기로 목록을 보고, 번호를 넣어 다시 누르세요."
            echo '🚫 되돌릴 작업 번호가 없어 아무것도 하지 않았어요.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git config user.name "handaejang-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tools/rollback.mjs --revert "$COMMIT"

      # 🔴 검사가 빨가면 저장하지 않는다 — 되돌린 판이 다른 규칙을 깨면 앱에 내보내지 않는다
      - name: 검사 (수집기 규칙 + 데이터 감사)
        if: steps.revert.outputs.status == 'reverted'
        timeout-minutes: 8
        run: |
          node verify/test-collector.mjs
          node verify/audit-data.js

      - name: 저장 (기본 브랜치)
        id: push
        if: steps.revert.outputs.status == 'reverted'
        timeout-minutes: 2
        run: |
          pushed=0
          for i in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=1; break; fi
            if ! git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "::error::기본 브랜치에 얹다가 충돌 — 저장하지 않았습니다"
              break
            fi
          done
          [ "$pushed" = 1 ] || { echo "::error::되돌림을 저장하지 못했습니다(3회 재시도)"; exit 1; }
          echo "pushed=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 로봇 열쇠의 push 는 다른 워크플로를 깨우지 않는다 — 배포 동기화를 직접 깨워야 바로 나간다(안 깨우면 다음 예약까지 최대 12시간)
      - name: 배포 동기화 깨우기 → 끝나면 실제 앱 반영 확인
        if: steps.push.outcome == 'success'
        timeout-minutes: 14
        continue-on-error: true
        run: |
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run deploy-sync.yml --repo "$REPO" --ref "$GITHUB_REF_NAME"
          for i in $(seq 1 40); do
            sleep 15
            st=$(gh run list --repo "$REPO" --workflow deploy-sync.yml --event workflow_dispatch --limit 1 --json createdAt,status,conclusion \
                 --jq ".[] | select(.createdAt >= \"$since\") | .status + \":\" + (.conclusion // \"\")")
            case "$st" in completed:*) echo "배포 동기화: $st"; break ;; esac
          done
          sleep 150   # Pages 빌드가 끝날 시간
          gh workflow run check-live.yml --repo "$REPO" --ref "$GITHUB_REF_NAME" || true
          echo "배포 동기화를 깨웠고(${st:-결과 못 봄}), 실제 앱 반영 확인을 돌렸어요 — Actions 「실제 앱 반영 확인」 결과를 보세요." >> "$GITHUB_STEP_SUMMARY"

      - name: 기록 이슈 (세 분에게 메일)
        if: steps.push.outcome == 'success'
        timeout-minutes: 2
        continue-on-error: true
        run: |
          gh label create rollback --repo "$REPO" --color 5319E7 --description '직전 판으로 되돌리기 기록' 2>/dev/null || true
          {
            echo "↩ **${ACTOR}** 님이 작업 \`${COMMIT}\` 을 되돌렸습니다."
            echo
            echo "- 이유: ${REASON:-(적지 않음)}"
            echo "- 되돌림 기록: \`${{ steps.push.outputs.pushed }}\`"
            echo "- 실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "되돌린 것을 다시 살리려면 같은 버튼에서 **되돌림 기록 번호**를 넣어 되돌리면 됩니다."
          } > /tmp/rollback-issue.md
          gh issue create --repo "$REPO" --label rollback \
            --title "↩ 되돌림 — 작업 ${COMMIT}" \
            --assignee seonju5543-web --assignee Se-Hyeon-Jo --assignee didinin-wq \
            --body-file /tmp/rollback-issue.md

      - name: 🚨 되돌리기가 끝까지 못 갔다
        if: failure() || cancelled()
        timeout-minutes: 2
        run: |
          echo "🚨 되돌리기가 끝까지 가지 못했어요 — 위 단계의 빨간 표시를 보세요. 검사에서 멈췄다면 **아무것도 저장되지 않았어요.**" >> "$GITHUB_STEP_SUMMARY"
          gh label create rollback --repo "$REPO" --color 5319E7 --description '직전 판으로 되돌리기 기록' 2>/dev/null || true
          {
            echo "🚨 **${ACTOR}** 님이 누른 되돌리기(작업 \`${COMMIT:-번호 없음}\`)가 끝까지 가지 못했습니다."
            echo
            echo "- 검사·되돌리기 단계에서 멈췄다면 **아무것도 저장되지 않았습니다**(앱은 그대로)."
            echo "- 실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/rollback-fail.md
          gh issue create --repo "$REPO" --label rollback --title "🚨 되돌리기 실패 — 작업 ${COMMIT:-번호 없음}" \
            --assignee seonju5543-web --assignee Se-Hyeon-Jo --assignee didinin-wq --body-file /tmp/rollback-fail.md || true
