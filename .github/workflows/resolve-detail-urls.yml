name: 원문 링크 복구 로봇

# 앱에 담긴 공고 중 주소가 '게시판 목록 + 제목 표식'(#n-…)으로 남아 있는 것을 찾아
# 진짜 공고 원문 주소로 바꾼다. 사용자가 '원문 공고 ↗'를 눌렀을 때 학교 장학 공지
# 목록 전체가 아니라 그 장학금 공고 하나가 열리게 하는 것이 목적이다.
#
# 실행 방법:
#   · collector/run-resolve-urls.txt 를 고쳐 push (push-to-run — GitHub MCP 없는 세션도 가능)
#   · Actions 화면에서 수동 실행 (기본 브랜치에 올라간 뒤부터 가능)
#   · 매주 월요일 새벽 — 게시판 개편으로 주소가 바뀌어도 스스로 다시 맞춘다

on:
  workflow_dispatch:
    inputs:
      dry:
        description: '모의 실행(저장하지 않고 결과만 확인)'
        type: boolean
        default: false
      recheck_only:
        description: '이미 고친 주소 점검만 (게시판을 덜 두드린다)'
        type: boolean
        default: false
  push:
    paths:
      - 'collector/run-resolve-urls.txt'
  schedule:
    - cron: '13 20 * * 1'   # 매주 월요일 05:13 KST

permissions:
  contents: write
  issues: write

concurrency:
  group: resolve-detail-urls
  # 새 실행이 오면 옛 실행을 접는다 — 이 로봇은 '남은 것을 이어서 고치는' 성격이라
  # 옛 실행 결과를 기다릴 이유가 없고, 둘이 같은 파일을 고치면 저장에서 부딪힌다.
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    # 🔴 학교가 중간 인증서를 빠뜨려 Node 만 연결이 막히는 곳이 있다(계명대·조선대 등).
    # 브라우저·curl 은 사슬을 스스로 이어 붙이지만 Node 는 안 한다 — '로봇만 못 읽고
    # 학생은 멀쩡히 보는' 상태가 된다. 검증을 끄는 것이 아니라 서버가 깜빡한 사슬 한 칸을
    # 우리가 들고 있는 것이다(collector/certs/README.md). 2026-08-23 전수 점검으로 추가.
    env:
      NODE_EXTRA_CA_CERTS: collector/certs/sectigo-server-auth-dv-r36.pem
    # 시간 상한 (2026-08-01) — 없으면 GitHub 기본값인 **6시간**까지 매달린다.
    # 실제로 7/31 브라우저 수집이 360분을 돌다 취소됐고, 수집 로봇 2종이 같은
    # 대기줄(concurrency: collector)을 쓰기 때문에 그동안 다음 수집이 줄을 섰다.
    # 학교를 더 붙일수록 '한 곳이 안 열려 멈추는' 확률도 같이 오른다.
    timeout-minutes: 40   # 복구 예산 25분 + 설치·검증
    steps:
      - uses: actions/checkout@v4
      - name: 협업 병합기 등록 (충돌 자동 해소 — COLLAB.md)
        run: bash tools/setup-collab.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm init -y >/dev/null && npm i playwright@1 --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - id: run
        env:
          RESOLVE_BUDGET_MS: '1500000'   # 25분 — 못 끝낸 것은 다음 주 실행이 이어서 고친다
          # 게시판 하나만 돌리고 싶을 때 저장소 변수 RESOLVE_ONLY_BOARD에 주소 조각을 넣는다.
          # 같은 학교를 하루에 여러 번 두드리면 서버가 막으므로(2026-07-31 동국대), 고칠 게
          # 남은 학교만 골라 도는 데 쓴다.
          RESOLVE_ONLY_BOARD: ${{ vars.RESOLVE_ONLY_BOARD }}
        run: node collector/resolve-detail-urls.mjs ${{ inputs.dry && '--dry' || '' }} ${{ inputs.recheck_only && '--recheck-only' || '' }}

      # 데이터 관문 — 고친 주소가 규칙을 어기면 저장하지 않는다
      # always() 인 이유: 복구 로봇이 도중에 넘어져도 **그때까지 고친 주소는 저장한다**
      # (2026-08-01 링크 사냥꾼 사고 — 찾아 놓은 13건이 저장 단계 건너뜀으로 통째로 버려졌다).
      # 실행은 여전히 빨간불로 남는다.
      - name: 데이터 감사
        id: audit
        if: always()
        continue-on-error: true
        run: node verify/audit-data.js

      - name: 감사 실패 시 되돌리기
        if: always() && steps.audit.outcome == 'failure'
        run: git checkout -- data/registered.json data/notices.json

      - name: 결과 저장
        if: always() && steps.audit.outcome == 'success'
        run: |
          git config user.name "handaejang-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notices.json data/registered.json collector/resolve-report.md collector/resolved-urls.json
          if ! git diff --cached --quiet; then
            git commit -m "원문 링크 복구 — 목록 주소를 공고 원문 주소로 (${{ steps.run.outputs.fixed }}건)"
            pushed=0
            for i in 1 2 3; do
              if git push; then pushed=1; break; fi
              # --autostash: 저장 목록에 안 든 파일이 남아 있어도 재시도가 죽지 않게 (2026-08-02).
              # 이게 없으면 "cannot pull with rebase: You have unstaged changes"로 실행 전체가 날아간다.
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::복구 결과 push 실패 — 3회 재시도 모두 실패."
              exit 1
            fi
          fi

      - name: 리포트 출력 (로그로도 확인 가능하게)
        if: always()
        run: cat collector/resolve-report.md || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolve-report
          path: |
            collector/resolve-report.md
            collector/resolved-urls.json
          retention-days: 7
