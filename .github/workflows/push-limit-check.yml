name: 푸시 서버 배포 확인 (운영이 저장소 판인가)

# 2026-10-12 · 「푸시 서버 다시 배포 확인」 — 운영에 **어느 판이 도는지** 눌러서 본다. 저장·발송 없음.
#   첫 판(같은 날 오전)은 틀린 주소로 /subscribe 를 60번 보내 429 가 나오는지로 '새 판인가'를 가늠했다 — 그 판에만 있는 동작을
#   겉에서 더듬는 것이라 다음 판부터는 쓸 수 없고, 운영 서버를 60번 두드렸다.
#   이제 서버가 /health 에 **판 도장**(build · 배포 워크플로 push-deploy.yml 이 올릴 때 넣는다)을 내보이므로, 저장소에서 같은 도장
#   (tools/push-build-stamp.mjs)을 찍어 대조한다. 매일 확인(push-health.yml)도 같은 대조를 한다 — 이 버튼은 '지금 당장' 보고 싶을 때.
# 판정
#   ✅ 같다        운영 = 저장소 기본 브랜치의 서버 코드
#   ⚠️ 다르다/없다  운영이 옛 판(또는 도장 없는 길 — 대시보드·GitHub 연결 빌드 — 로 올린 판) → Actions 「푸시 서버 배포」로 올린다
# 실행: Actions 탭 → 이 워크플로 → Run workflow (Claude 세션이 원격 실행해도 된다)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nice-heisenberg-WESq5     # 운영에 올라가야 할 판은 기본 브랜치의 것이다
          sparse-checkout: |
            tools
            server/push
            server/shared

      - name: 저장소 도장과 운영 /health 의 build 를 대조한다
        run: |
          EXPECT=$(node tools/push-build-stamp.mjs)
          BODY=$(curl -sS --max-time 20 https://handaejang-push.seonju5543.workers.dev/health || true)
          GOT=$(printf '%s' "$BODY" | jq -r '.build // empty' 2>/dev/null || true)
          echo "저장소 도장: $EXPECT"
          echo "운영 build : ${GOT:-없음}"
          echo "$BODY"
          if [ "$GOT" = "$EXPECT" ]; then
            echo "✅ 운영이 저장소 기본 브랜치의 판입니다 ($EXPECT)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::운영 판(${GOT:-없음})이 저장소 판($EXPECT)과 다릅니다 — Actions 「푸시 서버 배포」(push-deploy.yml)를 돌리세요. 도장이 '없음'이면 도장 없는 길(대시보드·GitHub 연결 빌드)로 올린 옛 판입니다(server/push/README.md 2단계)."
            echo "⚠️ 운영 build=${GOT:-없음} · 저장소 도장=$EXPECT" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
