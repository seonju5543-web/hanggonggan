# 대학별 등록금 갱신 (2026-08-27)
# 두 갈래를 한 파일에 담는다 — 둘 다 data/tuition.json 을 고치므로 순서대로 돌아야 한다.
#   ① 학교 평균(avg)  : 공공데이터포털. Secret DATA_GO_KR_KEY 필요(없으면 조용히 건너뛴다).
#   ② 학교×계열(byField): 한국장학재단 포털. 열쇠가 필요 없어 ①이 건너뛰어도 혼자 돈다.
# 등록금 공시는 연 1회라 예약 실행은 두지 않았다 — 필요할 때 Actions에서 수동 실행.
# 저장은 기본 브랜치(로봇 저장 위치 원칙) — deploy-sync가 main으로 자동 배포한다.
name: 대학별·계열별 등록금 갱신

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # ② 계열 수확이 전량 2,711쪽 · 약 25분이다(서버가 초당 ~1.9쪽으로 막는다).
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          # 🔴 대기줄(collector)에서 기다린 뒤에는 **지금 브랜치 끝**에서 시작한다 (2026-09-30).
          #    기본값(GITHUB_SHA)은 큐에 들어간 시점에 굳어서, 앞 로봇이 저장한 커밋 위로 rebase 하다
          #    규칙 없는 장부에서 충돌 → 3회 실패 → 그 실행의 수집분이 통째로 버려졌다(브라우저 19곳 17분치).
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 등록금 수확
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        # --write 가 없으면 미리보기만 하고 저장하지 않는다(스크립트 기본값) — 빼면 안 된다.
        run: node collector/fetch-tuition.mjs --write

      # 열쇠가 필요 없다. 위 단계가 키 없이 끝났어도 이 단계는 제 몫을 한다.
      # 보강이 아니라 본업이라 continue-on-error 를 달지 않는다 — 관문에 걸리면 저장도 막혀야 한다.
      - name: 계열별 등록금 수확
        timeout-minutes: 45
        run: node collector/fetch-tuition-field.mjs --write

      # 🔴 데이터 관문 (2026-10-04 · 로봇·도구 점검) — 다른 로봇처럼 저장 **전에** 규칙 관문과 데이터 감사를 지난다.
      #    예전엔 관문 없이 저장해, 이 파일이 다른 로봇 관문의 전제를 깨면 저장은 되고 **다음 수집 로봇의 데이터 관문이 빨개져**
      #    그 실행 결과가 되돌려질 참이었다. 걸리면 저장 없이 빨간불(수동 실행이라 사람이 본다) — continue-on-error 를 달지 말 것.
      - name: 데이터 관문 (수집기 규칙 테스트 + 데이터 감사)
        timeout-minutes: 5
        run: |
          node verify/test-collector.mjs
          node verify/audit-data.js

      - name: 저장
        run: |
          git config user.name "handaejang-bot"
          git config user.email "bot@handaejang.local"
          [ -f data/tuition.json ] && git add data/tuition.json
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "tuition: 대학별·계열별 등록금 갱신"
          for i in 1 2 3; do
            git pull --rebase --autostash origin claude/nice-heisenberg-WESq5 && git push origin HEAD:claude/nice-heisenberg-WESq5 && exit 0
            sleep 5
          done
          echo "::error::push 3회 실패"; exit 1
