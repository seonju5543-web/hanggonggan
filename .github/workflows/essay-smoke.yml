# 초안 서버 실물 확인 — 개발자가 Actions 탭에서 누르는 버튼 (2026-08-23 신설)
#
# 하는 일: 진짜 Claude API가 초안 서버의 요청 모양을 받아 주는지 **호출 한 번으로** 본다.
#
# 왜 필요한가
#   verify/verify-essay-guard.mjs 는 가짜 응답으로 안전장치를 검사한다(돈 0).
#   그건 '우리 규칙이 도는가'를 증명하지만 'API가 이 모양을 받아 주는가'는 못 한다.
#   자격 AI가 `fallbacks` 하나 때문에 시범 3건이 전부 400으로 죽은 일이 그 틈에서 났다
#   (2026-08-23). 잔액이 없어 한 번도 안 걸렸다가, 채우자마자 첫 호출부터 죽었다.
#
# 비용: 호출 1회 (소넷 기준 약 50원). 데이터를 고치지 않는다 — 저장 단계가 없다.

name: 양식 자동작성 · 초안 서버 실물 확인

on:
  workflow_dispatch:
    inputs:
      model:
        description: '어느 모델로 볼까요 (비우면 기본값 claude-sonnet-5)'
        type: choice
        default: 'claude-sonnet-5'
        options:
          - 'claude-sonnet-5'
          - 'claude-opus-5'

permissions:
  contents: read

# 데이터를 고치지 않으므로 수집 로봇과 부딪힐 일이 없다.
# 그래도 대기줄은 따로 둔다 — 같은 줄에 넣으면 GitHub이 대기 중인 예약 수집을 취소한다.
concurrency:
  group: essay-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # ① 돈 쓰기 전에 안전장치부터. 여기서 실패하면 API를 아예 부르지 않는다.
      - name: 안전장치 검사 (돈 0)
        run: node verify/verify-essay-guard.mjs

      # ② 호출 1회. 요청 모양이 틀렸으면 API가 보낸 말을 그대로 로그에 남긴다.
      - name: 실물 호출 1회
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ESSAY_MODEL: ${{ inputs.model }}
        run: node server/essay/smoke.mjs
