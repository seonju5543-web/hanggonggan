name: 노션 「작업 현황」 갱신

# 노션 「작업 현황」의 '지금 하는 일 · 최근 커밋 · 브랜치 · 갱신' 을 push 때마다 채운다.
#
# 🔴 예전에는 main 의 PROGRESS.md 도 함께 갱신했다. 2026-09-06 개발자 지시로 그 문서를
#    폐기했다 — "낡았고 아무도 안 쓰니까 작성 중단하고 노션에 인수인계". 그래서
#    ① `update` 작업(활동 로그 커밋 + 갱신 알림 이슈) ② 하루 두 번 예약 을 통째로 뺐다.
#    ⚠️ 되살리지 말 것. 정본은 노션이고, 저장소에 사본을 만들면 두 벌이 되어 갈라진다.
#    ⚠️ 예약을 뺐어도 로봇 하트비트는 영향이 없다 — robot-heartbeat 는 이 로봇을 안 본다(확인함).
on:
  # 🔴 08:17·22:17 KST — 예전엔 :07 이었는데 '브라우저형 수집'과 **같은 분**이라
  #    둘이 동시에 같은 저장소에 push 했다(둘 다 재시도가 있어 버티긴 했다).
  #    예약 로봇끼리 분을 겹치지 않게 두는 것이 이 저장소 규칙이다(verify/test-collector '예약 겹침').
  # 🔴 예약을 두지 않는다 — 하루 두 번 돌던 것은 PROGRESS.md 활동 로그 때문이었고
  #    그 작업이 없어졌다. 남은 notion 작업은 push 때만 뜻이 있다(누가 방금 무엇을 했는가).
  #    예약만 남기면 할 일이 없는 실행이 하루 두 번 켜졌다 꺼진다.
  workflow_dispatch:        # 수동 실행 버튼
  # 🔴 push 될 때마다 **노션 「작업 현황」만** 갱신한다 (2026-09-06).
  #    12시간마다로는 "지금 누가 무엇을 하는지"가 안 보인다는 개발자 지시.
  #    ⚠️ 브랜치를 `claude/work-*` 로 좁히면 안 된다 — 셋 다 기본 브랜치 대비 0커밋인
  #       죽은 브랜치라 영영 안 돈다(2026-09-06 코드 리뷰가 잡았고 실측으로 확인했다).
  #       실제 작업은 매번 새로 생기는 주제 브랜치에서 일어난다.
  #    ⚠️ PROGRESS.md 커밋과 알림 이슈는 push 때 돌리지 않는다(아래 `update` 작업의 if)
  #       — push 마다 main 이 움직여 배포가 다시 돌고 두 개발자에게 메일이 쏟아진다.
  #    🔴 **브랜치를 걸러내지 않는다** (2026-09-06 개발자 질문 "현황 갱신은 나만 되는거야?"
  #       로 드러났다). push 트리거는 **push 된 그 브랜치에 있는 워크플로 파일**로 도는데,
  #       공동개발자들이 쓰던 브랜치에는 이 변경이 없어 영영 안 돌 뻔했다.
  #       셋 다 관례상 **main 에도 push** 하므로(CLAUDE.md '세 브랜치를 모두 같은 내용으로'),
  #       main 을 빼면 그 유일한 공통 통로가 막힌다. 로봇 push 는 아래 actor 조건이 거른다.
  push:

# 🔴 이 로봇은 이제 저장소에 아무것도 쓰지 않는다 — 노션 API 로만 말한다.
#    PROGRESS.md 를 커밋하던 시절의 `contents: write` · 알림 이슈용 `issues: write` 를
#    같이 뺐다. 남길 이유가 없는 권한은 남기지 않는다(checkout 에는 read 면 충분하다).
permissions:
  contents: read

jobs:
  # 노션 「작업 현황」 — push 한 사람의 줄만 갱신한다.
  # 🔴 PROGRESS 작업과 **분리**한다: 같은 작업에 두면 push 마다 main 이 움직인다.
  # 🔴 `continue-on-error` 를 걸지 않는다 — 열쇠 만료·공유 해제가 초록불에 묻히면
  #    '갱신' 칸이 멈춘 것만 보여 아무도 모른 채 몇 주가 지난다.
  # ⚠️ 로봇 push(수집기 등)는 사람이 아니므로 건너뛴다. 안 그러면 하루 10여 번 헛돈다.
  notion:
    # workflow_dispatch 도 받는다 — 열쇠를 넣고 **push 없이** 버튼 한 번으로 확인할 수 있어야
    # 한다(안 그러면 설정이 맞는지 아는 유일한 방법이 '아무거나 push 해 보기'가 된다).
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 같은 사람이 연달아 push 하면 마지막 것만 쓰면 된다(오래된 실행이 늦게 끝나 옛 상태를 덮는 것 방지).
    concurrency:
      group: notion-status-${{ github.actor }}
      cancel-in-progress: true
    steps:
      - name: Checkout pushed ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 노션 「작업 현황」 갱신
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node tools/notion-status.mjs
