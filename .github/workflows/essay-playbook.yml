# 작성 규칙 학습 — 개발자가 Actions 탭에서 누르는 버튼 (2026-08-23 신설)
#
# 하는 일: 공개된 '좋은 장학 자기소개서 쓰는 법' 글을 읽어 **규칙 후보 문장만** 뽑고,
#          우리 규칙 어휘에 붙인다. 어느 규칙에도 안 붙은 것은 '컨펌 대기'로 리포트에만.
#
# 🔴 예시문을 저장하지 않는다. 규칙만 배운다 — 표절·저작권·획일화 셋을 피하는 유일한 길.
#    경위: docs/designs/essay-tailoring.md
# 🔴 Claude API 를 쓰지 않는다 (개발자 지시). 규칙 매칭만 하므로 비용 0원.
# 🔴 Claude 실행 샌드박스는 한국 사이트가 막혀 있다(실측 403 × 10곳).
#    그래서 이 로봇은 **여기(Actions)에서만** 제대로 돈다 — 학교 게시판 수집과 같은 사정.

name: 양식 자동작성 · 작성 규칙 학습

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '무엇을 할까요'
        type: choice
        default: '읽고 저장'
        options:
          - '읽고 저장'
          - '미리보기만'      # 읽기만 하고 아무것도 저장하지 않는다
  # 🔴 지속가능성 (2026-08-24 개발자 지시 — 출처 넓히기를 '한 번'이 아니라 계속) :
  #    주 1회 스스로 돌아 ① 집 안 코퍼스를 다시 캐고 ② seeds 에서 링크를 6곳 더 따라간다.
  #    · 예약은 **기본 브랜치에서만** 돈다(GitHub 규칙) — 이 파일이 거기 있어야 작동한다.
  #    · 홀수 분 · UTC 자정·정각을 피한다(예약 혼잡 회피 정책, CLAUDE.md).
  #    · robots.txt 준수 · 실행당 새로 6곳뿐이라 바깥 사이트에 부담이 없다.
  #    · 저장 전 audit 관문을 통과해야만 커밋된다(실패 시 되돌림). 새 규칙은 자동 추가하지
  #      않고 리포트에만 — 예약이라 해서 검수 없이 규칙이 앱에 들어가지는 않는다.
  schedule:
    - cron: '37 20 * * 1'   # 매주 월 20:37 UTC = 화 05:37 KST

permissions:
  contents: write
  issues: write

# 🔴 수집 로봇(group: collector)과 **다른 대기줄**에 둔다.
#    같은 줄에 넣으면 GitHub 이 대기 중인 예약 수집을 취소해 그날 수집분이 조용히 사라진다.
concurrency:
  group: essay-playbook
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    # 주소 10곳 × 넉넉히 30초 = 5분. 감사·저장까지 담는 그릇으로 15분.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # 로봇은 자기가 읽은 브랜치(=기본 브랜치)에만 저장한다. 배포는 deploy-sync 의 몫.
          ref: 'claude/nice-heisenberg-WESq5'
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: 규칙 검사 (돈 0 · 인터넷 불필요)
        run: |
          node verify/verify-essay-ask.mjs
          node verify/verify-essay-guard.mjs

      # ① 집 안부터 — 이미 가진 공고 원문·첨부에서 **재단이 직접 적은 작성 규정**을 캔다.
      #    비용 0 · 네트워크 0. 바깥을 뒤지기 전에 여기부터 보는 것이 순서다.
      - name: 집 안 자료에서 작성 규정 캐기 (비용 0)
        run: node collector/essay-house-mine.mjs ${{ (inputs.mode == '읽고 저장' || github.event_name == 'schedule') && '--write' || '' }}

      # ② 바깥 — seeds 를 읽고, **읽은 글에서 다음에 읽을 곳을 스스로 주워** 몇 곳 더 읽는다.
      #    robots.txt 를 먼저 보고, 헛걸음한 곳은 30일 동안 다시 가지 않는다.
      - name: 읽고 규칙에 붙이기 (+ 스스로 넓히기)
        run: node collector/essay-playbook-learn.mjs ${{ (inputs.mode == '읽고 저장' || github.event_name == 'schedule') && '--write' || '' }}

      # 데이터 관문은 **저장 직전**에 둔다 (이슈 #79 의 교훈 — 앞에 두면 그 실행에서 안 잡히고
      # 다음 날 터진다). 규칙집이 깨지면 초안 서버가 통째로 못 뜬다.
      - name: 데이터 관문 (저장 직전)
        id: gate
        continue-on-error: true
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/essay-playbook.json','utf8'))"
          node verify/verify-essay-guard.mjs
          node verify/audit-data.js

      - name: 관문에 걸리면 되돌린다
        if: steps.gate.outcome == 'failure'
        run: |
          git checkout -- data/essay-playbook.json collector/essay-sources.json || true
          echo "::error::규칙집이 감사를 통과하지 못했습니다. 되돌렸습니다."
          exit 1

      - name: 저장
        id: save
        if: inputs.mode == '읽고 저장' || github.event_name == 'schedule'
        run: |
          git config user.name "handaejang-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 🔴 로봇이 고치는 파일을 전부 담는다 — 하나라도 빠지면 '반쪽만 저장'이 된다(이슈 #79).
          git add data/essay-playbook.json collector/essay-sources.json collector/essay-playbook-report.md \
                  data/essay-form-rules.json collector/essay-house-report.md
          if ! git diff --cached --quiet; then
            git commit -m "작성 규칙 학습 — 출처 갱신 (검수 전)"
            pushed=0
            for i in 1 2 3; do
              if git push; then pushed=1; break; fi
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::push 3회 실패 — 이번 결과가 저장되지 않았습니다."
              exit 1
            fi
            echo "changed=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::바뀐 것이 없습니다."
          fi

      # 🔴 예약 실행은 **바뀐 게 있거나 실패했을 때만** 이슈를 연다 — 매주 '변화 없음' 이슈가
      #    쌓이면 소음이 된다(수집 로봇의 '0건이면 코멘트만' 원칙과 같은 맥락). 사람이 누른
      #    실행(workflow_dispatch)은 결과가 궁금해 누른 것이므로 언제나 리포트한다.
      - name: 결과 리포트 이슈
        if: always() && (github.event_name == 'workflow_dispatch' || failure() || steps.save.outputs.changed == '1')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => { try { return fs.readFileSync(p, 'utf8').slice(0, 60000); } catch { return '(리포트를 만들지 못했습니다)'; } };
            const ok = process.env.RESULT === 'success';
            const house = read('collector/essay-house-report.md');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: ['essay-playbook'],
              title: `${ok ? '📘' : '🚨'} 작성 규칙 학습 — ${new Date().toISOString().slice(0, 10)}`,
              body: `${read('collector/essay-playbook-report.md')}\n\n---\n\n${house}`.slice(0, 60000),
            });
        env:
          RESULT: ${{ job.status }}

      # 🔴 `if: failure()` 만 쓰면 **시간 초과에 반응하지 않는다** — 상한을 넘긴 작업은
      #    '실패'가 아니라 '취소'로 끝나 알림 단계까지 건너뛴다(2026-08-04 사고).
      - name: 실패·취소 알림
        if: failure() || cancelled()
        run: echo "::error::작성 규칙 학습이 실패하거나 취소됐습니다. 리포트 이슈를 확인하세요."
