name: 관리자 조정

# 관리자 페이지(Cloudflare)에서 누른 버튼이 이 워크플로를 깨운다.
#
# 왜 화면이 저장소를 직접 고치지 않는가:
#   ① 관리자 열쇠에 **파일 쓰기 권한을 주지 않아도 되기 때문**이다. 열쇠가 새어도 남이 할 수 있는
#      일은 '정해진 이 절차를 한 번 돌리는 것'뿐이고, 임의의 코드·데이터를 넣을 수 없다.
#   ② 모든 변경이 **기존 감사(verify/audit-data.js)를 통과해야만 저장**되기 때문이다.
#      통과하지 못하면 되돌리고 실패로 끝난다 — 잘못된 데이터가 학생 앱에 하루도 나가지 않는다.
#
# 저장 후 앱1 반영은 deploy-sync.yml이 이어서 한다.
# ⚠️ 로봇 push는 다른 워크플로를 깨우지 못하므로, deploy-sync.yml의 workflow_run 목록에
#    이 워크플로 이름('관리자 조정')이 들어 있어야 한다. 빠지면 최대 12시간 앱에 안 나간다.

on:
  workflow_dispatch:
    inputs:
      action:
        description: '작업 (confirm / revert / remove / edit / merge / autoRegister / addBoard)'
        required: true
        type: string
      payload:
        description: '작업 내용 (JSON)'
        required: true
        type: string

permissions:
  contents: write
  issues: write

# 수집 로봇과 같은 줄에 세운다 — 같은 데이터 파일을 동시에 고치다 부딪히지 않게.
concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nice-heisenberg-WESq5

      - name: 협업 병합기 등록 (충돌 자동 해소 — COLLAB.md)
        run: bash tools/setup-collab.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 요청 내용 적용
        id: apply
        env:
          # 화면에서 온 값은 셸에 직접 넣지 않고 환경변수로만 넘긴다 (기존 워크플로와 같은 규칙)
          ACTION: ${{ inputs.action }}
          PAYLOAD: ${{ inputs.payload }}
          ACTOR: ${{ github.actor }}
        run: node tools/admin-apply.mjs

      # 관문 — 여기서 걸리면 저장하지 않는다
      - name: 데이터 감사
        id: audit
        continue-on-error: true
        run: node verify/audit-data.js

      - name: 감사 실패 — 변경을 통째로 되돌림
        if: steps.audit.outcome == 'failure'
        run: |
          git checkout -- data collector
          echo "::error::데이터 감사를 통과하지 못해 아무것도 저장하지 않았습니다."

      - name: 저장
        if: steps.audit.outcome == 'success'
        env:
          ACTION: ${{ inputs.action }}
          ACTOR: ${{ github.actor }}
        run: |
          git config user.name "handaejang-admin-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registered.json data/admin-log.json \
                  collector/auto-register-config.json collector/schools.json
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없습니다."
            exit 0
          fi
          git commit -m "관리자 조정: ${ACTION} (요청 ${ACTOR})"
          pushed=0
          # 그 사이 수집 로봇이 먼저 썼을 수 있다 — 받아서 얹은 뒤 재시도
          for i in 1 2 3; do
            if git push; then pushed=1; break; fi
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::저장(push)에 3회 모두 실패했습니다. 조정이 반영되지 않았습니다."
            exit 1
          fi

      - name: 감사 실패를 실패로 끝낸다
        if: steps.audit.outcome == 'failure'
        run: exit 1

      # 조용히 멈추지 않는다 — 관리자 화면에도 실패가 보이지만, 기록은 이슈에도 남긴다
      - name: 🚨 실패 알림
        # cancelled()도 본다 — 시간 상한을 넘긴 작업은 '실패'가 아니라 '취소'로 끝나서
        # failure()만 보면 이 알림까지 건너뛴다 (2026-08-04·05 수집 로봇에서 실제로 겪은 구멍).
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTION_NAME: ${{ inputs.action }}
          WHO: ${{ github.actor }}
        run: |
          LABEL="admin-apply"
          gh label create "$LABEL" --repo "$REPO" --color 5319E7 \
            --description "관리자 화면에서 요청한 조정 실패" 2>/dev/null || true
          existing=$(gh issue list --repo "$REPO" --state open --label "$LABEL" \
                       --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          body="관리자 화면에서 요청한 조정 \`${ACTION_NAME}\` 이 반영되지 않았습니다 (요청: @${WHO}).

          데이터는 **바뀌지 않았습니다** — 감사를 통과하지 못하면 되돌리도록 되어 있습니다.
          사유는 실행 기록에서 볼 수 있습니다: ${RUN_URL}

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --label "$LABEL" \
              --title "🚨 관리자 조정 실패 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)" \
              --body "$body"
          fi
