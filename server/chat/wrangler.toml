name = "handaejang-chat"
main = "worker.js"
compatibility_date = "2026-01-01"

# 저장할 것이 없다 — 질문도 답도 남기지 않는다(KV 없음).
# 그래서 사고가 나도 새어 나갈 기록 자체가 없다.

# 쓸 모델. 이 서버는 '고르기'만 하므로 가장 싼 모델로 충분하다.
[vars]
CHAT_MODEL = "claude-haiku-4-5-20251001"

# 🔴 열쇠는 여기 두지 않는다. 배포 후 명령 한 줄로 넣는다:
#     npx wrangler secret put ANTHROPIC_API_KEY

# 🔴 요청 횟수 제한 (2026-10-12 · server/shared/guard.mjs) — 접속 주소 하나가 1분에 15번까지. 없으면 서버가 부르지 않는다(503) — 앱은 무료 안내봇으로 물러난다.
#    Cloudflare 무료 기능 · 1분 창.
[[ratelimits]]
name = "CHAT_LIMIT"
namespace_id = "1102"
  [ratelimits.simple]
  limit = 15
  period = 60
