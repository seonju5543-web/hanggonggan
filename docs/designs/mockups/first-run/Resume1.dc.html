<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Pretendard Variable', Pretendard, 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    a { color: #8a6a1f; } a:hover { color: #6d541a; }
    .r1-card { background: #ffffff; border: 1px solid rgba(25,23,19,0.09); border-radius: 19px; padding: 19px; box-shadow: 0 1px 2px rgba(24,35,56,0.05), 0 8px 22px rgba(24,35,56,0.07); }
    .r1-badge { font-size: 11.5px; font-weight: 700; padding: 3.5px 9px; border-radius: 9px; }
    .r1-nav { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: #8b857b; padding: 5px 0; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #fefdfc; color: #191713; overflow: hidden; position: relative;">

  <!-- 돌아온 자리 표시 -->
  <div style="position: absolute; top: 0; left: 0; right: 0; z-index: 5; background: #23201a; color: #f4efe3; font-size: 12.5px; font-weight: 600; padding: 9px 20px; display: flex; align-items: center; gap: 8px;">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    5분 전 보던 자리 — 탭·스크롤 그대로
  </div>

  <div style="padding: 56px 20px 0; box-sizing: border-box;">

    <!-- 스크롤이 이미 내려가 있음을 보여 준다 -->
    <div style="opacity: 0.28; font-size: 21px; font-weight: 800; letter-spacing: -0.025em; margin: 0 0 14px;">장학금 찾기</div>

    <div style="display: flex; gap: 7px; margin-bottom: 14px;">
      <span style="font-size: 12.5px; font-weight: 700; padding: 7px 13px; border-radius: 999px; background: #23201a; color: #fdfbf6;">전체</span>
      <span style="font-size: 12.5px; font-weight: 600; padding: 7px 13px; border-radius: 999px; background: #ffffff; border: 1px solid rgba(25,23,19,0.14); color: #57524a;">교내</span>
      <span style="font-size: 12.5px; font-weight: 600; padding: 7px 13px; border-radius: 999px; background: #ffffff; border: 1px solid rgba(25,23,19,0.14); color: #57524a;">교외</span>
      <span style="font-size: 12.5px; font-weight: 600; padding: 7px 13px; border-radius: 999px; background: #ffffff; border: 1px solid rgba(25,23,19,0.14); color: #57524a;">신청 가능만</span>
    </div>

    <div style="display: grid; gap: 10px;">
      <div class="r1-card">
        <div style="display: flex; gap: 6px; margin-bottom: 9px;">
          <span class="r1-badge" style="background: rgba(138,106,31,0.10); color: #8a6a1f;">적합도 82%</span>
          <span class="r1-badge" style="background: #f0ecfd; color: #6247d6;">교외</span>
          <span class="r1-badge" style="background: #f5e9e6; color: #8f3a2e;">D-4</span>
        </div>
        <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.35;">삼성꿈장학재단 대학생 장학</div>
        <div style="font-size: 13.5px; color: #57524a; margin-top: 6px;">최대 400만원 · 학기당</div>
      </div>

      <div class="r1-card" style="outline: 2px solid rgba(138,106,31,0.30); outline-offset: 2px;">
        <div style="display: flex; gap: 6px; margin-bottom: 9px;">
          <span class="r1-badge" style="background: rgba(138,106,31,0.10); color: #8a6a1f;">적합도 74%</span>
          <span class="r1-badge" style="background: #e9efe8; color: #3d6b47;">교내</span>
          <span class="r1-badge" style="background: rgba(18,22,31,0.05); color: #57524a;">D-11</span>
        </div>
        <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.35;">경희대학교 면학장학금 (2학기)</div>
        <div style="font-size: 13.5px; color: #57524a; margin-top: 6px;">등록금 50% · 성적 우수</div>
      </div>

      <div class="r1-card">
        <div style="display: flex; gap: 6px; margin-bottom: 9px;">
          <span class="r1-badge" style="background: rgba(138,106,31,0.10); color: #8a6a1f;">적합도 61%</span>
          <span class="r1-badge" style="background: #f0ecfd; color: #6247d6;">교외</span>
          <span class="r1-badge" style="background: rgba(18,22,31,0.05); color: #57524a;">기한 원문 확인</span>
        </div>
        <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.35;">익산사랑장학재단 일반장학생</div>
        <div style="font-size: 13.5px; color: #57524a; margin-top: 6px;">최대 200만원</div>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; background: rgba(255,254,252,0.94); border-top: 1px solid rgba(18,22,31,0.06); padding: 8px 0 12px;">
    <div class="r1-nav"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>홈</div>
    <div class="r1-nav" style="color: #23201a;"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg>장학금</div>
    <div class="r1-nav"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>신청내역</div>
    <div class="r1-nav"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>MY</div>
  </div>

</div>
</x-dc>
</body>
</html>
