<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Pretendard Variable', Pretendard, 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    a { color: #8a6a1f; } a:hover { color: #6d541a; }
    .r2-badge { font-size: 11.5px; font-weight: 700; padding: 3.5px 9px; border-radius: 9px; }
    .r2-row { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; line-height: 1.55; color: #57524a; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #fefdfc; color: #191713; overflow: hidden; position: relative;">

  <div style="position: absolute; top: 0; left: 0; right: 0; z-index: 5; background: #23201a; color: #f4efe3; font-size: 12.5px; font-weight: 600; padding: 9px 20px; display: flex; align-items: center; gap: 8px;">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    보던 공고가 다시 열린다 — 판정은 새로
  </div>

  <div style="position: absolute; inset: 33px 0 0; background: rgba(10, 14, 24, 0.55);"></div>

  <!-- 시트 -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 690px; background: #ffffff; border-radius: 27px 27px 0 0; box-shadow: 0 -8px 40px rgba(24,35,56,0.18); padding: 10px 20px 20px; box-sizing: border-box; overflow: hidden;">

    <div style="width: 38px; height: 4px; border-radius: 999px; background: rgba(25,23,19,0.14); margin: 0 auto 16px;"></div>

    <div style="display: flex; gap: 6px; margin-bottom: 10px;">
      <span class="r2-badge" style="background: #f0ecfd; color: #6247d6;">교외</span>
      <span class="r2-badge" style="background: #f5e9e6; color: #8f3a2e;">마감</span>
    </div>

    <div style="font-size: 21px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.3;">삼성꿈장학재단 대학생 장학</div>
    <div style="font-size: 13.5px; color: #8b857b; margin-top: 6px;">삼성꿈장학재단</div>

    <!-- 자리를 비운 사이 마감된 경우 -->
    <div style="margin-top: 16px; background: #f5e9e6; border-radius: 13px; padding: 14px 16px; display: flex; gap: 11px; align-items: flex-start;">
      <span style="color: #8f3a2e; display: flex; flex-shrink: 0; margin-top: 1px;"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.3v.2"/></svg></span>
      <div>
        <div style="font-size: 14.5px; font-weight: 700; color: #8f3a2e; line-height: 1.4;">자리를 비운 사이에 마감됐어요</div>
        <div style="font-size: 13px; color: #57524a; margin-top: 5px; line-height: 1.55;">접수 마감 2026. 9. 9. 18:00 · 다시 열 때마다 마감과 자격을 새로 확인합니다</div>
      </div>
    </div>

    <div style="margin-top: 22px; font-size: 15px; font-weight: 800; letter-spacing: -0.02em;">지원 자격</div>
    <div style="font-size: 11.5px; color: #8b857b; margin-top: 3px; margin-bottom: 11px;">공고 원문 안내 · 원문 그대로</div>

    <div style="display: grid; gap: 9px;">
      <div class="r2-row"><span style="color: #3d6b47; flex-shrink: 0; display: flex; margin-top: 2px;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></span>국내 4년제 대학 재학생(휴학생 제외)</div>
      <div class="r2-row"><span style="color: #3d6b47; flex-shrink: 0; display: flex; margin-top: 2px;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></span>직전 학기 성적 평점 3.0 이상</div>
      <div class="r2-row"><span style="color: #8b857b; flex-shrink: 0; display: flex; margin-top: 2px;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 1 1 3.3 2.5c-.6.2-.8.6-.8 1.2v.5"/><path d="M12 16.6v.2"/></svg></span>소득분위 8분위 이하 — 확인 필요</div>
    </div>

    <div style="margin-top: 26px; display: flex; flex-direction: column; gap: 9px;">
      <button style="width: 100%; border: 0; border-radius: 13px; padding: 17px; font-size: 17px; font-weight: 700; background: rgba(25,23,19,0.12); color: rgba(25,23,19,0.36); font-family: inherit;">접수가 마감된 공고입니다</button>
      <button style="width: 100%; border: 1px solid rgba(25,23,19,0.14); border-radius: 13px; padding: 15px; font-size: 15px; font-weight: 700; background: transparent; color: #191713; font-family: inherit; cursor: pointer;">원문 공고 ↗</button>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
