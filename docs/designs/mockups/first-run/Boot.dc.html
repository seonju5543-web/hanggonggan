<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Pretendard Variable', Pretendard, 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    a { color: #8a6a1f; } a:hover { color: #6d541a; }

    /* 부팅 화면 = 인트로 (2026-10-04 개발자 승인 — 소개 영상 1:05~1:09 엔딩 · 캔버스 시안 A안 「밝은 인트로 · 페이드」 ·
       같은 날 "선이 그려지는 에니메이션 -> 페이드아웃 효과 전체로 통일"). **켤 때마다** 이 한 벌이다.
       앱이 그려지는 동안은 빈 덮개 → 앱이 다 되고 손이 비면 인트로 → 0.35초 정지 → 페이드.
       앱(style.css '인트로' 절)과 **같은 값**이다 — 관문 test-collector '첫 실행 화면' 절이 길이·늦추기를 하나씩 대조한다.
       시안에서는 되풀이한다(앱은 한 번). */
    .m-cover { --boot-fade: 400ms; }
    .m-dot { fill: #d9b56a; opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; }
    .m-logo, .m-word { opacity: 0; }
    .m-logo path { stroke-dasharray: 1; stroke-dashoffset: 1; }
    .m-run .m-logo { animation: boot-intro-logo 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s both; }
    .m-run .m-logo path:nth-of-type(1) { animation: boot-intro-draw 0.5s ease-in-out 0.25s both; }
    .m-run .m-logo path:nth-of-type(2) { animation: boot-intro-draw 0.5s ease-in-out 0.4s both; }
    .m-run .m-logo path:nth-of-type(3) { animation: boot-intro-draw 0.4s ease-in-out 0.55s both; }
    .m-run .m-dot { animation: boot-intro-dot 0.2s ease-out 0.95s both; }
    .m-run .m-word { animation: boot-intro-word 0.35s ease-out 1s both; }
    @keyframes boot-intro-logo { from { opacity: 0; transform: scale(0.82); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
    @keyframes boot-intro-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes boot-intro-dot { 0% { opacity: 1; transform: scale(0); } 60% { opacity: 1; transform: scale(1.25); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes boot-intro-word { from { opacity: 0; transform: translateY(6px); filter: blur(10px); } to { opacity: 1; transform: none; filter: none; } }
    .m-cover.m-fade { opacity: 0; transition: opacity var(--boot-fade) cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; }
    .m-cover.m-fade .m-logo, .m-cover.m-fade .m-word { opacity: 1; animation: boot-fade-out var(--boot-fade) cubic-bezier(0.4, 0, 0.2, 1) both; }
    .m-cover.m-fade .m-logo path { stroke-dashoffset: 0; animation: none; }
    .m-cover.m-fade .m-dot { opacity: 1; animation: none; }
    @keyframes boot-fade-out { to { transform: scale(1.04); filter: blur(6px); } }
    @media (prefers-reduced-motion: reduce) {
      .m-logo, .m-word, .m-run .m-logo, .m-run .m-word { animation: none; opacity: 1; }
      .m-logo path, .m-run .m-logo path { animation: none; stroke-dashoffset: 0; }
      .m-dot, .m-run .m-dot { animation: none; opacity: 1; }
      .m-cover { --boot-fade: 0ms; }
      .m-cover.m-fade { transition: none; }
    }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #fefdfc; overflow: hidden; position: relative;">
  <!-- 덮개 밑의 홈 — 걷힘이 '무엇을 드러내는가'를 보이려는 자리표시일 뿐이다 -->
  <div style="position: absolute; inset: 0; padding: 60px 20px 0; color: #23201a;">
    <div style="font-size: 15px; font-weight: 700;">이름 설정 <span style="font-weight: 400; color: #7a746a; font-size: 12px;">한국외국어대학교</span></div>
    <div style="margin-top: 18px; border-radius: 22px; background: #23201a; color: #f6f0e2; padding: 22px 20px 20px;">
      <div style="font-size: 12px; opacity: .8;">지금 신청할 수 있는 장학금</div>
      <div style="font-size: 26px; font-weight: 800; margin-top: 4px;">최대 1,405만원</div>
      <div style="margin-top: 16px; background: #fefdfc; color: #23201a; border-radius: 14px; padding: 12px; text-align: center; font-weight: 700; font-size: 14px;">15건 신청 준비</div>
    </div>
    <div style="margin-top: 22px; font-size: 13px; font-weight: 700;">마감 임박</div>
    <div style="margin-top: 10px; height: 64px; border-bottom: 2px solid #b8552f;"></div>
    <div style="margin-top: 12px; height: 64px; border-bottom: 2px solid #b8552f;"></div>
  </div>
<div class="m-cover" style="position: absolute; inset: 0; background: #fefdfc; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;">

  <div class="m-logo" style="width: 88px; height: 88px; border-radius: 27px; color: #f6f0e2; display: flex; align-items: center; justify-content: center; background: radial-gradient(120% 130% at 78% -18%, rgba(184, 145, 47, 0.20) 0%, rgba(184, 145, 47, 0) 58%), radial-gradient(90% 90% at -10% 108%, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0) 60%), #23201a;">
    <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M22 10L12 5 2 10l10 5 10-5z"/><path pathLength="1" d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/><path pathLength="1" d="M22 10v6"/><circle class="m-dot" cx="22" cy="16.9" r="1.1" stroke="none"/></svg>
  </div>

  <div class="m-word" style="font-size: 38px; font-weight: 800; letter-spacing: -0.035em; color: #23201a; line-height: 1;">한대장</div>
</div>

</div>
<script>
  /* 부팅을 되풀이해 보여 준다 — 앱은 한 번만 한다. 빈 덮개(앱이 그려지는 동안 · 시안은 APP_LOAD_MS 로 흉내)
     → 돌기 시작 → INTRO_SHOW_MS 뒤 페이드.
     🔴 INTRO_SHOW_MS 는 boot.js `BOOT_INTRO_SHOW_MS` 와 같아야 한다(관문이 대조한다).
     페이드 길이는 boot.js 처럼 CSS 에서 읽는다. */
  (function () {
    var INTRO_SHOW_MS = 1700;
    var c = document.querySelector('.m-cover'); if (!c) return;
    var ms = function (name) {
      var v = String(getComputedStyle(c).getPropertyValue(name) || '').trim();
      var n = parseFloat(v) || 0; return /[^m]s$/.test(v) ? n * 1000 : n;
    };
    var APP_LOAD_MS = 800;   /* 시안에서 흉내 내는 '앱이 그려지는 시간' — 기기마다 다르다 */
    function cycle() {
      c.classList.remove('m-run', 'm-fade'); c.style.visibility = '';
      void c.offsetWidth;   /* 애니메이션을 처음부터 다시 돌리려면 한 번 그려야 한다 */
      setTimeout(function () {
        c.classList.add('m-run');
        setTimeout(function () {
          c.classList.add('m-fade');
          setTimeout(function () { c.style.visibility = 'hidden'; }, ms('--boot-fade'));
        }, INTRO_SHOW_MS);
      }, APP_LOAD_MS);
    }
    var go = function () { cycle(); setInterval(cycle, APP_LOAD_MS + INTRO_SHOW_MS + 2400); };
    try { document.fonts.load('800 38px "Noto Sans KR"', '한대장').then(go, go); } catch (e) { go(); }
  })();
</script>
</x-dc>
</body>
</html>
