<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Pretendard Variable', Pretendard, 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    a { color: #8a6a1f; } a:hover { color: #6d541a; }

    /* 등장 움직임 — 앱(style.css '부팅 화면' 절)과 같은 값이다.
       한 번만 나타나고 멈춘다 · 0.56초에 끝나 화면이 걷히기 전 0.44초가 고요하다 ·
       되튐 없는 감속 곡선 하나. 계속 도는 것은 아래 표시 하나뿐이고, 그것도 1.2초 뒤에야
       나타난다(앱이 제때 오면 학생은 못 본다 — 그게 맞다). */
    .m-logo { animation: boot-in-logo 0.44s cubic-bezier(0.22, 0.61, 0.36, 1) 0.02s both; }
    .m-word { animation: boot-in-word 0.40s cubic-bezier(0.22, 0.61, 0.36, 1) 0.16s both; }
    .m-spin {
      opacity: 0;
      animation: boot-spin 0.8s linear infinite, boot-spin-in 0.3s ease 1.2s forwards;
    }
    @keyframes boot-in-logo {
      from { opacity: 0; transform: scale(0.94) translateY(6px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes boot-in-word {
      from { opacity: 0; transform: translateY(9px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @keyframes boot-spin-in { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .m-logo, .m-word { animation: none; }
      .m-spin { animation: none; opacity: 1; }
    }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #fefdfc; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; overflow: hidden; position: relative;">

  <div class="m-logo" style="width: 88px; height: 88px; border-radius: 27px; color: #f6f0e2; display: flex; align-items: center; justify-content: center; background: radial-gradient(120% 130% at 78% -18%, rgba(184, 145, 47, 0.20) 0%, rgba(184, 145, 47, 0) 58%), radial-gradient(90% 90% at -10% 108%, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0) 60%), #23201a;">
    <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/><path d="M22 10v6"/></svg>
  </div>

  <div class="m-word" style="font-size: 38px; font-weight: 800; letter-spacing: -0.035em; color: #23201a; line-height: 1;">한대장</div>

  <div style="position: absolute; left: 0; right: 0; bottom: 92px; display: flex; justify-content: center;">
    <div class="m-spin" style="width: 26px; height: 26px; border-radius: 999px; border: 2px solid rgba(25, 23, 19, 0.10); border-top-color: rgba(25, 23, 19, 0.34);"></div>
  </div>

</div>
</x-dc>
</body>
</html>
